records:
  - record_key: ORDER-FULFILLMENT-001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process purchase orders from the Java Pet Store
      asynchronously via message-driven bean (PurchaseOrderMDB) listening
      on a JMS Queue, parsing the XML message, creating a PurchaseOrder
      entity, and initiating the order fulfillment workflow.
    confidence: high
    confidence_basis: >
      PurchaseOrderMDB is declaratively configured as a message-driven bean
      in ejb-jar.xml with Queue destination type and Container-managed
      transaction handling. Both the configuration and code implementation
      (MessageDrivenBean, MessageListener interfaces, onMessage handler)
      provide consistent evidence.
    risk_class: operational
    basis: >
      The MDB receives TextMessage from a queue, invokes doWork() which
      parses XML and creates PurchaseOrder via poHome.create(). Process
      manager tracks order state transitions starting with PENDING status.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 111
        line_end: 125
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>PurchaseOrderMDB</display-name>
            <ejb-name>PurchaseOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.PurchaseOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 66
        line_end: 79
        excerpt: |
          /**
           * Message Driven Bean receives a JMS message containing a purchase order
           * from a customer placing an order at Java Pet Store. It creates the
           * POEJB to begin the process of fulfilling the order.
           */
          public class PurchaseOrderMDB implements MessageDrivenBean, MessageListener {
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required
      jms.queue: jms/PurchaseOrderQueue

  - record_key: ORDER-FULFILLMENT-002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order from Java Pet Store, WHEN the order total
      price is less than 500 USD for US locale OR less than 50000 JPY
      for Japan locale, THEN the system SHALL automatically approve the
      order and send approval notification; OTHERWISE the system SHALL
      defer to administrator approval via manual workflow.
    confidence: high
    confidence_basis: >
      The auto-approval logic is implemented in canIApprove() method which
      compares purchaseOrder.getTotalPrice() against hardcoded thresholds
      based on locale. The logic is centralized in one method and directly
      controls the workflow branching.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.onMessage() calls doWork() which invokes canIApprove()
      before creating an OrderApproval message. The thresholds are locale-aware
      and control the automatic vs. manual approval path.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 178
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 114
        line_end: 126
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage recdTM = null;
            String recdText = null;
            String approval = null;
            try {
              recdTM = (TextMessage)recvMsg;
              recdText = recdTM.getText();
              approval = doWork(recdText);

              //if order approve/deny list !empty, send it to customer relations
              if(approval != null) {
                doTransition(approval);
              } //else wait for admin to approve/deny orders
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: ORDER-FULFILLMENT-003
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL receive order approval decisions (APPROVED or DENIED)
      from the admin system via OrderApprovalMDB message queue, update the
      corresponding PurchaseOrder entity status, and for all approved orders
      generate and send supplier purchase orders to the fulfillment partner.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB is declaratively configured with Queue destination type
      and Required transaction semantics. The onMessage() implementation calls
      doWork() which processes OrderApproval XML and generates supplier orders,
      providing dual declarative and programmatic evidence.
    risk_class: operational
    basis: >
      MDB parses OrderApproval XML via OrderApproval.fromXML(), iterates
      through changed orders, updates PurchaseOrder status in database, and
      creates TPASupplierOrderXDE for supplier integration.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 298
        line_end: 306
        excerpt: |
          <message-driven>
            <description>opc node to process OrderApprovals from the Admin</description>
            <display-name>OrderApprovalMDB</display-name>
            <ejb-name>OrderApprovalMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.OrderApprovalMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 78
        line_end: 95
        excerpt: |
          /**
           * OrderApprovalMDB gets a JMS message containing a list of
           * orders that has been updated. It updates the POEJB state
           * based on the status of the orders. For all approved orders
           * a supplier purchase order is built and sent to a supplier,
           * and a batch of order approval status notices to the customer
           * relations department to handle sending an email can to customers.
           */
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      ejb.transaction: Required
      jms.queue: jms/OrderApprovalQueue

  - record_key: ORDER-FULFILLMENT-004
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL receive invoice messages from third-party suppliers
      (TPA) via InvoiceMDB listening on a JMS Topic, parse the supplier
      invoice XML, and update the corresponding PurchaseOrder entity status
      to track fulfillment progress.
    confidence: high
    confidence_basis: >
      InvoiceMDB is configured as a message-driven bean with Topic destination
      (pub/sub semantics for supplier broadcasts). The configuration explicitly
      declares Topic and Required transaction handling. Code implements
      MessageListener interface to consume messages.
    risk_class: operational
    basis: >
      InvoiceMDB receives JMS messages from supplier Topic, uses TPAInvoiceXDE
      to parse XML documents with optional XSD validation, and updates
      PurchaseOrder status based on shipment data.
