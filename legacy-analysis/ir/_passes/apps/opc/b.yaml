  - record_key: ADMIN-OPERATIONS-001
    kind: integration
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a stateless session bean facade (OPCAdminFacadeEJB)
      that exposes two remote business methods for admin queries: (1)
      getOrdersByStatus(String) to retrieve all purchase orders matching a
      status filter, and (2) getChartInfo(String, Date, Date, String) to
      aggregate financial and quantity analytics over a date range.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB is explicitly declared as a stateless session bean in
      ejb-jar.xml with remote home and remote interfaces. Both business methods
      are declared with explicit method-level transaction semantics in the
      assembly-descriptor.
    risk_class: operational
    basis: >
      The session bean is configured with remote interfaces and methods are
      protected by container-managed transactions with Required attribute.
      The methods interact with ProcessManager and PurchaseOrder EJBs.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 50
        line_end: 58
        excerpt: |
          <session>
