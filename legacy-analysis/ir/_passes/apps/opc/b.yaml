  - record_key: ORDER-FULFILLMENT-007
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support pluggable transition delegate implementations
      for OrderApprovalMDB to enable runtime selection of supplier order
      routing strategies. The TransitionDelegate class name is resolved
      at bean creation time via JNDI lookup (param/transitiondelegate/OrderApprovalTD)
