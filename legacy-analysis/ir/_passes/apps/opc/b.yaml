  - record_key: NOTIFICATIONS-001
    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL send email notifications to customers at three key
      points: (1) when an invoice is received from a supplier via MailInvoiceMDB
      listening on InvoiceTopic, (2) when an order approval or denial decision
      is made via MailOrderApprovalMDB listening on a queue, and (3) when an
      order is completed and ready for fulfillment via MailCompletedOrderMDB
      listening on a queue. Email sending is configurable and may be toggled
      independently per notification type.
    confidence: high
    confidence_basis: >
      Three customer relations MDBs are declaratively configured in ejb-jar.xml
      as separate message-driven beans with distinct destinations (one Topic for
      invoices, two Queues for approvals and completion). Each has an env-entry
      parameter to control email sending. Configuration is explicit and complete.
    risk_class: operational
    basis: >
      MailInvoiceMDB, MailOrderApprovalMDB, and MailCompletedOrderMDB are
      configured with Container-managed transactions and Required attribute.
      Each listens on a different queue/topic and includes a SendXXXMail boolean
      parameter to enable/disable the notification.
