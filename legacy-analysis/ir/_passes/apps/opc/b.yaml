findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The comment on line 105-110 describes "small orders" that are approved
      automatically and "larger orders" that wait for admin, but the exact
      threshold values are buried in the canIApprove() method as locale-aware
      hardcoded constants (500 for US, 50000 for Japan). No configuration,
      comment explaining the basis for these thresholds, or test coverage is
      visible. These are bare financial thresholds that need business
      justification.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      The getOrdersByStatus() method uses deprecated java.util.Date methods
      (getMonth(), getDate(), getYear()) to format order dates as (month+1)/date/(year+1900).
      This is fragile: the method assumes poDate is a long millisecond timestamp,
      getMonth() is 0-indexed, and getYear() returns years since 1900. No validation
      ensures the date is non-null or correctly formatted before display.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >
      Lines 406 and 496 both contain identical description text "opc node to process
      Invoice from the Supplier" for MailInvoiceMDB (line 406) and MailOrderApprovalMDB
      (line 496). MailOrderApprovalMDB processes order approvals, not invoices.
      This is a copy-paste error in the configuration documentation.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
    description: >
      The comment at lines 176-182 states that InvoiceMDB "If all the order items
      have been shipped for the order, it updates the purchase order status to
      COMPLETED". However, the implementation logic that verifies "all items shipped"
      is not included in the extracted source. The join condition and comparison
      algorithm remain unresolved.
