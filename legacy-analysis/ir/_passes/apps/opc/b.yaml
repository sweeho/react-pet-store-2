            <ejb-name>InvoiceMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.InvoiceMDB</ejb-class>
            <transaction-type>Container</transaction-type>

            <message-driven-destination>
              <destination-type>javax.jms.Topic</destination-type>
            </message-driven-destination>
    stack_metadata:
      ejb.bean: InvoiceMDB
      ejb.transaction: Required
      jms.topic: jms/InvoiceTopic

  - record_key: ORDER-FULFILLMENT-005
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN a PurchaseOrder receives an invoice indicating all line items
      have been shipped (verified by comparing invoice quantities against
      original order quantities), THEN the system SHALL mark the order
      status as COMPLETED; OTHERWISE the system SHALL update status to
      PARTIALLY_COMPLETED to indicate partial fulfillment.
    confidence: medium
    confidence_basis: >
      The InvoiceMDB comment documents the completion logic (lines 176-182),
      but the specific join condition and comparison logic for "all items shipped"
      is not visible in the extracted source. The rule is inferred from the
      comment but implementation details are incomplete.
    risk_class: operational
    basis: >
      InvoiceMDB processes invoice messages and updates PurchaseOrder status
      based on shipment verification. Comment indicates both COMPLETED and
      PARTIALLY_COMPLETED states are possible outcomes.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 176
        line_end: 183
        excerpt: |
          /**
           * InvoiceMDB receives a JMS message containing an Invoice
           * for a user order. If all the order items have been shipped
           * for the order, it updates the purchase order status to
           * COMPLETED to end the purchase order fulfillment process.
           * If the order is not yet all shipped, it updates the order
           * status based on the invoice.
           */
    stack_metadata:
      ejb.bean: InvoiceMDB
      db.object: PurchaseOrder

