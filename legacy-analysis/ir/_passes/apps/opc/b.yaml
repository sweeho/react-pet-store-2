  - record_key: ADMIN-OPERATIONS-002
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      WHEN an admin requests order status query via getOrdersByStatus(String),
      the system SHALL iterate through ProcessManager results to find matching
      orders, locate the corresponding PurchaseOrder entities by primary key,
      extract order details (ID, user ID, date, value, status), and return
      them as OrderDetails transfer objects.
    confidence: medium
    confidence_basis: >
      The implementation shows the filtering and lookup logic explicitly. However,
      error handling treats FinderException uniformly without distinguishing
      between missing order and lookup failure. Date formatting uses deprecated
      java.util.Date methods which are fragile.
    risk_class: operational
    basis: >
      getOrdersByStatus() calls processManager.getOrdersByStatus(status),
      iterates over ManagerLocal results, and resolves each via
      pohome.findByPrimaryKey(). Date is formatted as (month+1)/date/(year+1900).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 149
        excerpt: |
          public OrdersTO getOrdersByStatus(String status)
                                                    throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();

              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      db.object: PurchaseOrder

  - record_key: ADMIN-OPERATIONS-003
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      GIVEN a request type "REVENUE" and a date range, the system SHALL
      aggregate line item revenues by computing (quantity × unit price)
      for all line items in orders within the date range. When category
      parameter is null, results SHALL be grouped by top-level product
      category ID; when category is specified, results SHALL be grouped
      by individual item ID and filtered to the category.
    confidence: medium
    confidence_basis: >
      The getChartInfo() implementation shows explicit revenue computation
      and category-based grouping logic. However, floating-point precision
      implications and rounding strategy for monetary values are not
      documented. Results are stored as Float objects without precision
      specification.
    risk_class: financial
    basis: >
      The method iterates over LineItem collections from PurchaseOrders,
      computes (quantity * unitPrice), and stores results in HashMap as
      Float values. Grouping key changes based on categ parameter value.
