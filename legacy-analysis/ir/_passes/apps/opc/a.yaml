    confidence_basis: >
      The code comment in PurchaseOrderMDB explicitly documents this threshold-based
      auto-approval logic, but the actual threshold value and its authoritative
      source were not found in configuration or schema. The logic is implemented
      programmatically.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.onMessage() delegates order processing to doWork() method.
      The method comment at line 108-110 describes the threshold-based behavior
      and the routing to OrderApprovalMDB queue for approved orders.
