  - record_key: ORDER-FULFILLMENT-004
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL track and update order fulfillment status when invoices
      are received from suppliers (TPA). WHEN all line items for an order have
      been shipped according to the invoice, THEN the system SHALL mark the
      order as COMPLETED; OTHERWISE the system SHALL update the order to
      PARTIALLY_COMPLETED status.
    confidence: high
    confidence_basis: >
      InvoiceMDB is explicitly configured and its behavior is documented in both
      the bean configuration and code comments. The completion logic is conditional
      on total shipment verification.
    risk_class: operational
    basis: >
      InvoiceMDB processes supplier invoice messages from a JMS Topic. The
      configuration and implementation document the join condition where all items
      must be shipped before order completion.
