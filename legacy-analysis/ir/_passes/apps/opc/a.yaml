records:
  - record_key: ORDER-FULFILLMENT-001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process purchase orders received from the Java Pet Store
      in an asynchronous message-driven workflow, creating a PurchaseOrder EJB
      to track fulfillment state.
    confidence: high
    confidence_basis: >
      The PurchaseOrderMDB is the entry point for order processing and is
      explicitly configured in ejb-jar.xml with transaction semantics. Both
      the declarative configuration (message-driven bean definition) and
      programmatic implementation (ejbCreate, onMessage) confirm this workflow.
    risk_class: operational
    basis: >
      The PurchaseOrderMDB receives JMS TextMessages, parses purchase order XML,
      and creates PurchaseOrder entities. The workflow is declaratively
      configured with transaction type Container and trans-attribute Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 110
        line_end: 135
        excerpt: |
          <!-- Process recieving a PO from the Java Pet Store Start-->
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>PurchaseOrderMDB</display-name>
            <ejb-name>PurchaseOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.PurchaseOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 66
        line_end: 75
        excerpt: |
          /**
           * Message Driven Bean receives a JMS message containing a purchase order
           * from a customer placing an order at Java Pet Store. It creates the
           * POEJB to begin the process of fulfilling the order.
           */
          public class PurchaseOrderMDB implements MessageDrivenBean, MessageListener {

