  - record_key: ORDER-FULFILLMENT-007
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support dynamic configuration of TransitionDelegate
      implementations for OrderApprovalMDB, allowing the transition strategy
      (how approved orders are routed to suppliers) to be selected at runtime
      via JNDI lookup of a class name string.
    confidence: medium
    confidence_basis: >
      The OrderApprovalMDB code retrieves a transition delegate class name from
      ServiceLocator (JNDI) and uses a factory pattern to instantiate it. The
      configuration parameter is declared but the actual class name is not
      visible in the extracted source.
    risk_class: operational
    basis: >
      OrderApprovalMDB.ejbCreate() retrieves the transition delegate class name
      from JNDI and instantiates it via TransitionDelegateFactory. This allows
      swapping supplier order routing logic without redeployment.
