    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL require authentication before granting access to
      supplier portal functionality.
    confidence: high
    confidence_basis: >
      Both declarative and programmatic authentication enforcement visible.
      Form-based login configured in web.xml with login/error JSPs. Servlet
      explicitly checks user role. Consistent across both layers.
    risk_class: operational
    basis: >
      Form-based login with username/password field names j_username and
      j_password; configured error pages on authentication failure.
