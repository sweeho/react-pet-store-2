  - record_key: SM-AUTHZ-0001
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL restrict inventory receipt and update operations to
      users in the administrator role.
    confidence: high
    confidence_basis: >
      Role restriction declared in web.xml security-constraint for
      RcvrRequestProcessor servlet, and programmatically verified in both
      JSP (request.isUserInRole) and Java servlet code. Double enforcement
      indicates this is a load-bearing rule.
    risk_class: operational
    basis: >
      RcvrRequestProcessor servlet mapped to /RcvrRequestProcessor URL and
      restricted to administrator role in security-constraint. JSP code
      checks isUserInRole("administrator") before rendering inventory
      update form. Unauthorized users see denial message.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/WEB-INF/web.xml
        line_start: 91
        line_end: 104
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/RcvrRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
          </security-constraint>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
        line_start: 66
        line_end: 128
        excerpt: |
          <%
          if(request.isUserInRole("administrator")) {
          %>
          ...form to update inventory...
          <%
          } else {
          %>
          <font size="5" color="green">
          You are not authorised to update the status of orders.
          </font>
          <%
          }
          %>
    stack_metadata:
      web_resource_pattern: /RcvrRequestProcessor
      required_role: administrator

  - record_key: SM-INV-0001
    kind: entity
    capability_key: supplier-management
    requirement: >
      The system SHALL maintain inventory records with item identifier and
      quantity on hand.
    confidence: high
    confidence_basis: >
      Entity defined in ejb-jar.xml with abstract CMP fields, implemented
      in InventoryEJB with concrete accessors and storage semantics.
      Reachable via home interface with findAllInventoryItems() finder.
    risk_class: operational
    basis: >
      InventoryEJB is a container-managed entity bean with itemId as
      primary key (String) and quantity as CMP field (int). Defined in
      ejb-jar.xml with CMP version 2.x and abstract schema "Inventory".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 49
        line_end: 81
        excerpt: |
          <entity>
            <description>Inventory CMP EJB</description>
            <display-name>InventoryEB</display-name>
            <ejb-name>InventoryEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-field>
              <field-name>itemId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantity</field-name>
            </cmp-field>
            <primkey-field>itemId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 49
        line_end: 85
        excerpt: |
          public abstract class InventoryEJB implements EntityBean {
            public abstract String getItemId();
            public abstract void setItemId(String itemId);
            public abstract int getQuantity();
            public abstract void setQuantity(int quantity);
            public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
            }
    stack_metadata:
      ejb_bean: InventoryEJB
      bean_type: entity
      persistence: container-managed
      primary_key_type: String
      primary_key_field: itemId

