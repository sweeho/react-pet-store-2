  - record_key: SM-PO-0004
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      WHEN all line items in a purchase order have been processed and all items
      were available, the system SHALL mark the purchase order status as COMPLETED.
      If any items were unavailable, the order status SHALL remain in its current state.
    confidence: medium
    confidence_basis: >
      Status update logic is visible but allItemsAvailable flag only set to false,
      never reset to true. Condition in code (if(allItemsAvailable)
      po.setPoStatus(...)) is clear but relies on initial true value and multiple
      items available. No explicit handling of partial shipment continuation is documented.
    risk_class: operational
    basis: >
      processAnOrder() initializes allItemsAvailable to true, sets to false on
      first inventory miss. After loop completes, only calls
      po.setPoStatus(OrderStatusNames.COMPLETED) if allItemsAvailable still true.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              ...
              while((liIt != null) && (liIt.hasNext())) {
                ...
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                ...
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
