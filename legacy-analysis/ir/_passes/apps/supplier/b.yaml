  - record_key: SM-INV-0004
    kind: workflow
    capability_key: supplier-management
    requirement: >
      GIVEN an authorized administrator receives new inventory items,
      WHEN inventory quantities are updated via the receiver portal,
      THEN the system SHALL attempt to fulfill any purchase orders that are in
      PENDING status by checking the newly updated inventory, create invoices
      for items that can now be shipped, and send those invoices to the order
      processing center.
    confidence: high
    confidence_basis: >
      Workflow documented in RcvrRequestProcessor servlet doPost() for
      "updateinventory" action: calls updateInventory(), then
      procPO.processPendingPO(), then sendInvoices(). ProcessPendingPO() explicitly
      queries for PENDING status orders. All within single user transaction.
    risk_class: operational
    basis: >
      RcvrRequestProcessor doPost() receives currentScreen="updateinventory"
      parameter. Calls updateInventory() to parse form parameters, then calls
      OrderFulfillmentFacadeEJB.processPendingPO() which finds all orders
      with status PENDING, calls processAnOrder() on each, and returns collection
      of generated invoices.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 166
        line_end: 214
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
              String curScreen = req.getParameter("currentScreen").trim();
              if(curScreen.equals("updateinventory")) {
                UserTransaction ut = null;
                try {
                  InitialContext ic = new InitialContext();
                  ut = (UserTransaction) ic.lookup(JNDINames.USER_TRANSACTION);
                  ut.begin();
                  updateInventory(req);
                  Collection invoices = procPO.processPendingPO();
                  sendInvoices(invoices);
                  ut.commit();
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();
            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
    stack_metadata:
      servlet: RcvrRequestProcessor
      facade_method: processPendingPO
      order_status_query: findOrdersByStatus

  - record_key: SM-PO-0005
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      WHEN line items cannot be fulfilled due to insufficient inventory or
      other error conditions, the purchase order SHALL be persisted so that
      fulfillment can be attempted again when inventory becomes available.
    confidence: high
    confidence_basis: >
      Order persisted before fulfillment attempt (order =
      supplierOrderLocalHome.create(supplierOrder)). If processAnOrder() throws
      exception, order already committed to storage. If processAnOrder() returns
      null invoice, order remains in storage with status unchanged. Allows
      retry via processPendingPO().
    risk_class: operational
    basis: >
      processPO() creates the order entity before calling processAnOrder().
      Order creation is independent of order processing outcome. Even if
      invoice generation fails (XMLDocumentException caught), order persists
      and null is returned for no shipment.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;

  - record_key: SM-INT-0001
    kind: integration
    capability_key: supplier-management
    requirement: >
      The system SHALL send invoices to the order processing center via JMS Topic
      when purchase orders are fulfilled and items are shipped.
    confidence: high
    confidence_basis: >
      Integration point is programmatically implemented via TransitionDelegate
      pattern. SupplierOrderTD.doTransition() creates TopicSender and publishes
      XML invoice message to INVOICE_MDB_TOPIC. Both MDB-driven (onMessage) and
      web-driven (RcvrRequestProcessor sendInvoices) fulfill integrate through
      same path.
    risk_class: operational
    basis: >
      SupplierOrderMDB and RcvrRequestProcessor both call doTransition() with
      TransitionInfo wrapping XML invoice. SupplierOrderTD instantiates TopicSender
      with TopicConnectionFactory and Topic from JNDI. TopicSender.sendMessage()
      creates TopicConnection, session, publisher, creates TextMessage, publishes to topic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/SupplierOrderTD.java
        line_start: 58
        line_end: 84
        excerpt: |
          public void setup() throws TransitionException {
            try {
              ServiceLocator servicelocator = new ServiceLocator();
              topicFactory = servicelocator.getTopicConnectionFactory(JNDINames.TOPIC_CONNECTION_FACTORY);
              topic = servicelocator.getTopic(JNDINames.INVOICE_MDB_TOPIC);
              invoiceTopicSender = new TopicSender(topicFactory, topic);
            }
          }
          public void doTransition(TransitionInfo info) throws TransitionException {
            String xmlInvoice = info.getXMLMessage();
            try {
              invoiceTopicSender.sendMessage(xmlInvoice);
            }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/TopicSender.java
        line_start: 73
        line_end: 93
        excerpt: |
          public void sendMessage(String xmlMessage) throws JMSException {
            TopicConnection topicConnect  = null;
            TopicSession pubSession       = null;
            TopicPublisher topicPublisher = null;
            try {
              topicConnect = topicFactory.createTopicConnection();
              pubSession = topicConnect.createTopicSession(false,
                                                    Session.AUTO_ACKNOWLEDGE);
              topicPublisher = pubSession.createPublisher(topic);
              TextMessage jmsMsg = pubSession.createTextMessage();
              jmsMsg.setText(xmlMessage);
              topicPublisher.publish(jmsMsg);
    stack_metadata:
      jms_resource: TopicConnectionFactory
      jms_destination: Topic
      message_type: TextMessage
      ack_mode: AUTO_ACKNOWLEDGE

