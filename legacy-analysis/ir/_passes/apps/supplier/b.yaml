  - record_key: SM-INV-0003
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL allow authorized administrators to update inventory
      quantities for items, with negative quantities rejected. Quantity
      updates SHALL only be applied when checkbox is checked for that item.
    confidence: medium
    confidence_basis: >
      Form field and parameter parsing logic is clear and programmatic;
      checkbox-based selection is visible in JSP and processed in servlet.
      However, requirement to reject negative quantities is validated
      inline (>= 0 check) with no documented business rationale in code.
    risk_class: operational
    basis: >
      RcvrRequestProcessor servlet updateInventory() method iterates
      parameter names looking for "item_" prefix. Extracts quantity from
      "qty_<itemId>" parameter. Parses as Integer and checks intValue >= 0
      before calling setQuantity(). Only processes if both item checkbox
      and qty value present.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
        line_start: 97
        line_end: 103
        excerpt: |
          <td><input type="text"
             name="<%= "qty_"+ anItem.getItemId() %>"
             size="6"></td>
          <td align="center">
              <input type=checkbox
              name="<%= "item_"+ anItem.getItemId() %>"
              value="false"></td>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |
          private void updateInventory(HttpServletRequest req) {
            String itemId;
            InventoryLocal inventory;
            try {
              Enumeration e = req.getParameterNames();
              while ((e != null) && e.hasMoreElements()) {
                String param = ((String)e.nextElement()).trim();
                if ((param != null) && param.startsWith("item_")) {
                  itemId = param.substring("item_".length(),param.length());
                  if(itemId != null) {
                    String newQty = req.getParameter("qty_" + itemId);
                    if((newQty == null) || (newQty.length() <= 0))
                      continue;
                    Integer qty = new Integer(newQty);
                    if(qty.intValue() >= 0 ) {
                      inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                      inventory.setQuantity(qty.intValue());
                    }
                  }
                }
              }
    stack_metadata:
      web_form_action: RcvrRequestProcessor
      form_method: POST
      hidden_param_action: updateinventory

  - record_key: SM-PO-0001
    kind: workflow
    capability_key: supplier-management
    requirement: >
      GIVEN a Purchase Order is received from the order processing center
      via JMS queue, WHEN the SupplierOrderMDB message listener processes it,
      THEN the system SHALL convert the order XML to a SupplierOrder entity,
      persist it, and attempt to fulfill it by checking inventory availability,
      reducing inventory for shipped items, and creating an invoice for
      items that could be shipped.
    confidence: high
    confidence_basis: >
      Core workflow documented in both MDB onMessage() and OrderFulfillmentFacade
      processPO(). Sequence of steps and conditions clear from code flow.
      Both message-driven and web-initiated entry points follow same logic.
    risk_class: operational
    basis: >
      SupplierOrderMDB receives TextMessage containing XML PO, extracts text,
      calls OrderFulfillmentFacadeLocal.processPO(xmlMessage). Facade converts
      XML to SupplierOrder object via TPASupplierOrderXDE, persists via
      supplierOrderLocalHome.create(), then calls processAnOrder() which
      iterates line items, checks inventory for each, reduces quantities,
      marks items as shipped, and creates invoice if items available.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              String invoice = doWork(recdText);
              if(invoice!=null) {
                doTransition(invoice);
              }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
    stack_metadata:
      mdb: SupplierOrderMDB
      session_bean: OrderFulfillmentFacadeEJB
      transaction_type: container-managed

  - record_key: SM-PO-0002
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      GIVEN a line item in a purchase order, WHEN attempting to fulfill the order,
      THEN the system SHALL check whether inventory quantity for that item is
      greater than or equal to the quantity requested in the line item. If
      insufficient inventory, the line item SHALL NOT be fulfilled and the
      system SHALL continue processing other items.
    confidence: high
    confidence_basis: >
      Inventory check logic in checkInventory() method is explicit: compares
      inv.getQuantity() < item.getQuantity() and returns false if insufficient.
      Caller processAnOrder() continues iteration on false return. Behavior
      is deterministic and enforced by CMP entity bean transaction boundaries.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.checkInventory(LineItemLocal item) method
      looks up inventory by item.getItemId(), compares getQuantity() to
      item.getQuantity(), returns false if inv.quantity < line_item.quantity.
      Caller sets allItemsAvailable flag to false and continues loop.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
    stack_metadata:
      check_method: checkInventory
      entity_lookup: InventoryLocal
      finder_method: findByPrimaryKey

  - record_key: SM-PO-0003
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      WHEN inventory is confirmed available for a line item, the system SHALL
      atomically reduce the inventory quantity by the line item quantity and
      mark the line item as shipped.
    confidence: high
    confidence_basis: >
      checkInventory() calls inv.reduceQuantity(item.getQuantity()) when
      inventory is sufficient. processAnOrder() then calls
      li.setQuantityShipped(li.getQuantity()). Both operations happen within
      the same transaction context (Required transaction attribute on processPO).
    risk_class: operational
    basis: >
      InventoryEJB.reduceQuantity(int quantity) method subtracts quantity
      parameter from getQuantity(). setQuantity() is called which triggers
      CMP persistence. LineItem.setQuantityShipped() called after inventory
      reduction confirms.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 82
        line_end: 85
        excerpt: |
          public void reduceQuantity(int quantity) {
