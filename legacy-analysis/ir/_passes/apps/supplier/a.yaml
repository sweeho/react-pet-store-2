  - record_key: SUPM-ENT-0001
    kind: entity
    capability_key: supplier-management
    requirement: >
      The system SHALL persist inventory as a collection of items, each identified
      by a unique itemId (String) with an associated quantity (integer).
    confidence: high
    confidence_basis: >
      Both ejb-jar.xml and InventoryEJB.java declare CMP fields for itemId (primary key)
      and quantity. The entity bean is deployed and query methods for finding all items
      are defined. Two independent sources (DDL-equivalent and Java code) agree on the schema.
    risk_class: operational
    basis: >
      InventoryEJB.java defines abstract getter/setter methods for itemId and quantity.
      ejb-jar.xml declares CMP fields and persistence type as Container, with itemId
      as the primary key.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 49
        line_end: 75
        excerpt: |
          public abstract class InventoryEJB implements EntityBean {
            public abstract String getItemId();
            public abstract void setItemId(String itemId);
            public abstract int getQuantity();
            public abstract void setQuantity(int quantity);
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 49
        line_end: 81
        excerpt: |
          <entity>
            <ejb-name>InventoryEJB</ejb-name>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
