  - record_key: OFUF-BIZ-0007
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL create an invoice XML document only for line items that
      were successfully fulfilled (i.e., for items where the full quantity was
      available and shipped). GIVEN a purchase order WHEN processing THEN the
      invoice SHALL contain only line items where checkInventory succeeded.
    confidence: high
    confidence_basis: >
      createInvoice() (lines 145-171) iterates over po.getLineItems() and checks
      if(newLis.containsKey(anItem.getItemId())) before adding to invoice.
      The newLis HashMap is populated only in processAnOrder (line 194) with items
      that passed checkInventory. If checkInventory fails, the item is not added to
      the HashMap and thus not included in the invoice.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.java:
      Line 182: HashMap items = new HashMap();
