  - record_key: OFUF-BIZ-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL mark a line item as shipped ONLY when its quantity is fully
      available in inventory. GIVEN a line item WHEN checkInventory passes THEN
      setQuantityShipped() SHALL be called with the full quantity; GIVEN a line
      item WHEN checkInventory fails THEN quantityShipped SHALL remain unchanged.
    confidence: high
    confidence_basis: >
      processAnOrder() (lines 185-196) shows conditional logic: checkInventory()
      is called first, and only if it returns true does the code proceed to
      li.setQuantityShipped(li.getQuantity()). If checkInventory returns false,
      the loop continues without setting quantityShipped.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.java lines 186-193:
      if(!checkInventory(li)) { allItemsAvailable = false; continue; }
      li.setQuantityShipped(li.getQuantity());
      The setQuantityShipped is unreachable if checkInventory fails.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 185
        line_end: 196
        excerpt: |
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() == li.getQuantityShipped())
              continue;
            if(!checkInventory(li)) {
              allItemsAvailable = false;
              continue;
            }
            li.setQuantityShipped(li.getQuantity());
            items.put(li.getItemId(), OrderStatusNames.COMPLETED);
    stack_metadata:
