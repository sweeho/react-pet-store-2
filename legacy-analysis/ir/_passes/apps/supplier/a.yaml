      fulfilled. GIVEN a line item that passes inventory check WHEN fulfilling
      THEN the inventory quantity SHALL be reduced by the line item quantity in
      a single transaction.
    confidence: high
    confidence_basis: >
      checkInventory() calls inv.reduceQuantity() immediately after confirming
      availability. The entire checkInventory/reduceQuantity sequence is wrapped
