  - record_key: SUPM-REQ-0002
    kind: requirement
    capability_key: supplier-management
    requirement: >
      The system SHALL validate that inventory quantity updates are non-negative.
      GIVEN a quantity update request WHEN the new quantity is less than 0 THEN
      the update SHALL be rejected and not persisted.
    confidence: high
    confidence_basis: >
      RcvrRequestProcessor.updateInventory() explicitly checks qty.intValue() >= 0
      before calling setQuantity(). The validation is enforced at the servlet layer
      before any EJB call. Container transaction ensures atomicity.
    risk_class: operational
    basis: >
      RcvrRequestProcessor.java lines 127-129 show the check:
      if(qty.intValue() >= 0) { inventory.setQuantity(qty.intValue()); }
      Only non-negative quantities proceed to setQuantity().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 123
        line_end: 131
        excerpt: |
          String newQty = req.getParameter("qty_" + itemId);
          if((newQty == null) || (newQty.length() <= 0))
            continue;
          Integer qty = new Integer(newQty);
          if(qty.intValue() >= 0 ) {
            inventory = inventoryHomeRef.findByPrimaryKey(itemId);
            inventory.setQuantity(qty.intValue());
          }
    stack_metadata:
      validation: client-side

  - record_key: OFUF-ENT-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL model supplier purchase orders with an itemId-based reference
      to line items and inventory. Each line item tracks categoryId, productId, itemId,
      lineNumber, quantity ordered, quantityShipped, and unitPrice.
    confidence: medium
    confidence_basis: >
      OrderFulfillmentFacadeEJB.java shows direct access to lineitem.getItemId(),
      lineitem.getQuantity(), lineitem.getQuantityShipped() via LineItemLocal interface.
      The supplier order persists via SupplierOrderLocal. However, the exact field
      definitions are in the supplierpo component (not in scope for this module extraction).
      Cross-module references confirm entity relationships.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.processAnOrder() (lines 176-210) iterates over
      po.getLineItems() and accesses anItem.getItemId(), anItem.getQuantity(),
      anItem.getQuantityShipped(), anItem.getLineNumber(), anItem.getCategoryId(),
      anItem.getProductId(), and anItem.getUnitPrice(). The methods are called
      on LineItemLocal objects retrieved from line items collection.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException {
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
    stack_metadata:
      ejb.bean: SupplierOrderLocal
      ejb.references: [LineItemLocal, InventoryLocal]

  - record_key: OFUF-BIZ-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL check inventory availability for each line item of a purchase
      order BEFORE fulfilling. GIVEN a line item with quantity Q WHEN checking
      inventory THEN if the inventory quantity < Q, the order line SHALL NOT be
      fulfilled and SHALL be marked as unavailable.
    confidence: high
    confidence_basis: >
      checkInventory() method is explicitly implemented in OrderFulfillmentFacadeEJB.java
      with clear logic: if(inv.getQuantity() < item.getQuantity()) return false.
      This is the sole fulfillment gate. Container transaction ensures atomicity
      of the check and reduction.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.java lines 126-139 define checkInventory(LineItemLocal).
      Lines 129-130: if(inv.getQuantity() < item.getQuantity()) return(false).
      This is invoked by processAnOrder() for each line item before setting shipped qty.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item) {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: OFUF-BIZ-0002
