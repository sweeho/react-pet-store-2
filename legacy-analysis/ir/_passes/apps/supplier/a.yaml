      ejb.type: Entity
      persistence: CMP2.x

  - record_key: SUPM-BIZ-0001
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL allow inventory quantity to be reduced by a specified amount.
      GIVEN an inventory item WHEN reduceQuantity(int amount) is called THEN the
      quantity SHALL be decreased by that amount.
    confidence: high
    confidence_basis: >
      The reduceQuantity method is explicitly declared in InventoryEJB.java with
      implementation visible. The method is wrapped in container transaction with
      trans-attribute=Required, enforcing atomicity.
    risk_class: operational
    basis: >
      InventoryEJB.java lines 82-85 show the public reduceQuantity(int) method that
      performs getQuantity() - amount and calls setQuantity(). This is invoked by
      OrderFulfillmentFacadeEJB during inventory fulfillment.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 82
        line_end: 85
        excerpt: |
          public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 261
        line_end: 282
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>InventoryEJB</ejb-name>
              <method-name>reduceQuantity</method-name>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: InventoryEJB
      ejb.transaction: Required

