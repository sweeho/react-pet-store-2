  - record_key: OFUF-BIZ-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL mark a purchase order as COMPLETED ONLY when ALL line items
      are fulfilled. GIVEN a purchase order WHEN processing THEN if allItemsAvailable
      is true, po.setPoStatus(OrderStatusNames.COMPLETED) SHALL be called.
    confidence: high
    confidence_basis: >
      processAnOrder() tracks allItemsAvailable boolean initialized to true and set
      to false if any line item's checkInventory fails. At the end (line 197-198),
      if(allItemsAvailable) po.setPoStatus(OrderStatusNames.COMPLETED) is called.
      This is the sole condition for COMPLETED status.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.java lines 178, 190, 197-198 show:
      boolean allItemsAvailable = true;
      if(!checkInventory(li)) { allItemsAvailable = false; continue; }
      if(allItemsAvailable) po.setPoStatus(OrderStatusNames.COMPLETED);
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException {
              boolean allItemsAvailable = true;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

  - record_key: OFUF-WRK-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process incoming purchase orders via a message-driven bean
      workflow: SupplierOrderMDB receives a JMS TextMessage containing a serialized
      XML purchase order, deserializes it, invokes OrderFulfillmentFacadeEJB.processPO(),
      and if shipment is possible, sends back an invoice via JMS to OPC.
    confidence: high
    confidence_basis: >
      SupplierOrderMDB implements MessageDrivenBean and MessageListener. onMessage()
      is declared with Message parameter. The method calls doWork(TextMessage.getText())
      which invokes OrderFulfillmentFacadeEJB.processPO(xmlMessage). If invoice is
      non-null, doTransition(invoice) sends it back. ejb-jar.xml declares the MDB
      with message-driven-destination type javax.jms.Queue.
    risk_class: operational
    basis: >
      SupplierOrderMDB.java lines 101-123 show onMessage() receiving a Message,
      casting to TextMessage, extracting text, calling doWork(recdText) which
      invokes poProcessor.processPO(xmlMessage), and if invoice is non-null,
      calling doTransition(invoice).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 143
        excerpt: |
          public void onMessage(Message recvMsg) {
            String messageID = recvMsg.getJMSMessageID();
            TextMessage recdTM = (TextMessage)recvMsg;
            String recdText = recdTM.getText();
            String invoice = doWork(recdText);
            if(invoice!=null) {
              doTransition(invoice);
            }
          }
          private String doWork(String xmlMessage) throws CreateException, XMLDocumentException {
            String invoice = null;
            invoice = poProcessor.processPO(xmlMessage);
            return invoice;
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 85
