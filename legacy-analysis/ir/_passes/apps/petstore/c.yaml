  - record_key: CUSTOMER-CREATION-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL allow account creation when a user provides a userName
      and password, creating a new SignOn credential via SignOnEJB.createUser().
      The system SHALL throw DuplicateAccountException if the userName already
      exists or if account creation fails for any reason.
    confidence: high
    confidence_basis: >
      CreateUserEJBAction.perform() lines 93-101 call
      signOn.createUser(userName, password) and catch CreateException,
      wrapping it in DuplicateAccountException. The exception class name and
      message ("Bad UserName or password", "Failed to Create SignOn EJB") confirm
      that duplicate/invalid accounts are rejected. Exception is mapped to
      duplicate_account.screen in mappings.xml line 111.
    risk_class: operational
    basis: >
      CreateUserEJBAction.perform() lines 78-104 retrieve userName and password
      from event, look up SignOnEJB via ServiceLocator, call
      signOn.createUser(userName, password), and catch CreateException,
      throwing DuplicateAccountException. Exception mapping in mappings.xml
      confirms user-facing error screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 104
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CreateUserEvent cue = (CreateUserEvent)e;
              SignOnLocal signOn = null;
              String userName = cue.getUserName();
              String password =«REDACTED:secret-finding-22»
              try {
                  ServiceLocator sl = new ServiceLocator();
                  SignOnLocalHome home =(SignOnLocalHome)sl.getLocalHome(JNDINames.SIGN_ON_EJBHOME);
                  signOn = home.create();
              } catch (ServiceLocatorException  slx) {
                  throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + slx);
              } catch (CreateException cx) {
                  throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + cx);
              }
              try {
                  signOn.createUser(userName, password);
                  ShoppingClientFacadeLocal scf = null;
                  scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                  scf.setUserId(userName);
              } catch (CreateException ce) {
                  throw new DuplicateAccountException("Bad UserName or password");
              }
              return null;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
