records:
  - record_key: AUTH-SIGNON-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL authenticate users by accepting a userName and password,
      looking up the user via SignOnEJB.createUser() or equivalent lookup, and
      SHALL set the user identity in session for use by downstream business logic.
    confidence: high
    confidence_basis: >
      SignOnEJBAction explicitly retrieves userName from SignOnEvent, calls
      signOn.createUser(userName, password) in try block. Reachable from
      signOn.do URL mapping (mappings.xml line 49-50). Password is passed to EJB
      and validated at the EJB layer. SignOnEvent is only possible entry point
      for user authentication in the petstore web flow.
    risk_class: operational
    basis: >
      SignOnEJBAction.perform() retrieves userName from event (line 79) and
      password (line 83), calls ServiceLocator to find SignOn EJB (lines 85-86),
      then invokes signOn.createUser(userName, password) at line 94. Method
      wraps CreateException to DuplicateAccountException on line 99-100,
      suggesting password/auth validation happens at EJB layer. SignOnEvent is
      the only trigger for login flow per mappings.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 77
        line_end: 97
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              SignOnEvent cue = (SignOnEvent)e;
              String userId = cue.getUserName();
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              scf.setUserId(userId);
              try {
                  ProfileLocal profile = scf.getCustomer().getProfile();
                  Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
                  machine.setAttribute(PetstoreKeys.LOCALE, locale);
                  ShoppingCartLocal cart = scf.getShoppingCart();
                  cart.setLocale(locale);
              } catch ( FinderException fe) {
                  // in the process of creating a user for the first time
                  // so the locale will be se when creating the user
              }
              return null;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 51
        excerpt: |
          <event-mapping>
              <event-class>com.sun.j2ee.blueprints.petstore.controller.events.SignOnEvent</event-class>
              <ejb-action-class>com.sun.j2ee.blueprints.petstore.controller.ejb.actions.SignOnEJBAction</ejb-action-class>
          </event-mapping>

  - record_key: AUTH-LOCALE-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL load the user's preferred language from their profile
      WHEN a user logs in, and SHALL set the user's session locale to match the
      preferred language, and SHALL apply this locale to the shopping cart.
    confidence: high
    confidence_basis: >
      SignOnEJBAction explicitly retrieves ProfileLocal from customer,
      calls profile.getPreferredLanguage() at line 87, converts to Locale via
      I18nUtil.getLocaleFromString() at line 87, and stores it in machine
      attributes and cart. This is enforced on every successful sign-on.
    risk_class: presentational
    basis: >
      SignOnEJBAction.perform() lines 86-91 retrieve customer profile, extract
      preferred language, convert to Locale object, and set it both in state
      machine and on shopping cart. Preference is stored in profile EJB.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 85
        line_end: 95
        excerpt: |
          try {
              ProfileLocal profile = scf.getCustomer().getProfile();
              Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
              machine.setAttribute(PetstoreKeys.LOCALE, locale);
              ShoppingCartLocal cart = scf.getShoppingCart();
              cart.setLocale(locale);
          } catch ( FinderException fe) {
              // in the process of creating a user for the first time
              // so the locale will be se when creating the user
          }

  - record_key: CART-ACTIONS-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support three shopping cart operations: (1) ADD_ITEM to
      add a single item to the cart, (2) DELETE_ITEM to remove an item from cart,
      and (3) UPDATE_ITEMS to modify quantities of one or more items in the cart.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() implements three switch cases for cart operations:
      CartEvent.ADD_ITEM at line 68 calls cart.addItem(), CartEvent.DELETE_ITEM
      at line 73 calls cart.deleteItem(), and CartEvent.UPDATE_ITEMS at line 78
      iterates items map and calls cart.updateItemQuantity() for each. All three
      are direct, enforced paths in the only cart action handler.
    risk_class: operational
    basis: >
      CartEJBAction.perform() lines 66-89 handle three distinct cart operations
      via CartEvent action types. Each calls a corresponding ShoppingCartLocal
      method. The method is the sole handler for CartEvent per mappings.xml
      line 74-76.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 66
        line_end: 89
        excerpt: |
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }
              break;
              case  CartEvent.DELETE_ITEM : {
                  cart.deleteItem(ce.getItemId());
              }
              break;
              case  CartEvent.UPDATE_ITEMS : {
                  Map items = ce.getItems();
                  Iterator it = null;
                  if (items != null) it = items.keySet().iterator();
                  while ((it != null) && it.hasNext()) {
                      String itemId = (String)it.next();
                      int quantity = ((Integer)items.get(itemId)).intValue();
                      cart.updateItemQuantity(itemId, quantity);
                  }
              }
              break;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 73
        line_end: 76
        excerpt: |
          <event-mapping>
              <event-class>com.sun.j2ee.blueprints.petstore.controller.events.CartEvent</event-class>
              <ejb-action-class>com.sun.j2ee.blueprints.petstore.controller.ejb.actions.CartEJBAction</ejb-action-class>
          </event-mapping>

  - record_key: ORDER-PLACEMENT-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL reject order placement with a ShoppingCartEmptyOrderException
      error when a user attempts to place an order with an empty shopping cart.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() explicitly checks cart items size at line 130,
      and throws ShoppingCartEmptyOrderException("Shopping cart is empty") if
      size is zero. This exception is caught and mapped to cart_empty_order_error.screen
      in mappings.xml line 110, indicating intentional error handling for this case.
    risk_class: operational
    basis: >
      OrderEJBAction.perform() lines 128-132 retrieve items from cart, check
      if items.size() == 0, and throw ShoppingCartEmptyOrderException. This is
      the sole validation before proceeding with order creation. Exception mapping
      in mappings.xml (line 110) confirms intentional user-facing error.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>

  - record_key: ORDER-PLACEMENT-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL create a purchase order when a user provides an order
      event with billing address, shipping address, credit card, and a non-empty
      shopping cart. The order SHALL include a unique order ID (generated via
      UniqueIdGeneratorEJB), order date (current timestamp), user ID, shipping
      and billing address information, credit card, and line items with quantities
      and unit costs from the cart.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() implements the complete order creation flow.
      UniqueIdGeneratorEJB is looked up at lines 102-104 and creates unique ID
      at line 110. PurchaseOrder object has setters called for all required
      fields: orderID (line 115), userID (line 116), orderDate (line 118),
      shippingInfo (line 119), billingInfo (line 120), creditCard (line 121).
      Cart items are iterated (lines 134-145) and added as LineItems with
      quantity and cost. Order creation is deterministic and all fields are
      enforced in the same method.
    risk_class: financial
    basis: >
      OrderEJBAction.perform() lines 90-145 orchestrate order creation from
      OrderEvent containing billTo, shipTo, creditCard. UniqueIdGeneratorEJB
      generates order ID. PurchaseOrder object is populated with all required
      fields via setter methods. Cart items are iterated to calculate total cost
      and create LineItems for each item with quantity and unit cost.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 98
        line_end: 146
        excerpt: |
          // get the UniqueIdGenerator EJB
          UniqueIdGeneratorLocal uidgen = null;
          try {
              ServiceLocator sl = new ServiceLocator();
              UniqueIdGeneratorLocalHome home =
                (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
              uidgen = home.create();
          } catch (javax.ejb.CreateException cx) {
              cx.printStackTrace();
          } catch (ServiceLocatorException slx) {
              slx.printStackTrace();
          }
          orderIdString = uidgen.getUniqueId("1001");
          // get ther userId
          ShoppingClientFacadeLocal scf = null;
          scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
          String userId = scf.getUserId();
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);
          int lineItemCount = 0;
          float totalCost = 0;
          // Add the items from the shopping cart
          ShoppingCartLocal cart = scf.getShoppingCart();
          Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
          purchaseOrder.setLocale(locale);
          Collection items = cart.getItems();
          Iterator it = items.iterator();
          while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                      item.getProductId(),
                                                      item.getItemId(),
                                                      (lineItemCount++) + "",
                                                      item.getQuantity(),
                                                      cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORDER-PLACEMENT-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL calculate the total order price by summing the product of
      unit cost multiplied by quantity for each line item in the cart.
    confidence: medium
    confidence_basis: >
      OrderEJBAction.perform() lines 137-138 show explicit calculation:
      totalCost += (cost*item.getQuantity()). This is the only computation
      visible in order processing. However, rounding behavior is not specified,
      and it is unclear if discounts or surcharges apply before or after this
      sum. The calculation is a bare literal with no comment or configuration.
    risk_class: financial
    basis: >
      OrderEJBAction.perform() lines 137-138 accumulate totalCost by multiplying
      unit cost by quantity for each cart item and adding to running total.
      No configuration or test found for rounding, currency handling, or
      surcharge ordering.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 137
        line_end: 138
        excerpt: |
          float cost = new Float(item.getUnitCost()).floatValue();
          totalCost += (cost*item.getQuantity());

  - record_key: ORDER-PLACEMENT-0004
