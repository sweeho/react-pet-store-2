  - record_key: CUSTOMER-PROFILE-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL support customer profile updates including: first and last
      name (given name / family name), email address, phone number, street address
      (two-part), city, state, zip code, country, credit card details (card number,
      card type, expiry date), preferred language, favorite product category,
      myList preference, and banner preference.
    confidence: high
    confidence_basis: >
      CustomerEJBAction.updateCustomer() lines 116-141 demonstrate deep copy of
      all profile fields. ContactInfoLocal setters are called for name/email/phone
      (lines 116-119). AddressLocal setters are called for all address components
      (lines 123-128). CreditCardLocal setters are called for card number/type/
      expiry (lines 132-134). ProfileLocal setters are called for language/category/
      preferences (lines 138-141). All fields are enforced in the same method,
      indicating they are required profile attributes.
    risk_class: operational
    basis: >
      CustomerEJBAction.updateCustomer() lines 101-145 look up customer and
      account, then perform systematic updates to ContactInfoLocal,
      AddressLocal, CreditCardLocal, and ProfileLocal objects via setter methods.
      No validation or optional fields are mentioned; all setters are called
      unconditionally.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 116
        line_end: 145
        excerpt: |
          contactInfoLocal.setFamilyName(contactInfo.getFamilyName());
          contactInfoLocal.setGivenName(contactInfo.getGivenName());
          contactInfoLocal.setTelephone(contactInfo.getPhone());
          contactInfoLocal.setEmail(contactInfo.getEmail());
          // deep copy over the address
          Address address = contactInfo.getAddress();
          AddressLocal addressLocal = contactInfoLocal.getAddress();
          addressLocal.setStreetName1(address.getStreetName1());
          addressLocal.setStreetName2(address.getStreetName2());
          addressLocal.setCity(address.getCity());
          addressLocal.setZipCode(address.getZipCode());
          addressLocal.setState(address.getState());
          addressLocal.setCountry(address.getCountry());
          // deep copy the credit card
          CreditCard creditCard = ce.getCreditCard();
          CreditCardLocal creditCardLocal = account.getCreditCard();
          creditCardLocal.setCardNumber(creditCard.getCardNumber());
          creditCardLocal.setCardType(creditCard.getCardType());
          creditCardLocal.setExpiryDate(creditCard.getExpiryDate());
          // deep copy the profile
