    risk_class: operational
    basis: >
      OrderEJBAction.perform() lines 147-164 retrieve AsyncSenderLocalHome via
      ServiceLocator, create AsyncSender bean, and invoke
      sender.sendAMessage(purchaseOrder.toXML()). Exceptions are caught but
      not propagated, indicating async delivery is fire-and-forget.
