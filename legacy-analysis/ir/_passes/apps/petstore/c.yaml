  - record_key: SEARCH-CATALOG-0001
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL support product search by accepting keyword search queries
      and returning matching items from the catalog. Search results SHALL be
      paginated with configurable start index and result count (default count is 2).
    confidence: medium
    confidence_basis: >
      search.jsp lines 65-76 demonstrate search flow. The CatalogHelper bean
      accepts start, count, and searchQuery parameters. If count parameter is
      not provided, default is set to 2 (line 71). searchItems property returns
      paginated results. However, the search implementation (CatalogHelper class)
      is not provided, so search algorithm details and keyword matching logic
      cannot be verified from this module alone.
    risk_class: operational
    basis: >
      search.jsp lines 47-76 set up pagination parameters on CatalogHelper bean
      and invoke searchItems. Default page count of 2 is hardcoded (line 71).
      Search is triggered via param.keywords (line 75). CatalogHelper is a
      session-scoped bean that maintains pagination state.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 64
        line_end: 76
        excerpt: |
          <c:choose>
           <c:when test="${param.count != null}">
            <c:set value="${param.start}" target="${catalog}" property="start"/>
            <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
            <c:set value="0" target="${catalog}" property="start"/>
            <c:set value="2" target="${catalog}" property="count"/>
           </c:otherwise>
          </c:choose>
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="${param.keywords}" target="${catalog}" property="searchQuery"/>
          <c:set value="${catalog.searchItems}" var="pageResults" />

