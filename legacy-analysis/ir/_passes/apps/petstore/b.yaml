  - record_key: order-placement-business-rule-0002
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL calculate order total price as the sum of
      (unit cost * quantity) for each line item, where unit cost is
      a float value retrieved from the cart item.
    confidence: high
    confidence_basis: >
      OrderEJBAction lines 137-138 show explicit calculation:
      totalCost += (cost * quantity) where cost is parsed as float from
      item.getUnitCost(). This is the only price calculation logic in the
      order workflow.
    risk_class: financial
    basis: >
      OrderEJBAction converts unit cost to float and multiplies by quantity,
      accumulating into totalCost. No discount, surcharge, or tax logic is
      applied at this level.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 134
        line_end: 145
        excerpt: |
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

