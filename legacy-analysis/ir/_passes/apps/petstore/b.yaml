  - record_key: order-placement-workflow-0001
    kind: workflow
    capability_key: order-placement
    requirement: >
      GIVEN a user has items in the shopping cart, items have unit costs,
      and user provides billing address, shipping address, and credit card,
      WHEN the user submits an order, THEN the system SHALL create a purchase
      order with a unique order ID, set order date to current timestamp, associate
      the user ID, collect billing email, and create line items from cart items
      calculating total cost as SUM(unit_cost * quantity) for all items.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() method implements the exact workflow: retrieves
      unique ID from UniqueIdGeneratorEJB, gets user ID from ShoppingClientFacade,
      extracts billing/shipping addresses and credit card from OrderEvent, iterates
      cart items to create line items with unit cost and quantity, calculates
      totalCost, sets order date to new Date(). Code is reached via order.do mapping.
    risk_class: financial
    basis: >
      OrderEJBAction lines 90-146 show complete order creation logic:
      - Gets unique order ID via uidgen.getUniqueId("1001")
      - Gets user ID from scf.getUserId()
      - Extracts OrderEvent.getBillTo(), getShipTo(), getCreditCard()
      - Iterates cart.getItems() to build line items
      - Calculates totalCost += (cost * quantity)
      - Sets orderDate to new Date()
      - Sets emailId from billTo.getEmail()
      Mappings.xml routes order.do to OrderHTMLAction and OrderEvent to OrderEJBAction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 88
        line_end: 169
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
            OrderEvent oe = (OrderEvent)e;
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            ContactInfo billTo = oe.getBillTo();
            ContactInfo shipTo = oe.getShipTo();
            CreditCard creditCard = oe.getCreditCard();
            String orderIdString = null;

            UniqueIdGeneratorLocal uidgen = null;
            // ... get uidgen from ServiceLocator ...
            orderIdString = uidgen.getUniqueId("1001");

            ShoppingClientFacadeLocal scf = null;
            scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
            String userId = scf.getUserId();
            purchaseOrder.setOrderId(orderIdString);
            purchaseOrder.setUserId(userId);
            purchaseOrder.setEmailId(billTo.getEmail());
            purchaseOrder.setOrderDate(new Date());
            purchaseOrder.setShippingInfo(shipTo);
            purchaseOrder.setBillingInfo(billTo);
            purchaseOrder.setCreditCard(creditCard);

            int lineItemCount = 0;
            float totalCost = 0;
            ShoppingCartLocal cart = scf.getShoppingCart();
            Collection items = cart.getItems();

            if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
            }
            Iterator it = items.iterator();
            while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                     item.getProductId(),
                                                     item.getItemId(),
                                                     (lineItemCount++) + "",
                                                     item.getQuantity(),
                                                     cost));
            }
            purchaseOrder.setTotalPrice(totalCost);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 43
        line_end: 46
        excerpt: |
          <event-mapping>
            <event-class>com.sun.j2ee.blueprints.petstore.controller.events.OrderEvent</event-class>
            <ejb-action-class>com.sun.j2ee.blueprints.petstore.controller.ejb.actions.OrderEJBAction</ejb-action-class>
          </event-mapping>
    stack_metadata:
      ejb.transaction: Required
      ejb.bean: ShoppingControllerEJB (Stateful Session)

