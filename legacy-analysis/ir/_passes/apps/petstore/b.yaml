records:
  - record_key: product-catalog-entity-0001
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL maintain a Product Catalog with a hierarchical
      structure consisting of Categories, Products, and Items, where each
      level may have locale-specific details (name, description, image).
    confidence: high
    confidence_basis: >
      Multiple sources confirm this structure: PopulateSQL.xml defines the schema
      with category, product, and item tables with corresponding _details tables
      for localization. The CatalogLocal EJB interface provides methods to
      traverse this hierarchy (getCategory, getProducts, getItems). Catalog
      tables appear in web.xml resource references for fast-lane read access.
    risk_class: operational
    basis: >
      Database schema in PopulateSQL.xml shows category, category_details (with
      locale), product, product_details (with locale), item, and item_details
      (with locale and pricing). CatalogLocal interface provides getCategory(),
      getProducts(), getItems() methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 45
        line_end: 171
        excerpt: |
          <TableStatements table="category">
          <TableStatements table="category_details">
          <TableStatements table="product">
          <TableStatements table="product_details">
          <TableStatements table="item">
          <TableStatements table="item_details">
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogLocal.java
        line_start: 53
        line_end: 71
        excerpt: |
          public Category getCategory(String categoryID, Locale l);
          public Page getProducts(String categoryID, int start, int count, Locale l);
          public Product getProduct(String productID, Locale l);
          public Page getItems(String productID, int start, int count, Locale l);
          public Item getItem(String itemID, Locale l);
    stack_metadata:
      ejb.bean: CatalogLocal (Session)
      db.object: category, category_details, product, product_details, item, item_details

