      OrderEventResponse returns the email and orderIdString (line 168) for confirmation
      display. The sequence is enforced at the EJB action layer.
    risk_class: operational
    basis: >
      The order workflow is implemented through a sequence of EJB method calls and
      declarative screen mapping.
