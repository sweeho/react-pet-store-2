  - record_key: ORDER-PLACEMENT-REQ-0004
    kind: requirement
    capability_key: order-placement
    requirement: >
      When a shopping cart is empty, the system SHALL reject order placement with
      a ShoppingCartEmptyOrderException and display a cart_empty_order_error screen.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() checks if items.size() == 0 and throws
      ShoppingCartEmptyOrderException (line 131). The mappings.xml file contains
      an exception-mapping at line 110 that routes this exception to the
      cart_empty_order_error.screen view. Both enforcement and routing are declared.
    risk_class: operational
    basis: >
      The order action validates cart state before processing. The exception mapping
      in the request routing configuration ensures user feedback.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 129
        line_end: 132
        excerpt: |
