  - record_key: AUTHENTICATION-REQ-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL support user account creation with username and password.
      If the username already exists, the system SHALL reject the creation with
      a DuplicateAccountException.
    confidence: high
    confidence_basis: >
      CreateUserEJBAction.perform() (lines 78-103) creates a SignOn EJB, calls
      signOn.createUser(userName, password) (line 94), and catches CreateException
      wrapping it in DuplicateAccountException (line 100). The exception message
      "Bad UserName or password" indicates duplicate username detection.
    risk_class: operational
    basis: >
      User creation is delegated to the SignOn EJB component which validates username
      uniqueness during account creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 103
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CreateUserEvent cue = (CreateUserEvent)e;
              SignOnLocal signOn = null;
              String userName = cue.getUserName();
              String password = cue.getPassword();
              try {
                ServiceLocator sl = new ServiceLocator();
                SignOnLocalHome home =(SignOnLocalHome)sl.getLocalHome(JNDINames.SIGN_ON_EJBHOME);
                signOn = home.create();
              } catch (ServiceLocatorException slx) {
                throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + slx);
              } catch (CreateException cx) {
                throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + cx);
              }
              try {
                signOn.createUser(userName, password);
                ShoppingClientFacadeLocal scf = null;
                scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                scf.setUserId(userName);
              } catch (CreateException ce) {
                throw new DuplicateAccountException("Bad UserName or password");
              }

