  - record_key: PRODUCT-CATALOG-REQ-0001
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL support a product catalog organized by categories. Products
      are organized within categories, and items are organized within products.
    confidence: medium
    confidence_basis: >
      The data population DTDs (Product.dtd) show Product elements contain category IDREF
      and ProductDetails. The populate XML structure (Populate-UTF8.xml) declares Catalog
      containing Categories, Products, and Items as separate collections. However, the
      exact data model relationships are inferred from DTD and XML structure rather than
      explicitly enforced in the runtime code examined.
    risk_class: operational
    basis: >
      The product catalog structure is defined in XML DTDs and data population configuration
      rather than in runtime code constraints.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/dtds/Product.dtd
        line_start: 38
        line_end: 42
        excerpt: |
          <!ELEMENT Product (ProductDetails+)>
          <!ATTLIST Product
                  id ID #REQUIRED
                  category IDREF #REQUIRED
          >
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/Populate-UTF8.xml
        line_start: 41
        line_end: 65
        excerpt: |
          <!DOCTYPE Populate [
            <!ELEMENT Populate (Users, Customers, Catalog)>
            <!ELEMENT Catalog (Categories, Products, Items)>
            <!ELEMENT Users (User+)>
            <!ELEMENT Customers (Customer+)>
            <!ELEMENT Categories (Category+)>
            <!ELEMENT Products (Product+)>
            <!ELEMENT Items (Item+)>
          ]>

  - record_key: PRODUCT-CATALOG-REQ-0002
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL support fast-lane read access to the product catalog directly
      via JDBC in the web tier, bypassing the EJB layer for read-only catalog access.
    confidence: medium
    confidence_basis: >
      web.xml declares JDBC data source resource reference (lines 171-176) and URL
      resource reference (lines 178-182) for catalog access. The configuration comment
      explicitly states "Allow the Fast Lane Reader Pattern to Read Catalog Data Directly
      via JDBC in the Web Tier". Environment entries are configured for CatalogDAO
      database type and implementation class selection. However, no runtime code is
      examined to verify the actual implementation of this pattern.
    risk_class: operational
    basis: >
      Fast-lane read access is configured via JNDI resources and env entries in the
      deployment descriptor, supporting direct JDBC access for catalog browsing
      performance.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 169
        line_end: 197
        excerpt: |
          <!-- Enable Fast Lane Pattern  -->
          <resource-ref>
            <description>Allow the Fast Lane Reader Pattern to Read Catalog Data Directly via JDBC in the Web Tier</description>
            <res-ref-name>jdbc/CatalogDB</res-ref-name>
            <res-type>javax.sql.DataSource</res-type>
            <res-auth>Container</res-auth>
          </resource-ref>
          <resource-ref>
            <res-ref-name>url/CatalogDAOSQLURL</res-ref-name>
            <res-type>java.net.URL</res-type>
            <res-auth>Container</res-auth>
          </resource-ref>
          <env-entry>
            <env-entry-name>param/CatalogDAODatabase</env-entry-name>
            <env-entry-value>cloudscape</env-entry-value>
            <env-entry-type>java.lang.String</env-entry-type>
          </env-entry>
          <env-entry>
            <description>This Entry Provides the name for the CatalogDAO Implementation Class so the Fast Lane Pattern may be used</description>
            <env-entry-name>param/CatalogDAOClass</env-entry-name>
            <env-entry-value>com.sun.j2ee.blueprints.catalog.dao.CatalogDAOSQLImpl</env-entry-value>
            <env-entry-type>java.lang.String</env-entry-type>
          </env-entry>

  - record_key: ORDER-PLACEMENT-WORKFLOW-0001
