  - record_key: SHOPPING-CART-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support updating quantities of items in the shopping cart.
      When multiple items are provided in a map, quantities SHALL be updated for
      each item.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() handles CartEvent.UPDATE_ITEMS action type (lines 78-88).
      When items map is provided, it iterates through each itemId and calls
      cart.updateItemQuantity(itemId, quantity) with the quantity value.
    risk_class: operational
    basis: >
      Quantity update is implemented as bulk update capability supporting multiple
      items in a single action.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 88
        excerpt: |
          case  CartEvent.UPDATE_ITEMS : {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }
          }

