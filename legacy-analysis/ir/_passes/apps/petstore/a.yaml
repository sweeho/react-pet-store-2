records:
  - record_key: ORDER-PLACEMENT-REQ-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL accept order placement when a user provides billing address,
      shipping address, credit card, and a non-empty shopping cart. The order SHALL be
      assigned a unique order ID, capture the order date, associate the order with the
      user ID, and include all line items from the shopping cart with calculated total
      price.
    confidence: high
    confidence_basis: >
      This requirement is directly enforced in OrderEJBAction.perform() where:
      the method checks cart.size() == 0 and throws ShoppingCartEmptyOrderException
      if the cart is empty (enforcing non-empty cart); it uses UniqueIdGeneratorEJB
      to generate order ID; it calls purchaseOrder.setOrderId(), setUserId(),
      setOrderDate(), setShippingInfo(), setBillingInfo(), setCreditCard(), and
      setTotalPrice() in sequence; it iterates through cart items and adds line items
      via purchaseOrder.addLineItem(). The requirement is stated in both code logic
      and business object state management.
    risk_class: financial
    basis: >
      OrderEJBAction.perform() lines 90-169 orchestrate order creation from OrderEvent
      (line 91) containing billTo, shipTo, creditCard. Cart items are iterated (lines
      128-145) to calculate totalCost and create LineItems. PurchaseOrder object
      methods are called sequentially to set all required fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 90
        line_end: 169
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
            OrderEvent oe = (OrderEvent)e;
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            ContactInfo billTo = oe.getBillTo();
            ContactInfo shipTo = oe.getShipTo();
            CreditCard creditCard = oe.getCreditCard();
            String orderIdString = null;
            ...
            if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
            }
            ...
            purchaseOrder.setOrderId(orderIdString);
            purchaseOrder.setUserId(userId);
            purchaseOrder.setOrderDate(new Date());
            purchaseOrder.setShippingInfo(shipTo);
            purchaseOrder.setBillingInfo(billTo);
            purchaseOrder.setCreditCard(creditCard);
            ...
            purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORDER-PLACEMENT-REQ-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL empty the shopping cart after successful order placement.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() explicitly calls cart.empty() at line 167 after the
      order has been created and sent asynchronously. This is a direct, single-source
      enforcement of the requirement.
    risk_class: operational
    basis: >
      After the order is created and all purchase order data is set, the cart is
      emptied to prevent duplicate submissions.
    traces:
