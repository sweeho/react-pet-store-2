records:
  - record_key: ADMIN-AUTH-REQ-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL require all access to AdminRequestProcessor to be authenticated
      via FORM-based login using username and password credentials. Unauthenticated
      requests SHALL be redirected to /login.jsp for credential entry.
    confidence: high
    confidence_basis: >
      web.xml declares a security-constraint (lines 75-88) protecting the
      /AdminRequestProcessor URL pattern with auth-method FORM and explicit role
      requirement "administrator". The login-config specifies form-login-page as
      /login.jsp and form-error-page as /error.jsp, making this a container-enforced
      requirement that is declaratively stated and universally applied to the servlet.
    risk_class: regulated
    basis: >
      The web.xml security-constraint is the declarative enforcement mechanism for
      form-based authentication, providing container-level security that cannot be
      bypassed by the servlet code itself.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
          <login-config>
            <auth-method>FORM</auth-method>
            <realm-name>default</realm-name>
            <form-login-config>
              <form-login-page>/login.jsp</form-login-page>
              <form-error-page>/error.jsp</form-error-page>
            </form-login-config>
          </login-config>

