  - record_key: ADMIN-API-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an XML-based API for the rich client to query orders
      by status. Requests SHALL include a Status element, and the response SHALL include
      total count and individual order details (OrderId, UserId, OrderDate, OrderAmount, OrderStatus).
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.doPost() validates session (line 88-94) then processes XML
      requests. The getOrders() method (lines 166-203) handles GETORDERS request type,
      reads Status from XML (line 170), queries OPCAdminFacadeRemote.getOrdersByStatus()
      (line 171), and builds XML response with TotalCount and individual Order elements
      (lines 176-196) containing OrderId, UserId, OrderDate, OrderAmount, OrderStatus.
      This is a single, comprehensive enforcement of the API contract.
    risk_class: operational
    basis: >
      The XML API contract is enforced in ApplRequestProcessor.getOrders() where
      incoming XML is parsed for the Status field and the response is built element-by-element
      according to a fixed schema.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
            try {
              AdminRequestBD bd = new AdminRequestBD();
              NodeList nl = root.getElementsByTagName("Status");
              String status = getValue(nl.item(0));
              OrdersTO orders = bd.getOrdersByStatus(status);
              if (orders == null) {
                return null;
              }
              StringBuffer responseBuffer = new StringBuffer(replyHeader);
              responseBuffer.append("<Type>GETORDERS</Type>\n");
              responseBuffer.append("<Status>" + status + "</Status>\n");
              responseBuffer.append("<TotalCount>" + orders.size() +
                                    "</TotalCount>\n" );
              for (Iterator it = orders.iterator(); it.hasNext(); ) {
                OrderDetails o = (OrderDetails) it.next();
                responseBuffer.append("<Order>\n");
                responseBuffer.append("<OrderId>" + o.getOrderId()
                                      + "</OrderId>\n");
                responseBuffer.append("<UserId>" + o.getUserId()
                                      + "</UserId>\n");
                responseBuffer.append("<OrderDate>" + o.getOrderDate()
                                      + "</OrderDate>\n");
                responseBuffer.append("<OrderAmount>" + o.getOrderValue()
                                      + "</OrderAmount>\n");
                responseBuffer.append("<OrderStatus>" + o.getOrderStatus()
                                      + "</OrderStatus>\n");
                responseBuffer.append("</Order>\n");
              }
              responseBuffer.append("</Response>\n");
              return responseBuffer.toString();
            }
            catch (AdminBDException e) {
              e.printStackTrace();
              return null;
            }
          }

  - record_key: ADMIN-API-REQ-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL validate that an active HTTP session exists for all API requests.
      If the session has timed out or does not exist, the system SHALL return an error
      response with message "Session Timed Out; Please exit and login as admin from the login page".
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.doPost() calls req.getSession(false) (line 88) and checks
      if session is null (line 94). If null, it returns the exact error message
      (lines 95-98). This is a single, deterministic enforcement point that all XML
      API requests pass through.
    risk_class: regulated
    basis: >
      Session validation is enforced at the entry point of ApplRequestProcessor.doPost(),
      which is the single servlet handling all rich client API requests.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 85
        line_end: 114
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
            HttpSession session = req.getSession(false);
            ServletOutputStream out = resp.getOutputStream();
            if(session == null) {
              out.println(replyHeader +
                          "<Error>Session Timed Out; Please exit and " +
                          "login as admin from the login page</Error>\n" +
                          "</Response>\n");
            } else {
              String sId = session.getId();
              resp.setContentType("text/xml");
              BufferedReader inp = req.getReader();
              StringBuffer strbuf = new StringBuffer("");
              while(true) {
                String str = inp.readLine();
                if(str == null)
                  break;
                strbuf.append(str+"\n");
              }
              inp.close();
              out.println(processRequest(strbuf.toString()));
            }
            out.flush();
            out.close();
          }

  - record_key: ADMIN-API-REQ-0003
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support updating order status via XML API. The request SHALL
      include Order elements with OrderId and OrderStatus, and the system SHALL update
      the order status asynchronously via AsyncSender EJB after receiving the status updates.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.updateOrders() (lines 205-237) parses incoming XML for
      Order elements (line 212), extracts OrderId and OrderStatus (lines 218-220),
      creates ChangedOrder objects (line 222), calls AdminRequestBD.updateOrders()
      (line 228), and returns SUCCESS response (lines 229-231). AdminRequestBD.updateOrders()
      (lines 115-130 in AdminRequestBD.java) looks up AsyncSenderLocalHome,
      creates AsyncSender, and calls sender.sendAMessage(oa.toXML()). This is a
      two-layer enforcement of the asynchronous update pattern.
    risk_class: operational
    basis: >
      Order status updates are processed by ApplRequestProcessor.updateOrders(),
      which delegates to AdminRequestBD for async notification via the AsyncSender
      EJB component, implementing the async pattern for order fulfillment.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
            OrderApproval oa = new OrderApproval();
            NodeList nl = root.getElementsByTagName("Order");
            for (int i = 0; i < nl.getLength(); i++) {
              Element e = (Element) nl.item(i);
              String orderId =
                getValue((Element) e.getElementsByTagName("OrderId").item(0));
              String orderStatus =
                getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
              if (orderId != null && orderStatus != null) {
                oa.addOrder(new ChangedOrder(orderId, orderStatus));
              }
            }
            try {
              AdminRequestBD bd = new AdminRequestBD();
              bd.updateOrders(oa);
              return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                + "<Status>SUCCESS</Status>\n"
                + "</Response>\n";
            } catch (AdminBDException e) {
              return replyHeader
                + "<Error>Exception while processing :  " + e.getMessage()
                + ". Please try again</Error>\n</Response>\n";
            }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
            try {
              AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
              AsyncSender sender= home.create();
              sender.sendAMessage(oa.toXML());
            } catch (ServiceLocatorException sle) {
              sle.printStackTrace();
              throw new AdminBDException(sle.getMessage());
            } catch (XMLDocumentException xde) {
              xle.printStackTrace();
              throw new AdminBDException(xde.getMessage());
            }  catch (CreateException ce) {
              throw new AdminBDException(ce.getMessage());
            }
          }

  - record_key: ADMIN-API-REQ-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a chart information API that accepts request type (REVENUE or ORDERS),
      start date, end date, and optional category, then returns aggregated data with totals.
      For REVENUE requests, the response SHALL include Float amounts per category/item with TotalSales sum.
      For ORDERS requests, the response SHALL include Integer quantity counts per category/item with TotalSales sum.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.getChartInfo() (lines 239-305) handles REVENUE and ORDERS
      request types (line 139), parses Start/End/ReqCategory from XML (lines 244-250),
      calls AdminRequestBD.getChartInfo() (lines 252-255), and builds different response
      formats: REVENUE responses include Float amounts (line 270) with TotalSales sum
      (lines 277-279); ORDERS responses include Integer quantities (line 287) with
      TotalSales sum (lines 294-296). Both branches enforce their respective aggregation logic.
    risk_class: operational
    basis: >
      Chart data aggregation is enforced in ApplRequestProcessor.getChartInfo(),
      which routes to different formatting logic based on request type and calculates
      running totals for each aggregation type.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 239
        line_end: 305
        excerpt: |
          String getChartInfo(Element root, String request) {
            try {
              Map chartInfo = null;
              String category = null;
              String start = getValue(root.getElementsByTagName("Start").item(0));
              String end = getValue(root.getElementsByTagName("End").item(0));
              AdminRequestBD bd = new AdminRequestBD();
              category =
                getValue(root.getElementsByTagName("ReqCategory").item(0));
              chartInfo = bd.getChartInfo(request,
                                          getProperDate(start),
                                          getProperDate(end),
                                          category);
              StringBuffer responseBuffer = new StringBuffer(replyHeader);
              String xmlElement = (category == null) ? "Category" : "Item";
              responseBuffer.append("<Type>" + request + "</Type>\n");
              responseBuffer.append("<Start>" + start + "</Start>\n");
              responseBuffer.append("<End>" + end + "</End>\n");
              responseBuffer.append(((category == null) ?
                                     ("<ReqCategory/>\n") :
                                     ("<ReqCategory>" + category + "</ReqCategory>\n")));
              if (request.equals("REVENUE")) {
                float totalAmount = 0f;
                for (Iterator it = chartInfo.entrySet().iterator();
                     it.hasNext(); ) {
                  Map.Entry e = (Map.Entry) it.next();
                  float amount = ((Float) e.getValue()).floatValue();
                  totalAmount += amount;
                  responseBuffer.append("<" + xmlElement + " name=\""
                                        + e.getKey() + "\">");
                  responseBuffer.append(amount);
                  responseBuffer.append("</" + xmlElement + ">\n");
                }
                responseBuffer.append("<TotalSales>");
                responseBuffer.append(totalAmount);
                responseBuffer.append("</TotalSales>\n");
              }
              // ORDERS
              else {
                int totalQuantity = 0;
                for (Iterator it = chartInfo.entrySet().iterator();
                     it.hasNext(); ) {
                  Map.Entry e = (Map.Entry) it.next();
                  int quantity = ((Integer) e.getValue()).intValue();
                  totalQuantity += quantity;
                  responseBuffer.append("<" + xmlElement + " name=\""
                                        + e.getKey() + "\">");
                  responseBuffer.append(quantity);
                  responseBuffer.append("</" + xmlElement + ">\n");
                }
                responseBuffer.append("<TotalSales>");
                responseBuffer.append(totalQuantity);
                responseBuffer.append("</TotalSales>\n");
              }
              responseBuffer.append("</Response>\n");
              return responseBuffer.toString();
            }
            catch (AdminBDException e) {
              e.printStackTrace();
              return null;
            }
          }

