  - record_key: ADMIN-WF-0006
    kind: workflow
    capability_key: admin-operations
    requirement: >
      GIVEN an authenticated administrator accessing the AdminRequestProcessor
      with currentScreen parameter "manageorders";
      WHEN the servlet processes the POST request;
      THEN it SHALL dynamically generate a JNLP file for Java Web Start deployment
      containing the PetStoreAdminClient application, build JAR references, required
      Java version (1.3 and 1.4), server hostname, port, and session ID for client
      authentication.
    confidence: high
    confidence_basis: >
      The buildJNLP() method is explicitly implemented and called from doPost()
      when currentScreen equals "manageorders". The method constructs complete
      JNLP XML with all required elements.
    risk_class: operational
    basis: >
      AdminRequestProcessor.doPost() checks currentScreen parameter and invokes
      buildJNLP(req) which constructs XML response with application descriptor
      containing hostname, port, and session ID passed as arguments.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if (curScreen == null) {
                  return;
              }
              curScreen = curScreen.trim();
              if(curScreen.equals("logout")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
              }
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));
                  out.flush();
                  out.close();
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              jnlp.append("<information>\n").append("<title>Pet Store Admin Rich Client</title>\n");
              jnlp.append("<resources>\n");
              jnlp.append("<j2se version=\"1.4\"/>\n");
              jnlp.append("<j2se version=\"1.3\"/>\n");
              jnlp.append("<jar href=\"AdminApp.jar\"/>\n");
              jnlp.append("<application-desc main-class=\"com.sun.j2ee.blueprints.admin.client.PetStoreAdminClient\">\n");
              jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
              jnlp.append("<argument>").append(serverName).append("</argument>\n");
              jnlp.append("<argument>").append(serverPort).append("</argument>\n");
              jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
              jnlp.append("</application-desc>\n</jnlp>\n");
              return(jnlp.toString());
          }
    stack_metadata:
      framework: Servlet (AdminRequestProcessor)
      deployment: Java Web Start (JNLP)

