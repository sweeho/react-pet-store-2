  - record_key: ADMIN-CHARTS-0013
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL parse date parameters in mm/dd/yyyy format for chart
      analytics. Each date string SHALL be tokenized by "/" to extract month, day,
      and year components, then converted to a Date object using the legacy
      java.util.Date constructor Date(year-1900, month-1, day).
    confidence: low
    confidence_basis: >
      The date parsing logic is explicitly implemented in getProperDate() method
      but uses an undocumented legacy Date constructor with unclear semantics.
      No tests or configuration document the exact date format or expected behavior.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getProperDate() tokenizes input string by "/" and
      extracts three numeric components, constructs Date with (year-1900, month-1, day)
      arguments.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 319
        line_end: 326
        excerpt: |
          Date getProperDate(String inpDate) {
              StringTokenizer tokens = new StringTokenizer(inpDate, "/");
              Integer month = new Integer((String)tokens.nextElement());
              Integer day = new Integer((String)tokens.nextElement());
              Integer year = new Integer((String)tokens.nextElement());
              return(new Date(year.intValue()-1900, month.intValue()-1,
                              day.intValue()));
          }
    stack_metadata:
      framework: Servlet (ApplRequestProcessor)

