  - record_key: ADMIN-ORD-0010
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an order retrieval function (GETORDERS) that accepts
      an order status parameter and returns a list of all orders matching that status.
      The response SHALL include order count and detailed order information (OrderId,
      UserId, OrderDate, OrderAmount, OrderStatus) in XML format.
    confidence: high
    confidence_basis: >
      The GETORDERS request type is explicitly handled in processRequest() and
      calls getOrders() method which retrieves orders via AdminRequestBD and formats
      XML response with order details.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getOrders() extracts Status from XML request, calls
      AdminRequestBD.getOrdersByStatus(), iterates OrderDetails collection, and
      builds XML response with order attributes.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
                  if (orders == null) {
                      return null;
                  }
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  responseBuffer.append("<Type>GETORDERS</Type>\n");
                  responseBuffer.append("<Status>" + status + "</Status>\n");
                  responseBuffer.append("<TotalCount>" + orders.size() +
                                        "</TotalCount>\n" );
                  for (Iterator it = orders.iterator(); it.hasNext(); ) {
                      OrderDetails o = (OrderDetails) it.next();
                      responseBuffer.append("<Order>\n");
                      responseBuffer.append("<OrderId>" + o.getOrderId()
                                            + "</OrderId>\n");
                      responseBuffer.append("<UserId>" + o.getUserId()
                                            + "</UserId>\n");
                      responseBuffer.append("<OrderDate>" + o.getOrderDate()
                                            + "</OrderDate>\n");
                      responseBuffer.append("<OrderAmount>" + o.getOrderValue()
                                            + "</OrderAmount>\n");
                      responseBuffer.append("<OrderStatus>" + o.getOrderStatus()
                                            + "</OrderStatus>\n");
                      responseBuffer.append("</Order>\n");
                  }
    stack_metadata:
      framework: Servlet (ApplRequestProcessor)
      ejb.bean: OPCAdminFacade (Remote)

  - record_key: ADMIN-ORD-0011
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide order approval functionality (UPDATESTATUS) that
      accepts XML containing Order elements with OrderId and OrderStatus attributes.
      Each order status update SHALL be converted to an OrderApproval message and
      sent asynchronously via AsyncSender EJB for processing.
    confidence: high
    confidence_basis: >
      Order update workflow is explicitly implemented in processRequest() which
      dispatches UPDATESTATUS requests to updateOrders() method. The method parses
      order elements and invokes AdminRequestBD.updateOrders() which sends async messages.
    risk_class: operational
    basis: >
      ApplRequestProcessor.updateOrders() parses Order XML elements, extracts
      OrderId and OrderStatus, creates ChangedOrder objects, builds OrderApproval
      message, and calls AdminRequestBD.updateOrders() which uses AsyncSender EJB
      to send message asynchronously.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
              OrderApproval oa = new OrderApproval();
              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
              } catch (AdminBDException e) {
                  return replyHeader
                      + "<Error>Exception while processing :  " + e.getMessage()
                      + ". Please try again</Error>\n</Response>\n";
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
              try {
                  AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                      ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
                  AsyncSender sender= home.create();
                  sender.sendAMessage(oa.toXML());
              } catch (ServiceLocatorException sle) {
                  sle.printStackTrace();
                  throw new AdminBDException(sle.getMessage());
    stack_metadata:
      framework: Servlet (ApplRequestProcessor)
      ejb.bean: AsyncSender (Local Stateless Session)
      async: JMS Queue

  - record_key: ADMIN-CHARTS-0012
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide analytics functionality for REVENUE and ORDERS
      request types. Requests SHALL include optional Start and End date parameters
      (mm/dd/yyyy format) and optional ReqCategory parameter. Responses SHALL
      include aggregated data (TotalSales) and per-category or per-item breakdown.
    confidence: high
    confidence_basis: >
      Chart info functionality is explicitly implemented in processRequest() which
      handles REVENUE and ORDERS request types and calls getChartInfo() method.
      Date parsing and category filtering are implemented.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getChartInfo() extracts Start, End, and ReqCategory
      from XML request, calls AdminRequestBD.getChartInfo() with parsed dates,
      and builds XML response with per-category breakdown and total aggregations.
