  - record_key: ADMIN-AUTH-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL enforce role-based access control requiring the "administrator"
      role to access the AdminRequestProcessor servlet at /AdminRequestProcessor.
      Unauthenticated or non-administrator users SHALL be denied access.
    confidence: high
    confidence_basis: >
      Security constraint is explicitly declared in web.xml with auth-constraint
      element specifying administrator role for /AdminRequestProcessor endpoint.
    risk_class: operational
    basis: >
      web.xml security-constraint restricts /AdminRequestProcessor to GET and POST
      methods for users with the "administrator" role. The auth-constraint
      element explicitly names the required role.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
    stack_metadata:
      framework: Servlet Security Constraint

