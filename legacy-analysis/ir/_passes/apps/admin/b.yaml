  - record_key: ADMIN-API-0008
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support an XML-based RPC API for the rich admin client.
      The ApplRequestProcessor servlet SHALL accept XML POST requests, parse the
      Type element to determine request type (GETORDERS, UPDATESTATUS, REVENUE, or
      ORDERS), invoke corresponding business logic, and return XML-formatted responses.
    confidence: high
    confidence_basis: >
      The ApplRequestProcessor explicitly implements XML request parsing and
      request-type dispatch logic. Multiple request types are handled with
      corresponding methods.
    risk_class: operational
    basis: >
      ApplRequestProcessor.processRequest() parses incoming XML, extracts Type
      element, and dispatches to getOrders(), updateOrders(), or getChartInfo()
      based on type value. Responses are returned as XML strings.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 147
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.
                                                               getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root =
                      db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type")
                                          .item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
                  else {
                      return replyHeader +
                          "<Error>Unable to process request : " +
                          "Unknown request type - " + reqType +
                          "</Error>\n</Response>\n";
                  }
              }
    stack_metadata:
      framework: Servlet (ApplRequestProcessor)
      api_style: XML-RPC

