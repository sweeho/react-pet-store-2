      (I18nUtil.java lines 168-196) supporting language_country_variant format.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 196
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex == -1) return null;
              int countryIndex = localeString.indexOf('_', languageIndex + 1);
              String country = null;
              if (countryIndex == -1) {
                  if (localeString.length() > languageIndex) {
                      country = localeString.substring(languageIndex + 1, localeString.length());
                  } else {
                      return null;
                  }
              }
              int variantIndex = -1;
              if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex + 1);
              String language = localeString.substring(0, languageIndex);
              String variant = null;
              if (variantIndex != -1) {
                  variant = localeString.substring(variantIndex + 1, localeString.length());
              }
              if (variant != null) {
                  return new Locale(language, country, variant);
              } else {
                  return new Locale(language, country);
              }
          }
    stack_metadata:
      framework: J2EE session management
      locale_format: language_country_variant

  - record_key: admin-operations-workflow-0004
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL delegate event processing to an EJB-tier Stateful Session
      Bean via a synchronized WebController proxy, maintaining thread safety for
      concurrent requests by serializing access to the stateful EJBControllerLocal.
    confidence: high
    confidence_basis: >
      Synchronization is explicit in DefaultWebController.handleEvent() source code.
      The reason for synchronization (stateful session bean concurrency) is documented
      in comments.
    risk_class: operational
    basis: >
      DefaultWebController implements WebController as a synchronized proxy (line 87)
      that retrieves the stateful EJBControllerLocal from session (line 90) and
      invokes processEvent() (line 91). Javadoc comments (lines 62-63) state:
      "All the methods that access the EJB are synchronized so that concurrent
      requests do not happen to the stateful session bean."
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/web/DefaultWebController.java
        line_start: 59
        line_end: 109
        excerpt: |
          /**
           * This class is essentially just a proxy object that calls methods on the
           * EJB tier using the com.sun.j2ee.blueprints.waf.controller.ejb.ShoppingClientControllerEJB
           * object. All the methods that access the EJB are synchronized so
           * that concurrent requests do not happen to the stateful session bean.
           */
          public class DefaultWebController implements WebController {

              public synchronized EventResponse handleEvent(Event ev, HttpSession session)
                  throws EventException {
                      DefaultComponentManager cm = (DefaultComponentManager)session.getAttribute(WebKeys.COMPONENT_MANAGER);
                      EJBControllerLocal controllerEJB = cm.getEJBController(session);
                      return controllerEJB.processEvent(ev);
              }

              public synchronized void destroy(HttpSession session) {
                  DefaultComponentManager cm = (DefaultComponentManager)session.getAttribute(WebKeys.COMPONENT_MANAGER);
                  EJBControllerLocal controllerEJB = cm.getEJBController(session);
                  try {
                      controllerEJB.remove();
                  } catch(RemoveException re) {
                      Debug.print(re);
                  }
              }
          }
    stack_metadata:
      framework: J2EE session beans
      ejb.bean: EJBControllerLocal
      ejb.transaction: Required
      web_controller: DefaultWebController

