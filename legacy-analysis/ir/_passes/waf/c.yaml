  - record_key: admin-operations-workflow-0003
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL process incoming HTTP requests by extracting the URL pattern
      from the request URI, looking up the corresponding HTMLAction class via URLMapping,
      invoking the action lifecycle (doStart, perform, doEnd), and if the action
      returns an Event, looking up the EJB action class name via EventMapping and
      delegating to the WebController for EJB-tier processing.
    confidence: high
    confidence_basis: >
      RequestProcessor.processRequest() contains the complete and explicit flow.
      The sequence is deterministic and recoverable from source code alone.
    risk_class: operational
    basis: >
      RequestProcessor.processRequest() extracts URL pattern from request URI
      (lines 119-125), retrieves URLMapping (line 126), loads HTMLAction class
      (line 127), invokes action.doStart() (line 130), action.perform() (line 131),
      and if Event is returned, looks up EventMapping to get EJBActionClassName
      (lines 135-137), then calls WebController.handleEvent() via ComponentManager
      (lines 139-141), and finally invokes action.doEnd() with EventResponse
      (line 143).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 113
        line_end: 145
        excerpt: |
          public void processRequest(HttpServletRequest request) throws HTMLActionException, EventException, ServletException {
              Event ev = null;
              String fullURL = request.getRequestURI();
              String selectedURL = null;
              int lastPathSeparator = fullURL.lastIndexOf("/") + 1;
              if (lastPathSeparator != -1) {
                  selectedURL = fullURL.substring(lastPathSeparator, fullURL.length());
              }
              URLMapping urlMapping = getURLMapping(selectedURL);
              HTMLAction action = getAction(urlMapping);
              if (action != null) {
                  action.setServletContext(request.getSession().getServletContext());
                  action.doStart(request);
                  ev = action.perform(request);
                  EventResponse eventResponse = null;
                  if (ev != null) {
                      EventMapping eventMapping = getEventMapping(ev);
                      if (eventMapping != null) {
                          ev.setEJBActionClassName(eventMapping.getEJBActionClassName());
                      }
                      ComponentManager sl = (ComponentManager)request.getSession().getAttribute(WebKeys.COMPONENT_MANAGER);
                      WebController wcc = sl.getWebController(request.getSession());
                      eventResponse = wcc.handleEvent(ev, request.getSession());
                  }
                  action.doEnd(request, eventResponse);
              }
          }
    stack_metadata:
      framework: J2EE servlet
      request_processor: RequestProcessor

