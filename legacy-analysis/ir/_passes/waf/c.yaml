  - record_key: admin-operations-workflow-0001
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL process all HTTP requests (.do URLs) through a central
      MainServlet entry point that initializes request context, applies default
      locale settings, delegates to RequestProcessor, and forwards to the
      ScreenFlowManager for view rendering.
    confidence: high
    confidence_basis: >
      The MainServlet is explicitly defined as the web tier entry point in web.xml
      servlet configuration (lines 52-61), with synchronized flow through
      RequestProcessor and ScreenFlowManager observed in source code. Both passes
      observed the same entry point pattern.
    risk_class: operational
    basis: >
      The MainServlet.doGet/doPost methods (lines 97-106) delegate to doProcess(),
      which initializes session locale (lines 111-113), invokes RequestProcessor.processRequest(),
      then ScreenFlowManager.forwardToNextScreen(). Exception handling maps exceptions
      to error screens (lines 117-128).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 69
        line_end: 132
        excerpt: |
          public class MainServlet extends HttpServlet {
              private ServletContext context;
              private HashMap urlMappings;
              private HashMap eventMappings;
              private Locale defaultLocale = null;
              private RequestProcessor requestProcessor;

              public void init(ServletConfig config) throws ServletException {
                  String defaultLocaleString = config.getInitParameter("default_locale");
                  defaultLocale = I18nUtil.getLocaleFromString(defaultLocaleString);
                  ...
                  urlMappings = URLMappingsXmlDAO.loadRequestMappings(requestMappingsURL);
                  eventMappings = URLMappingsXmlDAO.loadEventMappings(requestMappingsURL);
              }

              private void doProcess(HttpServletRequest request, HttpServletResponse response) {
                  if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
                      request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
                  }
                  try {
                      getRequestProcessor().processRequest(request);
                      getScreenFlowManager().forwardToNextScreen(request,response);
                  } catch (Throwable ex) {
                      String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
                      if (nextScreen == null) {
                          throw new ServletException("MainServlet: unknown exception: " + className);
                      }
                  }
              }
          }
    stack_metadata:
      framework: J2EE servlet
      servlet.entry_point: MainServlet

