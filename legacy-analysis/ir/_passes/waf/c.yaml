  - record_key: admin-operations-workflow-0005
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL dispatch Events to EJB action handlers via a StateMachine
      that dynamically loads EJBAction classes by name, caches loaded instances,
      invokes action lifecycle methods (doStart, perform, doEnd), maintains an
      attribute map for state storage, and returns EventResponse objects.
    confidence: high
    confidence_basis: >
      StateMachine.processEvent() explicitly implements this pattern. Dynamic class
      loading, caching, and lifecycle are all visible in source.
    risk_class: operational
    basis: >
      StateMachine.processEvent() receives Event with EJBActionClassName (line 93),
      checks actionMap cache (line 98), loads class if not cached (line 101),
      instantiates class (line 101), caches instance (line 102), invokes action.init()
      (line 108), action.doStart() (line 110), action.perform(ev) (line 111),
      and action.doEnd() (line 112), returning EventResponse (line 115). State
      persists via setAttribute/getAttribute methods (lines 118-124).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/StateMachine.java
        line_start: 78
        line_end: 133
        excerpt: |
          public class StateMachine implements java.io.Serializable {
              private EJBControllerLocalEJB ccejb;
              private HashMap attributeMap;
              private HashMap actionMap;
              private SessionContext sc;

              public StateMachine(EJBControllerLocalEJB ccejb, SessionContext sc) {
                  this.ccejb = ccejb;
                  this.sc = sc;
                  attributeMap = new HashMap();
                  actionMap = new HashMap();
              }

              public EventResponse processEvent(Event ev) throws EventException {
                  String actionName = ev.getEJBActionClassName();
                  EventResponse response = null;
                  if (actionName != null) {
                      EJBAction action = null;
                      try {
                          if (actionMap.get(actionName) != null) {
                              action = (EJBAction)actionMap.get(actionName);
                          } else {
                              action = (EJBAction)Class.forName(actionName).newInstance();
                              actionMap.put(actionName, action);
                          }
                      } catch (Exception ex) {
                          System.err.println("StateMachine: error loading " + actionName + " :" + ex);
                      }
                      if (action != null) {
                          action.init(this);
                          action.doStart();
                          response = action.perform(ev);
                          action.doEnd();
                      }
                  }
                  return response;
              }

              public void setAttribute(String key, Object value) {
                  attributeMap.put(key, value);
              }

              public Object getAttribute(String key) {
                  return attributeMap.get(key);
              }
          }
    stack_metadata:
      framework: J2EE EJB
      state_machine: StateMachine
      dynamic_action_loading: Class.forName()

  - record_key: admin-operations-workflow-0006
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL handle screen flow and navigation by loading URLMapping
      configurations at startup, checking for FlowHandler implementations,
      invoking flow handlers to determine the target screen based on request state,
      and forwarding requests to the determined screen via request dispatcher.
    confidence: high
    confidence_basis: >
      ScreenFlowManager.forwardToNextScreen() contains the explicit flow logic.
      FlowHandler interface is used and invoked in the code.
    risk_class: operational
    basis: >
      ScreenFlowManager.forwardToNextScreen() extracts URL pattern (lines 122-128),
      gets URLMapping (line 130), checks useFlowHandler flag (line 132), either
      retrieves direct screen (line 133) or instantiates and invokes FlowHandler
      (lines 136-144), invoking handler lifecycle (doStart, processFlow, doEnd)
      and looking up result screen via resultMappings (line 144).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
        line_start: 119
        line_end: 150
        excerpt: |
          public void forwardToNextScreen(HttpServletRequest request, HttpServletResponse response)
                    throws java.io.IOException, FlowHandlerException, javax.servlet.ServletException {
              String fullURL = request.getRequestURI();
              String selectedURL = defaultScreen;
              int lastPathSeparator = fullURL.lastIndexOf("/") + 1;
              if (lastPathSeparator != -1) {
                  selectedURL = fullURL.substring(lastPathSeparator, fullURL.length());
              }
              String currentScreen = "";
              URLMapping urlMapping = getURLMapping(selectedURL);
              if (urlMapping != null) {
                  if (!urlMapping.useFlowHandler()) {
                      currentScreen = urlMapping.getScreen();
                  } else {
                      FlowHandler handler = null;
                      String flowHandlerString = urlMapping.getFlowHandler();
                      try {
                          handler = (FlowHandler)getClass().getClassLoader().loadClass(flowHandlerString).newInstance();
                          handler.doStart(request);
                          String flowResult = handler.processFlow(request);
                          handler.doEnd(request);
                          currentScreen = urlMapping.getResultScreen(flowResult);
                          if (currentScreen == null) currentScreen = flowResult;
                      } catch (Exception ex) {
                          System.err.println("ScreenFlowManager caught loading handler: " + ex);
                      }
                  }
              }
    stack_metadata:
      framework: J2EE servlet
      screen_flow: ScreenFlowManager
      flow_handler: FlowHandler
      dynamic_handler_loading: Class.forName()

