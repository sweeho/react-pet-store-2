  - record_key: customer-management-workflow-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      GIVEN an address entity exists,
      WHEN retrieving the address data,
      THEN the system SHALL provide a getData() method that returns an
      Address value object with all field values copied from the entity.
    confidence: high
    confidence_basis: >
      The getData() method is explicitly defined in both AddressEJB
      (lines 105-114) and AddressLocal (line 61) interfaces. The method
      creates a new Address value object and copies all CMP field values
      into it. This is used by clients to exchange data without holding
      EJB references.
    risk_class: operational
    basis: >
      The AddressEJB.java class provides a public getData() method that
      instantiates an Address object, copies all six field values from
      the CMP entity to the value object, and returns it. The method is
      declared in the AddressLocal interface. This is the documented
      pattern for converting entity beans to value objects.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 105
        line_end: 114
        excerpt: |
          public Address getData() {
            Address address = new Address();
            address.setStreetName1(getStreetName1());
            address.setStreetName2(getStreetName2());
            address.setCity(getCity());
            address.setState(getState());
            address.setZipCode(getZipCode());
            address.setCountry(getCountry());
            return address;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocal.java
        line_start: 61
        line_end: 61
        excerpt: |
          public Address getData();
    stack_metadata:
      ejb.bean: AddressEJB
      pattern: ValueObject

  - record_key: customer-management-integration-0001
    kind: integration
    capability_key: customer-management
    requirement: >
      The system SHALL support XML serialization and deserialization of
      Address instances via DOM manipulation using the Address.toDOM()
      and Address.fromDOM() methods.
    confidence: high
    confidence_basis: >
      Both toDOM() and fromDOM() methods are present in the Address.java
      class with full implementations. They use the XMLDocumentUtils
      helper class to manage DOM operations. The DTD schema validates the
      XML structure. The code is used for message exchange and
      persistence.
    risk_class: operational
    basis: >
      The Address.java class provides toDOM() method (lines 144-155) that
      converts an Address instance to a DOM Element, and fromDOM() method
      (lines 157-180) that creates an Address instance from a DOM node.
      Both methods validate against the declared DTD. These are used for
      XML document marshalling and unmarshalling in inter-component
      communication.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      xml.serialization: DOM
      schema: Address.dtd

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      The Address.java toDOM() method always appends the country element
      (line 153), but the DTD schema marks Country as optional (Country?).
      Additionally, the fromDOM() method retrieves country with a
      non-optional parameter (false at line 176), yet the DTD permits
      absence. The code requires country for XML round-tripping, but the
      schema allows it to be missing. This is a conflict between the
      schema and the implementation.
