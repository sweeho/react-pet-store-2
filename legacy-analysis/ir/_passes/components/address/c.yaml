      The ejb-jar.xml file explicitly declares container-transaction
      elements for all Address methods with trans-attribute of Required.
      This is the definitive deployment configuration. All getter and
      setter methods are listed with Required transaction semantics.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor section contains
      container-transaction declarations for all AddressEJB methods.
      Each setter method (setCity, setState, setStreetName1,
      setStreetName2, setZipCode, setCountry) and each getter method
      (getCity, getState, getStreetName1, getStreetName2, getZipCode,
      getCountry) is declared with trans-attribute of Required.
    traces:
