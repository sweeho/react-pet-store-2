records:
  - record_key: customer-management-entity-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL provide an Address entity with the following fields:
      streetName1 (required), streetName2 (optional), city (required),
      state (required), zipCode (required), and country (optional).
    confidence: high
    confidence_basis: >
      The Address EJB class, DTD schema, JSP form inputs, and ejb-jar.xml
      configuration all consistently define this structure. CMP fields are
      declared in ejb-jar.xml, and the Java class provides getter/setter
      methods for all fields. Multiple independent sources confirm this
      structure.
    risk_class: operational
    basis: >
      The Address.java value object class defines private fields for all
      six address components. The AddressEJB.java class declares abstract
      CMP fields for these same components. The DTD schema defines the XML
      element structure matching this data model. The create_customer.jsp
      form renders input fields for all address components with specific
      maxlengths.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 62
        line_end: 67
        excerpt: |
          private String streetName1;
          private String streetName2;
          private String city;
          private String state;
          private String zipCode;
          private String country;
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);
          public abstract String getCity();
          public abstract void setCity(String city);
          public abstract String getState();
          public abstract void setState(String state);
          public abstract String getZipCode();
          public abstract void setZipCode(String zipCode);
          public abstract String getCountry();
          public abstract void setCountry(String country);
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
    stack_metadata:
      ejb.bean: AddressEJB
      persistence: CMP
      interface_type: LocalOnly

  - record_key: customer-management-entity-0002
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL support creation of Address instances with either
      individual field parameters or an Address value object parameter.
    confidence: high
    confidence_basis: >
      Both the AddressEJB class and AddressLocalHome interface explicitly
      declare create methods with both signatures. The implementation is
      visible in the source code. This is enforced at the EJB level.
    risk_class: operational
    basis: >
      The AddressEJB.java class provides multiple ejbCreate() overloads,
      including one that accepts individual String parameters and another
      that accepts an Address object. The AddressLocalHome interface
      provides corresponding create() methods for both signatures.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 97
        excerpt: |
          public Object ejbCreate(String streetName1, String streetName2, String city,
                                  String state, String zipCode, String country) throws CreateException {
                                    setStreetName1(streetName1);
                                    setStreetName2(streetName2);
                                    setCity(city);
                                    setState(state);
                                    setZipCode(zipCode);
                                    setCountry(country);
                                    return null;
          }

          public Object ejbCreate(Address address) throws CreateException {
            setStreetName1(address.getStreetName1());
            setStreetName2(address.getStreetName2());
            setCity(address.getCity());
            setState(address.getState());
            setZipCode(address.getZipCode());
            setCountry(address.getCountry());
            return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
        line_start: 45
        line_end: 50
        excerpt: |
          public AddressLocal create(String streetName1, String streetName2, String city,
                                     String state, String zipCode, String country) throws CreateException;

          public AddressLocal create(Address address) throws CreateException;

          public AddressLocal create() throws CreateException;
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.interface: AddressLocalHome

  - record_key: customer-management-business-rule-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL persist Address data with street name line 1 as
      required and street name line 2 as optional.
    confidence: high
    confidence_basis: >
      The DTD schema explicitly marks the second StreetName element as
      optional (StreetName?). The Java code checks for null/empty on
      streetName2 before serializing (line 147-148 in Address.java).
      The JSP form renders the second address line as optional. The
      AddressEJB allows setting streetName2 independently.
    risk_class: operational
    basis: >
      The Address.java toDOM() method contains conditional logic to only
      append the second street name if it is not null and not empty.
      The Address.fromDOM() method uses getNextSibling with a true
      parameter indicating optional matching for the second street name.
      The JSP form presents address_2_a input with no required indicator.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 147
        line_end: 149
        excerpt: |
          if (streetName2 != null && !streetName2.equals("")) {
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 164
        line_end: 168
        excerpt: |
          Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
          if (optionalChild != null) {
            address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
            child = optionalChild;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      xml.serialization: supported

  - record_key: customer-management-business-rule-0002
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL persist Address data with country as an optional
      field.
    confidence: high
    confidence_basis: >
      The DTD schema marks Country with ? qualifier (Country?). The Java
      code conditionally appends country in toDOM(). The JSP form
      presents country as a dropdown selection but with optional
      appearance.
    risk_class: operational
    basis: >
      The Address.java class unconditionally sets country in toDOM()
      (line 153), but the DTD schema marks it optional. The fromDOM()
      method retrieves country with false parameter after zipCode,
      treating it as required in parsing but the DTD definition allows
      it to be absent. This appears to be a potential conflict in the
      source data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 150
        line_end: 154
        excerpt: |
          XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
          XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
          XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
          XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
    stack_metadata:
      xml.serialization: supported

  - record_key: customer-management-requirement-0001
