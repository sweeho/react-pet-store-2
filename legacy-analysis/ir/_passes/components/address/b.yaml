  - record_key: ADDR-ENTITY-0003
    kind: entity
    capability_key: customer-management
    requirement: >
      The optional country field MAY be absent or null; deserialization (fromDOM) SHALL
      attempt to read Country from the XML, and if no Country element is present, address.country
      will be set to null or the return value of getContentAsString(null, false).
    confidence: medium
    confidence_basis: >
      The fromDOM() method reads Country using getNextSibling() with optional=false
      (line 175), which suggests a required field, but the DTD marks it as optional.
      There is no explicit null check after reading, creating ambiguity about how missing
      Country elements are handled at runtime.
    risk_class: operational
    basis: >
      In Address.fromDOM() (line 175), the method calls XMLDocumentUtils.getNextSibling(child,
      XML_COUNTRY, false), treating Country as non-optional in deserialization. However, the
      Address.dtd marks Country with '?' (zero or one occurrence), suggesting it can be absent.
      The mismatch between schema optionality and deserializer strictness creates potential
      for deserialization failures if Country is truly absent.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 175
        line_end: 176
