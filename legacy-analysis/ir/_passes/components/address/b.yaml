  - record_key: ADDR-BUSINESS-0003
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The AddressEJB bean SHALL NOT be reentrant; concurrent invocations from the same
      client context on the same Address instance SHALL be serialized by the container.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declaratively sets <reentrant>False</reentrant> at the entity level,
      which is the authoritative configuration for concurrency policy in EJB 2.0. This is
      a container-enforced constraint, not a runtime check.
    risk_class: operational
    basis: >
      The AddressEJB definition in ejb-jar.xml explicitly sets <reentrant>False</reentrant>
      (line 54), indicating that the EJB container SHALL NOT allow concurrent access to the
      same bean instance from the same client.
    traces:
