    confidence_basis: >
      AddressLocalHome declares three create() method signatures, and AddressEJB provides
      corresponding ejbCreate() implementations for all three. All three are registered in
      ejb-jar.xml as unchecked methods, confirming they are all accessible.
    risk_class: operational
    basis: >
      The AddressLocalHome interface defines three create methods: create(String,String,String,
      String,String,String), create(Address), and create() with no parameters (lines 45-50).
      AddressEJB implements all three with ejbCreate() and ejbPostCreate() pairs (lines 73-103).
      The ejb-jar.xml declares all three create signatures as <unchecked /> methods, granting
      unrestricted access (lines 125-162).
