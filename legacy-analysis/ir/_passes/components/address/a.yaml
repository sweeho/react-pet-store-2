        line_end: 149
        excerpt: |
          if (streetName2 != null && !streetName2.equals("")) {
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
          }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: ADDR-ENTITY-0003
    kind: entity
    capability_key: customer-management
    requirement: >
      The Country field in an Address SHALL be optional; an Address is valid without
      a country value.
    confidence: medium
    confidence_basis: >
      The DTD schema marks Country with '?' (zero or one). However, no explicit null/empty
      check is visible in the serialization code for Country (unlike streetName2), and
      deserialization does not treat it as optional. This suggests the optionality is
      schema-defined but may not be enforced at runtime.
    risk_class: operational
    basis: >
      The DTD schema marks Country as optional with the '?' quantifier. However, the
      Address.java fromDOM() method reads Country without a null check, suggesting that
      while the schema allows it to be absent, the code may not handle its absence gracefully.
    traces:
