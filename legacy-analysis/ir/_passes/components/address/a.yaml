findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
    description: >
      The PurchaseOrder ejb-jar.xml includes declarative configuration for AddressEJB
      (multiple references to AddressLocal, AddressLocalHome, and CMR relationship roles),
      but the exact nature of the relationship (1-1, 1-M, M-M) and whether it represents
      billing-address, shipping-address, or both is not evident from the XML alone. The
      method signatures in PurchaseOrderEJB do not show direct address parameter passing.
      A human review of the complete PurchaseOrder ejb-jar.xml and PurchaseOrderEJB
      relationship declarations is needed to clarify the integration pattern.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
    description: >
      The DTD marks Country as optional (Country?), but the fromDOM() method in
      Address.java does not check for null before reading Country from the XML.
      It is unclear whether missing Country elements in XML will cause an exception
      or silently result in null/empty values. This could indicate either a latent
      defect in deserialization or that the DTD's optionality is overstated.
