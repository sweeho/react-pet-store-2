  - record_key: ADDR-BUSINESS-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      Addresses SHALL be created via EJB factory methods that accept either individual
      field parameters (streetName1, streetName2, city, state, zipCode, country) or an
      Address data object containing all fields.
    confidence: high
    confidence_basis: >
      Multiple create() method signatures are declared in AddressLocalHome and implemented
      in AddressEJB.ejbCreate(). The ejb-jar.xml assembly descriptor declares three distinct
      create method signatures, all marked as unchecked (accessible to all callers).
    risk_class: operational
    basis: >
      The AddressEJB defines two ejbCreate() methods: one accepting six String parameters,
      and one accepting an Address object. Both are registered in ejb-jar.xml as create
      methods with <unchecked /> permission, indicating they are accessible without
      authorization checks.
    traces:
