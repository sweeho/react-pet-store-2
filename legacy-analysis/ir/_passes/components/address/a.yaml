records:
  - record_key: ADDR-ENTITY-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      An Address entity SHALL store postal address information comprising street address
      (two optional lines), city, state, ZIP/postal code, and country.
    confidence: high
    confidence_basis: >
      Both the CMP field declarations and XML schema confirm the presence and structure
      of all six fields. The DTD schema and the AddressEJB CMP definitions provide
      independent sources affirming the same field structure.
    risk_class: operational
    basis: >
      The AddressEJB abstract class defines six CMP (Container Managed Persistence)
      fields for streetName1, streetName2, city, state, zipCode, and country. The DTD
      schema (Address.dtd) specifies the same fields as XML elements, with StreetName
      appearing twice (the second is optional) to represent two street lines.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);
          public abstract String getCity();
          public abstract void setCity(String city);
          public abstract String getState();
          public abstract void setState(String state);
          public abstract String getZipCode();
          public abstract void setZipCode(String zipCode);
          public abstract String getCountry();
          public abstract void setCountry(String country);
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.persistence: CMP 2.x

  - record_key: ADDR-ENTITY-0002
    kind: entity
    capability_key: customer-management
    requirement: >
      The second street address line (StreetName2) SHALL be optional; an Address
      is valid with only the first street line populated.
    confidence: high
    confidence_basis: >
      The DTD explicitly marks the second StreetName as optional with the '?' operator.
      The Address.java serialization logic (toDOM method) checks for null/empty before
      appending the second street name.
    risk_class: operational
    basis: >
      In the Address.dtd, the second StreetName element is marked with '?' indicating
      zero or one occurrence. The Address.java toDOM() method (lines 147-149) uses a
      null/empty check before appending streetName2 to the XML document.
    traces:
