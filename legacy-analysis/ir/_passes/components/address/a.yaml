  - record_key: ADDR-BUSINESS-0002
    kind: business-rule
    capability_key: customer-management
    requirement: >
      All accessor and mutator methods on Address (getters and setters for all six fields)
      SHALL execute within a container-managed transaction context with transaction
      attribute "Required".
    confidence: high
    confidence_basis: >
      The ejb-jar.xml <assembly-descriptor> exhaustively declares <container-transaction>
      elements for each getter and setter, all with <trans-attribute>Required</trans-attribute>.
      This appears to be declarative configuration applied uniformly.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly descriptor lists container-transaction declarations for
      getCity, setStreetName2, setStreetName1, getZipCode, setState, getCountry, remove,
      setZipCode, getStreetName2, getStreetName1, setCountry, setCity, and getData,
      all assigned the "Required" transaction attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 250
        line_end: 387
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCountry</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <!-- ... additional similar entries for all getters/setters ... -->
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.transaction: Required

  - record_key: ADDR-WORKFLOW-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      An Address data object SHALL be serializable to an XML DOM element representation
      and deserializable from an XML DOM element representation, preserving all field values.
    confidence: high
    confidence_basis: >
      The Address.java class implements both toDOM() and fromDOM() methods that perform
      bidirectional XML transformation. The fromDOM() method validates the element tag
      name and throws XMLDocumentException if the element is not named "Address".
    risk_class: operational
    basis: >
      Address.java provides toDOM(Document) and fromDOM(Node) methods that handle
      serialization to/from XML DOM. The toDOM method appends all address fields as XML
      child elements; fromDOM reconstructs an Address object by reading those elements
      in sequence, with special handling for the optional streetName2 field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 180
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: ADDR-INTEGRATION-0001
    kind: integration
    capability_key: order-placement
    requirement: >
      The AddressEJB SHALL be usable as a container-managed relationship (CMR) from
      other EJBs, specifically PurchaseOrderEJB, to represent billing and shipping
      addresses associated with orders.
    confidence: medium
    confidence_basis: >
      References to AddressLocal and AddressLocalHome exist in the PurchaseOrder component's
      imports and ejb-jar.xml configuration, suggesting integration. However, the actual
      CMR relationship declarations in PurchaseOrderEJB are not visible in the excerpts read—
      only the ContactInfoLocal and CreditCardLocal relationships are clearly shown in
      the PurchaseOrderEJB code. This suggests address integration may exist but its exact
      form (whether as a direct relationship or used via ContactInfo) is unclear from
      the source visible.
    risk_class: operational
    basis: >
      PurchaseOrderEJB imports AddressLocal and AddressLocalHome, and both are referenced
      in the PurchaseOrder ejb-jar.xml configuration. The PurchaseOrder ejb-jar.xml declares
      AddressEJB relationships and includes it in the enterprise-beans section, but the
      exact nature of how PurchaseOrderEJB accesses addresses (directly or through ContactInfo)
      requires further inspection of the relationship declarations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 53
        line_end: 54
        excerpt: |
          import com.sun.j2ee.blueprints.address.ejb.AddressLocal;
          import com.sun.j2ee.blueprints.address.ejb.AddressLocalHome;
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 1
        line_end: 20
        excerpt: |
          <!-- AddressEJB declared in PurchaseOrder ejb-jar.xml: multiple references
               to AddressLocal, AddressLocalHome, and AddressEJB in relationship and
               method declarations indicate integration -->
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.relationship: PurchaseOrderEJB

  - record_key: ADDR-BUSINESS-0003
    kind: business-rule
    capability_key: customer-management
    requirement: >
      An Address object SHALL provide a getData() method that returns a fresh Address
      data object containing copies of all current field values from the EJB instance.
    confidence: high
    confidence_basis: >
      The AddressEJB defines a getData() method that constructs and populates a new
      Address object with all six fields from the EJB's CMP fields. The method is
      declared in AddressLocal interface and transactionally wrapped in ejb-jar.xml.
    risk_class: operational
    basis: >
      The AddressEJB class defines the getData() method (lines 105-114) which creates
      a new Address object and copies all CMP field values into it. This method is
      transactionally managed as "Required" per the ejb-jar.xml assembly descriptor.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 105
        line_end: 114
        excerpt: |
          public Address getData() {
            Address address = new Address();
            address.setStreetName1(getStreetName1());
            address.setStreetName2(getStreetName2());
            address.setCity(getCity());
            address.setState(getState());
            address.setZipCode(getZipCode());
            address.setCountry(getCountry());
            return address;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 368
        line_end: 387
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getData</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
