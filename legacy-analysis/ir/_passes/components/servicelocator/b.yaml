records:
  - record_key: ADMIN-ENTITY-0001
    kind: entity
    capability_key: admin-operations
    requirement: >
      The system SHALL define a ServiceLocatorException class that wraps lower-level
      exceptions (NamingException, general Exception) and provides a mechanism to
      retrieve the root cause exception through recursive unwrapping.
    confidence: high
    confidence_basis: >
      The exception class is explicitly defined with clear constructor overloads and
      a getRootCause() method that recursively unwraps the exception chain. The
      implementation is straightforward and unambiguous - both passes would identify
      the same structure and behavior.
    risk_class: operational
    basis: >
      ServiceLocatorException.java defines three constructor overloads: one with
      message and exception, one with message only, and one with exception only.
      The getRootCause() method recursively checks if the wrapped exception is a
      ServiceLocatorException and unwraps it until reaching the root cause or the
      exception itself.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 46
        line_end: 97
        excerpt: |
          public class ServiceLocatorException extends Exception {
            private Exception exception;
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
            }
            public Exception getException() {
              return exception;
            }
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
    stack_metadata:
      framework: J2EE exception handling

  - record_key: ADMIN-WORKFLOW-0001
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Service Locator utility for the EJB tier that
      initializes a JNDI InitialContext and uses it to look up distributed enterprise
      resources without caching, throwing ServiceLocatorException on any lookup failure.
    confidence: high
    confidence_basis: >
      The EJB ServiceLocator class explicitly instantiates InitialContext in its
      constructor and implements multiple lookup methods that wrap exceptions
      consistently. The absence of caching is evident from the code structure -
      each lookup method performs a direct JNDI lookup without checking a cache.
    risk_class: operational
    basis: >
      The com.sun.j2ee.blueprints.servicelocator.ejb.ServiceLocator class instantiates
      InitialContext in its constructor and catches NamingException. Each lookup method
      (getLocalHome, getRemoteHome, getQueueConnectionFactory, getQueue, getTopic,
      getDataSource, getUrl, getBoolean, getString) performs a direct ic.lookup()
      call without any cache check, and wraps any exception in ServiceLocatorException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 60
        line_end: 74
        excerpt: |
          public class ServiceLocator {
            private InitialContext ic;
            private static ServiceLocator me;
            public ServiceLocator() throws ServiceLocatorException  {
              try {
                ic = new InitialContext();
              } catch (NamingException ne) {
                    throw new ServiceLocatorException(ne);
              } catch (Exception e) {
                    throw new ServiceLocatorException(e);
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
