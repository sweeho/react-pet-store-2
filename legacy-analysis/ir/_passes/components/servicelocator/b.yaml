  - record_key: ADMIN-WORKFLOW-0002
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Service Locator utility for the web tier that
      implements the singleton pattern with static initialization, maintains a
      synchronized HashMap cache for JNDI lookups, and returns cached resources
      on subsequent lookups for the same JNDI name.
    confidence: high
    confidence_basis: >
      The web ServiceLocator class implements both the singleton pattern (static
      initializer, getInstance() method) and caching (synchronized HashMap, cache
      check-before-lookup pattern) explicitly and consistently across all lookup
      methods. The code is declarative and straightforward.
    risk_class: operational
    basis: >
      The com.sun.j2ee.blueprints.servicelocator.web.ServiceLocator class uses a
      static block to initialize a singleton instance. The constructor creates a
      synchronized HashMap for cache. Each lookup method (getLocalHome, getRemoteHome,
      getQueueConnectionFactory, getQueue, getTopic, getDataSource, getUrl, getBoolean,
      getString) checks if the JNDI name is in the cache using containsKey() before
      performing a lookup, and stores the result in the cache for reuse.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 67
        line_end: 96
        excerpt: |
          public class ServiceLocator {
            private InitialContext ic;
            private Map cache;
            private static ServiceLocator me;
            static {
              try {
                me = new ServiceLocator();
              } catch(ServiceLocatorException se) {
                System.err.println(se);
                se.printStackTrace(System.err);
              }
            }
            private ServiceLocator() throws ServiceLocatorException  {
              try {
                ic = new InitialContext();
                cache = Collections.synchronizedMap(new HashMap());
              } catch (NamingException ne) {
                    throw new ServiceLocatorException(ne);
              }
            }
            static public ServiceLocator getInstance() {
              return me;
            }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE Service Locator pattern (web tier)
      session.scope: application singleton
      db.object: n/a - JNDI cache only

