  - record_key: ADMIN-REQUIREMENT-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support JNDI lookup of EJB Remote Homes by performing
      a lookup followed by PortableRemoteObject.narrow() to cast the result
      to the specified Class type, throwing ServiceLocatorException on any failure.
    confidence: high
    confidence_basis: >
      Both ServiceLocator implementations implement getRemoteHome() with the same
      logic: lookup, narrow, cast. The use of PortableRemoteObject.narrow() is
      explicit and required for remote object handling in J2EE.
    risk_class: operational
    basis: >
      Both EJB and web tier ServiceLocator classes define getRemoteHome(String jndiHomeName,
      Class className). The method performs ic.lookup() to get the remote object reference,
      calls PortableRemoteObject.narrow(objref, className) to cast it, then casts to
      EJBHome. Both catch NamingException and general Exception.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 129
        line_end: 147
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBHome) cache.get(jndiHomeName);
              } else {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: JNDI remote EJB lookup with PortableRemoteObject

