records:
  - record_key: SERVICELOCATOR-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Service Locator component that centralizes
      the lookup of J2EE resources (EJB Homes, JMS Destinations, DataSources,
      and environment entries) through JNDI to reduce coupling between clients
      and resource naming.
    confidence: high
    confidence_basis: >
      The ServiceLocator class (both web and EJB versions) is explicitly designed
      and documented as implementing the Service Locator pattern. Both versions
      consistently provide lookup methods for multiple resource types through JNDI.
      The pattern is enforced in both tiers, indicating it is a core architectural
      requirement, not implementation detail.
    risk_class: operational
    basis: >
      The ServiceLocator classes are documented as implementing the Service Locator
      pattern. Package structure and multiple lookup methods (getLocalHome, getRemoteHome,
      getQueue, getTopic, getDataSource, etc.) indicate this is a deliberate pattern.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 57
        line_end: 59
        excerpt: |
          /**
           *  This class is an implementation of the Service Locator pattern. It is
           *  used to looukup resources such as EJBHomes, JMS Destinations, etc.
           */
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 59
        line_end: 66
        excerpt: |
          /**
           * This class is an implementation of the Service Locator pattern. It is
           * used to looukup resources such as EJBHomes, JMS Destinations, etc.
           * This implementation uses the "singleton" strategy and also the "caching"
           * strategy.
           * This implementation is intended to be used on the web tier and
           * not on the ejb tier.
           */
    stack_metadata:
      framework: J2EE
      pattern: Service Locator

  - record_key: SERVICELOCATOR-REQ-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL wrap all JNDI lookup failures (NamingException and other
      exceptions) in ServiceLocatorException, providing a consistent exception
      interface to callers and enabling exception chaining to trace root causes.
    confidence: high
    confidence_basis: >
      Exception wrapping is enforced uniformly across all lookup methods in both
      web and EJB ServiceLocator implementations. Every try-catch block follows
      the same pattern, indicating this is a deliberate requirement, not an
      implementation detail.
    risk_class: operational
    basis: >
      All lookup methods in both ServiceLocator implementations catch NamingException
      and generic Exception, wrapping them in ServiceLocatorException. The
      ServiceLocatorException class supports exception chaining and root cause
      extraction, indicating deliberate error handling strategy.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 43
        line_end: 77
        excerpt: |
          /**
           * This class implements an exception which can wrapped a lower-level exception.
           */
          public class ServiceLocatorException extends Exception {
            private Exception exception;
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
              return;
            }
            public ServiceLocatorException(String message) {
              this(message, null);
              return;
            }
            public ServiceLocatorException(Exception exception) {
              this(null, exception);
              return;
            }
    stack_metadata:
      framework: J2EE
      exception_pattern: Exception Chaining

  - record_key: SERVICELOCATOR-REQ-0003
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL implement the Service Locator for the EJB tier WITHOUT
      resource caching; each JNDI lookup request SHALL perform a fresh lookup
      from the naming service to maintain consistency with EJB server-side state.
    confidence: high
    confidence_basis: >
      The EJB-tier ServiceLocator (ejb/ServiceLocator.java) consistently performs
      direct JNDI lookups without any caching mechanism. This is in contrast to
      the web-tier version, which explicitly uses caching. The absence of caching
      in the EJB tier is deliberate design, not an omission.
    risk_class: operational
    basis: >
      The EJB ServiceLocator has no cache field or caching logic. Each method
      (getLocalHome, getRemoteHome, getQueue, etc.) performs a direct ic.lookup()
      without checking or storing results. The web-tier ServiceLocator by contrast
      explicitly implements caching.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 60
        line_end: 74
        excerpt: |
          public class ServiceLocator {
              private InitialContext ic;
              private static ServiceLocator me;
              public ServiceLocator() throws ServiceLocatorException  {
                try {
                  ic = new InitialContext();
                } catch (NamingException ne) {
                      throw new ServiceLocatorException(ne);
                } catch (Exception e) {
                      throw new ServiceLocatorException(e);
                }
              }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE
      ejb.tier: true
      caching_strategy: none

  - record_key: SERVICELOCATOR-REQ-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL implement the Service Locator for the web tier WITH
      resource caching using a synchronized HashMap; cached resources SHALL be
      reused on subsequent lookups with the same JNDI name to reduce JNDI
      server load.
    confidence: high
    confidence_basis: >
      The web-tier ServiceLocator explicitly initializes a synchronized HashMap
      and every lookup method checks the cache before performing a JNDI lookup.
      Cache operations are consistent across all resource types, indicating this
      is a deliberate caching requirement specific to the web tier.
    risk_class: operational
    basis: >
      The web-tier ServiceLocator (web/ServiceLocator.java) initializes
      cache = Collections.synchronizedMap(new HashMap()) in the constructor.
      Every lookup method follows the pattern: check cache.containsKey(),
      return cached value if found, else perform lookup and cache.put().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 67
        line_end: 92
        excerpt: |
          public class ServiceLocator {
              private InitialContext ic;
              private Map cache; //used to hold references to EJBHomes/JMS Resources for re-use
              private static ServiceLocator me;
              static {
                try {
                  me = new ServiceLocator();
                } catch(ServiceLocatorException se) {
                  System.err.println(se);
                  se.printStackTrace(System.err);
                }
              }
              private ServiceLocator() throws ServiceLocatorException  {
                try {
                  ic = new InitialContext();
                  cache = Collections.synchronizedMap(new HashMap());
                } catch (NamingException ne) {
                      throw new ServiceLocatorException(ne);
                } catch (Exception e) {
                      throw new ServiceLocatorException(e);
                 }
              }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE
      web.tier: true
      caching_strategy: synchronized_hashmap

  - record_key: SERVICELOCATOR-REQ-0005
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL implement the web-tier Service Locator as a singleton,
      initialized via static initializer block, to ensure a single shared
      instance with a pre-initialized cache is available to all callers
      through getInstance() method.
    confidence: high
    confidence_basis: >
      The web-tier ServiceLocator has a static field 'me' and a static
      initializer block that creates the singleton instance. The getInstance()
      method returns this singleton. This pattern is standard and consistently
      implemented in the web version only, not in the EJB version.
    risk_class: operational
    basis: >
      Static field 'me' is initialized in a static block, and getInstance()
      returns it. The web-tier ServiceLocator is explicitly documented as
      intended for web tier use, and the singleton pattern enables shared
      cache across all callers.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 72
        line_end: 96
        excerpt: |
          private static ServiceLocator me;
          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }
          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }
          static public ServiceLocator getInstance() {
            return me;
          }
    stack_metadata:
      framework: J2EE
      pattern: Singleton
      web.tier: true

