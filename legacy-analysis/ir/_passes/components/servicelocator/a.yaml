  - record_key: SERVICELOCATOR-REQ-0007
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support lookup and return of EJB Remote Home interfaces
      via JNDI using PortableRemoteObject.narrow() for remote EJB access,
      enabling clients to obtain references to remote EJB homes without direct
      RMI/JNDI dependency.
    confidence: high
    confidence_basis: >
      Both web and EJB tier ServiceLocators provide getRemoteHome() method that
      uses PortableRemoteObject.narrow() to safely cast remote JNDI lookups.
      This is the standard pattern for remote EJB access in J2EE.
    risk_class: operational
    basis: >
      Both ServiceLocator implementations include getRemoteHome(String jndiHomeName, Class className)
      method that performs JNDI lookup, narrows the result using PortableRemoteObject.narrow(),
      and returns the EJBHome reference.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 95
        line_end: 113
        excerpt: |
          /**
           * will get the ejb Remote home factory.
           * clients need to cast to the type of EJBHome they desire
           *
           * @return the EJB Home corresponding to the homeName
           */
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
    stack_metadata:
      framework: J2EE
      ejb.resource_type: remote_home
      rmi_pattern: PortableRemoteObject.narrow

