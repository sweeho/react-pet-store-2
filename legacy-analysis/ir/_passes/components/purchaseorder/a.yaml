        line_start: 38
        line_end: 68
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShippingInfo, BillingInfo, TotalPrice, CreditCard, LineItem+)>

          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >

          <!ELEMENT OrderId (#PCDATA)>

          <!ELEMENT UserId (#PCDATA)>

          <!ELEMENT EmailId (#PCDATA)>

          <!ELEMENT OrderDate (#PCDATA)>

          <!ELEMENT ShippingInfo (ContactInfo)>

          <!ELEMENT BillingInfo (ContactInfo)>

          <!ELEMENT TotalPrice (#PCDATA)>

          <!ENTITY % ContactInfo PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD ContactInfo 1.1//EN"
           "/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd">
          %ContactInfo;

          <!ENTITY % LineItem PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD LineItem 1.1//EN"
           "/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd">
          %LineItem;

          <!ENTITY % CreditCard PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN"
