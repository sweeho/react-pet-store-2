  - record_key: OF-REQ-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL track shipment quantities for each line item in a purchase order.
      Each LineItem entity SHALL maintain a quantityShipped field (int). The processInvoice
      operation SHALL accept a Map of lineItemIds to Integer quantities shipped, update the
      quantityShipped for each identified line item by adding the received quantity to its current value,
      then return true if and only if all line items in the purchase order have been fully shipped
      (quantity == quantityShipped for every line item), otherwise return false.
    confidence: high
    confidence_basis: >
      The requirement is explicitly documented in PurchaseOrderHelper.processInvoice method comment
      (lines 68-78) and implemented with clear business logic (lines 80-103). The quantityShipped field
      is defined in ejb-jar.xml as a CMP field (line 270). Both passes would agree on the core logic,
      though the confidence is high because the intent is stated in comments.
    risk_class: operational
    basis: >
      CMP field quantityShipped defined in ejb-jar.xml line 270. PurchaseOrderHelper.processInvoice
      (lines 80-103) iterates through lineItems, accumulates shipped quantities from the Map, then
      verifies that for all line items, quantity == quantityShipped.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 270
        line_end: 271
        excerpt: |
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 68
        line_end: 103
        excerpt: |
          /**
           * This method processes invoice information received from supplier by opc. Its
           * job is to update the LineItem fields for the received invoices.
           * Additionally it checks if all invoices of the given PO are shipped,
           * it will return true to indicate all invoices for a purchase order have
           * been joined together and the order is completely fulfilled.
           *
           * @param <Code>po</Code>
           * @param <Code>lineItemIds</Code>
           *
           * @return true or false to indicate if order is completely done
           */
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while

            // now loop through all LIs and see if all are shipped completely
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                  return false;
                  }
            }//end while
            return true;
          }
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: PurchaseOrderEJB, LineItemEJB

