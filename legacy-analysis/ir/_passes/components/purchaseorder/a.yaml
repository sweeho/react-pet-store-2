    kind: entity
    capability_key: order-placement
    requirement: >
      A PurchaseOrder entity SHALL contain an orderId (String), userId (String), emailId (String),
      orderDate (long, milliseconds from epoch), locale (String), totalPrice (float),
      and MUST maintain relationships to one ContactInfo entity (billing/shipping), one CreditCard entity,
      and one-to-many LineItem entities (minimum 1 line item required per order).
    confidence: high
    confidence_basis: >
      The requirement is enforced at three independent layers: (1) the CMP entity bean definition
      in ejb-jar.xml specifies all CMP fields and their types; (2) the PurchaseOrderEJB.java class
      declares abstract getter/setter methods for each field; (3) the PurchaseOrder.java value object
      validates this structure in XML serialization/deserialization, including DTD schema validation
      which mandates LineItem+ (one or more).
    risk_class: operational
    basis: >
      CMP fields defined in ejb-jar.xml lines 60-83 (poId, poUserId, poEmailId, poDate, poLocale, poValue).
      Relationships defined in ejb-jar.xml lines 280-399 (ContactInfo one-to-one, CreditCard one-to-one,
      LineItem one-to-many). PurchaseOrder.java lines 74-83 define instance fields. DTD schema
      (PurchaseOrder.dtd line 38) mandates LineItem+.
