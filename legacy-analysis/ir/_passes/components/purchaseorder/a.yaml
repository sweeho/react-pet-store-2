  - record_key: OP-SCREEN-0010
    kind: screen
    capability_key: order-placement
    requirement: >
      The PurchaseOrder entity SHALL support XML serialization and deserialization with DTD validation.
      The XML format SHALL include elements for OrderId, UserId, EmailId, OrderDate (as yyyy-MM-dd format),
      ShippingInfo (containing nested ContactInfo), BillingInfo (containing nested ContactInfo), TotalPrice,
      CreditCard, and one or more LineItem elements. A locale attribute (default "en_US") is supported at
      the PurchaseOrder element level.
    confidence: medium
    confidence_basis: >
      The XML schema is defined in the DTD and PurchaseOrder.java implements complete serialization/deserialization.
      However, this is a data representation concern (not a UI screen), so it is classified as a screen-like artifact.
      Both passes would find the DTD and Java code, but the date format (yyyy-MM-dd) appears only in the
      SimpleDateFormat string (line 73), not in documentation.
    risk_class: presentational
    basis: >
      PurchaseOrder.dtd lines 38-68 define the XML schema. PurchaseOrder.java lines 73 (SimpleDateFormat),
      194-223 (toXML methods), 225-247 (fromXML methods), 249-276 (toDOM/fromDOM methods) implement serialization.
      DTD validation is enabled via VALIDATING = true (line 62).
    traces:
