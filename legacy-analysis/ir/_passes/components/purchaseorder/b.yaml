      A PurchaseOrder MUST be associated with a minimum of one LineItem entity.
      If a PurchaseOrder is removed, all associated LineItem entities MUST be cascade-deleted.
      LineItem entities are unidirectional (navigable only from PurchaseOrder).
    confidence: high
    confidence_basis: >
      Relationship multiplicity and cascade rules are declaratively defined in ejb-jar.xml.
      DTD schema enforces minimum one LineItem via LineItem+ (one-or-more) cardinality constraint.
      Multiple independent sources (declarative and schema) agree on the requirement.
