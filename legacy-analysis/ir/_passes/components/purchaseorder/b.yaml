    requirement: >
      A PurchaseOrder entity SHALL maintain exactly one container-managed relationship to a ContactInfo entity (representing shipping/billing address information)
      and exactly one relationship to a CreditCard entity. Both relationships SHALL be unidirectional (single-direction navigation from PurchaseOrder to the related entities).
      If a PurchaseOrder is removed, both its associated ContactInfo and CreditCard MUST be cascade-deleted.
    confidence: high
    confidence_basis: >
      Relationships are declaratively defined in ejb-jar.xml with explicit multiplicity (One), named relationship roles,
      and cascade-delete directives. The declaration layer is authoritative for EJB container-managed persistence.
    risk_class: operational
    basis: >
      Relationship declarations in ejb-jar.xml define PurchaseOrder-ContactInfo (lines 286-310) and PurchaseOrder-CreditCard
      (lines 342-366) with multiplicity One on PurchaseOrder side, cascade-delete on the related entity side, and unidirectional
      navigation (no CMR field on related entity). The PurchaseOrderEJB class declares abstract methods setContactInfo() and setCreditCard()
      for relationship navigation.
