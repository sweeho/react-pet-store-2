      CMP field definitions in ejb-jar.xml 60-83 specify seven CMP fields with names and inferred types.
      PurchaseOrderEJB.java 79-145 declare abstract getter/setter pairs for each field.
      PurchaseOrder.java value object 74-83 declares matching instance fields.
      DTD schema 41 declares locale attribute with default "en_US".
