  - record_key: OPL-WF-0005
    kind: workflow
    capability_key: order-placement
    requirement: >
      When creating a new PurchaseOrder, the system SHALL execute a two-phase workflow:
      (1) ejbCreate phase: Accept a PurchaseOrder value object and set all CMP fields (poId, poUserId, poEmailId, poDate, poLocale, poValue).
      (2) ejbPostCreate phase: Atomically create related entity instances (one ContactInfo, one CreditCard, N LineItems via their local homes)
      and establish CMR relationships. This multi-phase workflow MUST occur within a single transaction (trans-attribute: Required).
      If any entity creation fails, the entire transaction MUST be rolled back, leaving no partial PurchaseOrder state.
    confidence: high
    confidence_basis: >
      The ejbCreate/ejbPostCreate pattern is the only creation mechanism visible in the codebase.
      Transaction attribute "Required" is declared for the create method in ejb-jar.xml (line 580).
      The implementation shows sequential entity creation within ejbPostCreate, relying on container-managed transactions.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.ejbCreate (lines 197-205) sets all CMP fields from the PurchaseOrder value object parameter.
      PurchaseOrderEJB.ejbPostCreate (lines 211-238) uses ServiceLocator to obtain local homes and creates ContactInfo (line 218),
      CreditCard (line 223), and iterates over lineItems collection creating LineItem entities (lines 225-234).
      Transaction attribute for create method specified in ejb-jar.xml lines 572-581 as trans-attribute: Required.
