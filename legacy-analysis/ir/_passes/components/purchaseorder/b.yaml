    requirement: >
      The PurchaseOrder entity SHALL persist the following attributes: an immutable order identifier (poId, String, primary key),
      associated user identifier (poUserId, String), customer email address (poEmailId, String),
      order creation timestamp (poDate, long milliseconds since epoch), customer locale preference (poLocale, String with default "en_US"),
      and total order value (poValue, float representing monetary amount).
