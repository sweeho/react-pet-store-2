  - record_key: OPL-BILLING-0014
    kind: business-rule
    capability_key: order-placement
    requirement: >
      When assembling a complete PurchaseOrder, both shipping and billing information MUST be provided as ContactInfo entities.
      A PurchaseOrder contains one ContactInfo for shipping destination and one for billing.
      The PurchaseOrder value object represents both as shippingInfo and billingInfo fields (lines 79-80 in PurchaseOrder.java).
      GIVEN a PurchaseOrder is created with shippingInfo and billingInfo ContactInfo objects,
      WHEN the PurchaseOrderEJB.getData() method is called,
      THEN the method SHALL return both pieces of contact information to the caller.
    confidence: medium
    confidence_basis: >
      The requirement is inferred from code structure and XML schema. The DTD requires both ShippingInfo and BillingInfo elements.
      The PurchaseOrderEJB.getData() method accesses them separately (getContactInfo().getData()).
      However, there is no explicit business rule documentation or validation that enforces their distinctness or purpose.
      Note: PurchaseOrderEJB.getData() line 268 contains a suspicious assignment (shippingInfo = billingInfo), marked with XXX comment,
      suggesting a potential defect in the implementation.
    risk_class: operational
    basis: >
      PurchaseOrder.java lines 79-80 declare shippingInfo and billingInfo as separate ContactInfo fields.
      PurchaseOrder.dtd lines 52-54 require both ShippingInfo and BillingInfo elements.
      PurchaseOrderEJB.getData() lines 267-268 retrieve both: billingInfo = getContactInfo().getData(), then
      shippingInfo = billingInfo (which appears to be a bug or placeholder).
      PurchaseOrderEJB.ejbPostCreate line 218 creates ContactInfo from purchaseOrder.getShippingInfo().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 74
        line_end: 84
        excerpt: |
          private Locale locale = Locale.US;
          private String orderId;
          private String userId;
          private String emailId;
          private Date orderDate;
          private ContactInfo shippingInfo;
          private ContactInfo billingInfo;
          private float totalPrice;
          private CreditCard creditCard;
          private ArrayList lineItems = null;
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 259
        line_end: 276
        excerpt: |
          public PurchaseOrder getData() {
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            purchaseOrder.setOrderId(getPoId());
            purchaseOrder.setUserId(getPoUserId());
            purchaseOrder.setEmailId(getPoEmailId());
            purchaseOrder.setOrderDate(new Date(getPoDate()));
            purchaseOrder.setLocale(getPoLocale());
            purchaseOrder.setTotalPrice(getPoValue());
            purchaseOrder.setBillingInfo(getContactInfo().getData());
            purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo()); // XXX
            purchaseOrder.setCreditCard(getCreditCard().getData());
            Collection lineItems = getLineItems();
            for (Iterator iterator = lineItems.iterator(); iterator.hasNext();) {
              LineItemLocal lineItem = (LineItemLocal) iterator.next();
              purchaseOrder.addLineItem(lineItem.getData());
            }
            return purchaseOrder;
          }
