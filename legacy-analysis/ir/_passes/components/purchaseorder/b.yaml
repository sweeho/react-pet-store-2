  - record_key: OPL-FULFILL-0007
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      An order is completely fulfilled when all LineItem entities associated with the PurchaseOrder
      have been shipped in their entirety. For each LineItem, the shipped quantity (quantityShipped)
      MUST equal the ordered quantity (quantity). The system SHALL provide a means to check this condition
      and determine whether an order has reached fulfillment completion status.
    confidence: medium
    confidence_basis: >
      The logic is implemented in PurchaseOrderHelper.processInvoice() method, which explicitly compares quantity to quantityShipped.
      However, there is no declarative state machine or schema constraint that enforces or names this business rule.
      The rule is only evident through code inspection of the helper method.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice() method (lines 80-103) implements the fulfillment completion check.
      Lines 94-102 loop through all LineItems and return false if any item has quantity != quantityShipped, returning true only
      if all items are fully shipped. The method is named processInvoice, suggesting it is invoked when invoice data arrives from a supplier.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
              //set the quantity of line items shipped in the PO
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
              }//end while
              // now loop through all LIs and see if all are shipped completely
              liColl = po.getLineItems();
              liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() != li.getQuantityShipped()) {
                    return false;
                    }
              }//end while
              return true;
          }
    stack_metadata:
      framework: EJB 2.x Business Logic
      ejb.bean: PurchaseOrderHelper

