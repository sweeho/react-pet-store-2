      High confidence due to multiple enforcement points: (1) CMP field declarations in ejb-jar.xml with explicit types,
      (2) abstract accessor/setter pairs in PurchaseOrderEJB implementation, (3) XML DTD schema constraints,
      (4) value object (PurchaseOrder.java) field definitions. All three sources agree on field names and types.
