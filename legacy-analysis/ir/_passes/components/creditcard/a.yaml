  - record_key: PAYMENTPROCESSING-REQUIREMENT-0002
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL support creation of CreditCard instances through three distinct
      constructors: (1) a no-argument constructor, (2) a constructor accepting
      cardNumber, cardType, and expiryDate as separate String parameters, and (3) a
      constructor accepting a pre-populated CreditCard object.
    confidence: high
    confidence_basis: >
      All three constructor signatures are declared in both the POJO (CreditCard.java)
      and the EJB home interface (CreditCardLocalHome). The EJB container enforces
      these through ejbCreate methods with matching signatures. The constructors are
      invoked in multiple places (CreditCardPopulator and CustomerHTMLAction).
    risk_class: operational
    basis: >
      Three explicit constructors are defined in CreditCard.java (lines 66, 68-72),
      three ejbCreate methods in CreditCardEJB (lines 62-68, 73-78, 82-84), and three
      create methods in CreditCardLocalHome (lines 45-47).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 64
        line_end: 73
        excerpt: |
          public CreditCard() {}

          public CreditCard(String cardNumber, String expiryDate, String cardType) {
            this.cardNumber = cardNumber;
            this.expiryDate = expiryDate;
            this.cardType = cardType;
            return;
          }
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 86
        excerpt: |
          public Object ejbCreate(String cardNumber, String cardType,
                                  String expiryDate) throws CreateException {
                                    setCardNumber(cardNumber);
                                    setCardType(cardType);
                                    setExpiryDate(expiryDate);
                                    return null;
          }

          public void ejbPostCreate(String cardNumber, String cardType,
                                    String expiryDate) throws CreateException { }

          public Object ejbCreate(CreditCard creditCard) throws CreateException {
            setCardNumber(creditCard.getCardNumber());
            setCardType(creditCard.getCardType());
            setExpiryDate(creditCard.getExpiryDate());
            return null;
          }

