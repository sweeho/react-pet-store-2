findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/create_customer.jsp
    description: >
      The credit card validation in the form accepts card numbers up to 30 characters
      (maxlength="30" on the input field) and allows placeholder/test values like
      "0100-001-0001" without any format validation. The system does not enforce Luhn
      digit validation, card number format patterns (Visa, Mastercard, Amex), or PCI
      compliance constraints. It is unclear whether the legacy system was intended to
      perform real payment processing or only to store payment instrument information
      for display in order records.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
    description: >
      The validation logic at lines 152, 160, 168 contains a bug: it checks
      creditCardNumber.equals("") for three consecutive validations instead of checking
      creditCardType, creditCardExpiryMonth, and creditCardExpiryYear respectively. This
      means the validation for Card Type, Expiry Month, and Expiry Year will never fire
      even if those fields are empty, because the same field (creditCardNumber) is
      tested four times. Only credit card number validation actually works.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      The expiryDate is stored as a single string and parsed at read time using indexOf("/")
      and substring operations. This creates a fragile contract: any expiryDate value that
      does not contain exactly one "/" will silently fall back to defaults (month="01", year="2010").
      The system provides no validation that the expiryDate was set in MM/YYYY format, nor any
      detection of malformed dates (e.g., "13/2020" for an invalid month, "2020/01" in reversed
      order, or "01-2020" with a hyphen instead of slash). It is unclear whether the format
      enforcement should occur at creation time, at display time, or not at all.

