  - record_key: PAYMENTPROCESSING-WORKFLOW-0009
    kind: workflow
    capability_key: payment-processing
    requirement: >
      The system SHALL collect credit card information during customer account creation
      and updates. The workflow SHALL extract credit card number, card type, and expiry
      date (as separate month and year fields) from HTML form inputs, validate that
      none of these fields are empty, and construct a CreditCard object before
      proceeding with the account operation.
    confidence: high
    confidence_basis: >
      The create_customer.jsp explicitly defines form inputs for credit card data
      (lines 127-175), and the CustomerHTMLAction.extractCreditCard method (lines 140-179)
      implements the validation and object construction. The validation checks for
      empty strings on each field and builds the expiryDate by concatenating month and
      year with "/".
    risk_class: operational
    basis: >
      create_customer.jsp form fields for credit_card_number, credit_card_type,
      credit_card_expiry_month, and credit_card_expiry_year (lines 127-175).
      CustomerHTMLAction.extractCreditCard method (lines 140-179) validates and
      constructs the CreditCard object.
