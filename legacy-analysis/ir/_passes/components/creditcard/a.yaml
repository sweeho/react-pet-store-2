records:
  - record_key: PAYMENTPROCESSING-ENTITY-0001
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL maintain a CreditCard entity with three primary attributes:
      cardNumber (the credit card account number), cardType (the brand or type of card),
      and expiryDate (the card expiration date in MM/YYYY format).
    confidence: high
    confidence_basis: >
      The entity is declared in the CMP field definitions in ejb-jar.xml and implemented
      as abstract getter/setter methods in CreditCardEJB. Both the DTD schema and the
      CreditCard POJO confirm all three attributes. Multiple independent code paths
      (entity beans, form handlers, and populators) all reference these same fields.
    risk_class: financial
    basis: >
      CMP fields defined in ejb-jar.xml lines 57-68, abstract methods in CreditCardEJB
      lines 50-57, POJO fields in CreditCard lines 60-62, and XML serialization in
      CreditCard lines 108-114 confirm the entity structure.
    traces:
