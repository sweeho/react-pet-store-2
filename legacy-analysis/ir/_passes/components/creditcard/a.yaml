  - record_key: PAYMENTPROCESSING-INTEGRATION-0008
    kind: integration
    capability_key: payment-processing
    requirement: >
      The system SHALL integrate CreditCard information with the PurchaseOrder entity
      through a one-to-one relationship. A PurchaseOrder instance SHALL maintain a
      reference to a CreditCardLocal EJB through getCreditCard() and setCreditCard()
      methods, allowing order records to be associated with the payment instrument
      used at the time of purchase.
    confidence: high
    confidence_basis: >
      PurchaseOrderLocal.java explicitly declares methods getCreditCard() and
      setCreditCard(CreditCardLocal), and the ejb-jar.xml for purchaseorder declares
      an EJB reference to CreditCardEJB with ejb-link that resolves to the CreditCard
      entity bean. This is bidirectional integration documented in both the local
      interface and the deployment descriptor.
    risk_class: financial
    basis: >
      PurchaseOrderLocal.java lines 71-72 declare the getter and setter for CreditCard.
      The purchaseorder ejb-jar.xml declares an ejb-ref-name="ejb/CreditCard" with
      ejb-link="CreditCardEJB" establishing the relationship.
    traces:
