  - record_key: PAYMENTPROCESSING-BUSINESSRULE-0003
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      The system SHALL parse expiryDate from MM/YYYY format to extract the expiry
      month and year as separate components. When parsing, the system SHALL split on
      the "/" character and return the portion before "/" as month and the portion
      after "/" as year.
    confidence: high
    confidence_basis: >
      The parsing logic is explicitly coded in two methods (getExpiryMonth and
      getExpiryYear) in CreditCardEJB. The format MM/YYYY is confirmed by the customer
      form which collects month and year separately and concatenates them with "/".
      Both methods use String.indexOf("/") and substring operations consistently.
    risk_class: operational
    basis: >
      The getExpiryMonth method (CreditCardEJB lines 88-96) extracts text before "/",
      and getExpiryYear method (lines 98-107) extracts text after "/". The customer
      form (create_customer.jsp lines 151-174) collects month and year separately and
      combines them, confirming the MM/YYYY format expectation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());

            }
            return "2010";
          }

  - record_key: PAYMENTPROCESSING-BUSINESSRULE-0004
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      When expiryDate is null or does not contain a "/" character, the system SHALL
      return a default expiry month of "01" and a default expiry year of "2010".
    confidence: medium
    confidence_basis: >
      The default values are hardcoded in the getExpiryMonth and getExpiryYear methods.
      No configuration file, constant, or test defines these values, making them bare
      literals with low traceability. The year 2010 appears to be a template default
      from the early 2000s era of the code. No comment explains why these specific
      defaults were chosen.
    risk_class: operational
    basis: >
      Lines 95 and 106 in CreditCardEJB return hardcoded strings "01" and "2010" when
      the expiryDate is null or lacks a "/". No documentation or configuration governs
      these values.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());

            }
            return "2010";
          }

  - record_key: PAYMENTPROCESSING-REQUIREMENT-0005
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL support XML serialization and deserialization of CreditCard
      objects using DOM methods. The XML element name SHALL be "CreditCard" with
      child elements CardNumber, CardType, and ExpiryDate containing the respective
      field values.
    confidence: high
    confidence_basis: >
      The toDOM and fromDOM methods are explicitly implemented in CreditCard.java.
      The XML structure is defined in the DTD. The implementation uses XMLDocumentUtils
      helper methods for consistent element handling.
    risk_class: presentational
    basis: >
      toDOM method (CreditCard.java lines 108-114) creates the XML structure, and
      fromDOM method (lines 116-130) deserializes it. The DTD (CreditCard.dtd lines
      38-41) defines the expected element structure. Constants are defined in
      CreditCard.java lines 54-59.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 54
        line_end: 130
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd";
          public static final String XML_CREDITCARD = "CreditCard";
          public static final String XML_CARD_NUMBER = "CardNumber";
          public static final String XML_EXPIRYDATE = "ExpiryDate";
          public static final String XML_CARD_TYPE = "CardType";
          ...
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CREDITCARD);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
            XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
            return root;
          }

          public static CreditCard fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
              Element child;
              CreditCard creditCard = new CreditCard();
              child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
              creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_CARD_TYPE, false);
              creditCard.cardType = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_EXPIRYDATE, false);
              creditCard.expiryDate = XMLDocumentUtils.getContentAsString(child, false);
              return creditCard;
            }
            throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
          }

  - record_key: PAYMENTPROCESSING-REQUIREMENT-0006
