  - record_key: PAYMENT-PROCESSING-INTEGRATION-0001
    kind: integration
    capability_key: payment-processing
    requirement: >
      The system SHALL establish a one-to-one association between a PurchaseOrder
      and a CreditCard. When a PurchaseOrder is created, a CreditCard EJB instance
      SHALL be created and associated with it via setCreditCard method.
    confidence: high
    confidence_basis: >
      The relationship is declared in PurchaseOrderEJB via abstract accessor methods
      (CreditCardLocal getCreditCard, void setCreditCard). The ejb-jar.xml
      explicitly declares the EJB relationship (ejb-relation). The PurchaseOrderEJB
      implementation creates the card during ejbCreate (lines showing cardref.create).
    risk_class: operational
    basis: >
      PurchaseOrderLocal.java declares getCreditCard and setCreditCard methods.
      PurchaseOrderEJB.java imports CreditCardLocal and CreditCardLocalHome,
      and creates a CreditCard entity during order creation via
      CreditCardLocalHome.create(). The ejb-jar.xml (in purchaseorder component)
      declares the EJB relationship between PurchaseOrder and CreditCard.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 1
