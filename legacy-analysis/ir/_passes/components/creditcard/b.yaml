      The system SHALL present a credit card information input form containing:
      cardNumber (text input up to 30 chars),
      cardType (dropdown selection from enumerated values),
      expiryDate (separate month [01-12] and year dropdowns).
    confidence: medium
    confidence_basis: >
      The JSP (create_customer.jsp) shows the UI but does not enforce validation
      at this layer. The dropdown selections constrain input (months 01-12, years
      2001-2004) but only reflect what the UI offers, not what the backend accepts.
      No client-side or server-side validation code was found in the source.
    risk_class: operational
    basis: >
      create_customer.jsp lines 127-175 define the HTML form for credit card data.
      Credit card number is a text input with maxlength 30 (lines 134-136).
      Card type is a select with fixed options (lines 143-148).
      Expiry date is two separate selects: month (01-12) and year (2001-2004)
