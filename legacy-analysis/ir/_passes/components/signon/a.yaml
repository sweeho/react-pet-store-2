  - record_key: AUTH-WORKFLOW-0001
    kind: workflow
    capability_key: authentication
    requirement: >
      WHEN a user submits login credentials via the sign-on form on the j_signon_check URL,
      THEN the SignOnFilter validates the credentials against the user database via the
      SignOnEJB.authenticate() method and GIVEN authentication succeeds, the filter SHALL
      store the username in the session attribute j_signon_username and set j_signon to
      true, then redirect to the original requested URL.
    confidence: high
    confidence_basis: >
      The sign-on workflow is implemented in SignOnFilter.validateSignOn() method
      (lines 157-210) which handles the form submission, validates credentials, manages
      session attributes, and performs the redirect. The method references concrete
      session attribute names defined as constants in the filter class.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() retrieves userName and password from request parameters
      (lines 163-165), calls getSignOnEjb().authenticate() (line 190), and upon successful
      authentication, sets session attributes USER_NAME (j_signon_username) and SIGNED_ON_USER
      (j_signon) to true (lines 196-201), then redirects to ORIGINAL_URL (line 204).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 157
        line_end: 210
        excerpt: |
          public void validateSignOn(ServletRequest request, ServletResponse response, FilterChain chain)
            throws IOException, ServletException {
            HttpServletRequest hreq = (HttpServletRequest)request;
            HttpServletResponse hres = (HttpServletResponse)response;
            String userName = hreq.getParameter(FORM_USER_NAME);
            String password = hreq.getParameter(FORM_PASSWORD);
            // ... cookie handling ...
            SignOnLocal signOn = getSignOnEjb();
            boolean authenticated = signOn.authenticate(userName, password);
            if (authenticated) {
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
            } else {
              hres.sendRedirect(signOnErrorPage);
              return;
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 70
        line_end: 79
        excerpt: |
          public static final String FORM_SIGNON_URL = "j_signon_check";
          public static final String FORM_USER_NAME = "j_username";
          public static final String USER_NAME = "j_signon_username";
          public static final String SIGNED_ON_USER  = "j_signon";
          public static final String ORIGINAL_URL = "j_signon_original_url";
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

  - record_key: AUTH-WORKFLOW-0002
    kind: workflow
    capability_key: authentication
    requirement: >
      WHEN a user requests a protected resource URL, THEN the SignOnFilter SHALL check
      if the user is signed on by verifying the j_signon session attribute is true.
      GIVEN the user is not signed on, the filter SHALL redirect to the sign-on page,
      storing the original URL in the session for post-login redirect.
    confidence: high
    confidence_basis: >
      The protected resource check is implemented in SignOnFilter.doFilter() method
      (lines 108-155). The method retrieves the protected resources configuration from
      signon-config.xml, matches the request URL against configured patterns, and handles
      unsigned users. The session attribute check is at lines 125-135.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() checks the j_signon session attribute (line 126), and if
      not set or false, compares the request URI against URL patterns loaded from
      signon-config.xml (lines 137-152). For protected resources that don't match any
      pattern, the filter allows the request to proceed. For matching protected resources,
      it stores the original URL and forwards to the sign-on page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 125
        line_end: 152
        excerpt: |
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();
              if (urlPattern.equals(targetURL)) {
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  return;
              }
          }
          chain.doFilter(request,response);
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

  - record_key: AUTH-REQ-0005
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL optionally store the username in a browser cookie named bp_signon
      when the user checks the "remember username" checkbox during sign-on. The cookie
      SHALL expire after 30 days (2,678,400 seconds) if not cleared sooner.
    confidence: medium
    confidence_basis: >
      The cookie logic is implemented in SignOnFilter.validateSignOn() (lines 167-186).
      The code explicitly creates a cookie with COOKIE_NAME "bp_signon" and sets MaxAge
      to 2678400 (hardcoded literal). The parameter check is directly available in the
      filter. Confidence is medium rather than high because the literal has no comment or
      configuration, and the actual 30-day calculation is not explicitly verified.
    risk_class: presentational
    basis: >
      SignOnFilter checks for the rememberUserName parameter (line 167). If present,
      it creates a Cookie with COOKIE_NAME (bp_signon) and the username, then sets
      setMaxAge(2678400) (line 172). If the parameter is not present, the filter removes
      any existing bp_signon cookie (lines 179-181).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 167
        line_end: 186
        excerpt: |
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
            // see if the cookie exists and remove accordingly
            Cookie[] cookies = hreq.getCookies();
            if (cookies != null) {
              for (int loop=0; loop < cookies.length; loop++) {
                if (cookies[loop].getName().equals(COOKIE_NAME)) {
                  cookies[loop].setMaxAge(0);
                  hres.addCookie(cookies[loop]);
                }
              }
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 74
        line_end: 79
        excerpt: |
          public static final String REMEMBER_USERNAME = "j_remember_username";
          public static final String COOKIE_NAME = "bp_signon";
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

  - record_key: AUTH-SCREEN-0001
    kind: screen
    capability_key: authentication
    requirement: >
      The system SHALL protect access to specific application screens and actions that
      require authentication, including customer profile screen (customer.screen),
      customer action (customer.do), order entry screen (enter_order_information.screen),
      and the signon welcome screen (signon_welcome.screen).
    confidence: high
    confidence_basis: >
      The protected resources are declaratively configured in signon-config.xml
      (lines 49-80). Each resource is explicitly listed with its URL pattern and a
      descriptive name in security-constraint blocks. The configuration file is loaded
      by SignOnFilter during initialization and used to determine which URLs require
      authentication.
    risk_class: operational
    basis: >
      signon-config.xml defines four protected resources with explicit URL patterns and
      descriptive names. The SignOnFilter loads this configuration (lines 90-98) and
      uses the protected resources map to determine access control decisions.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 49
        line_end: 80
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>Customer Screen</web-resource-name>
              <url-pattern>customer.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <security-constraint>
            <web-resource-collection>
              <web-resource-name>Customer Action</web-resource-name>
              <url-pattern>customer.do</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <security-constraint>
            <web-resource-collection>
              <web-resource-name>Enter Order Information Screen</web-resource-name>
              <url-pattern>enter_order_information.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <security-constraint>
            <web-resource-collection>
              <web-resource-name>Sign On Welcome SCreen</web-resource-name>
              <url-pattern>signon_welcome.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>
    stack_metadata:
      framework: Servlet Filter
      configuration: signon-config.xml

  - record_key: AUTH-REQ-0006
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL declare the sign-on form page and error page URLs in configuration,
      allowing the sign-on page (signon.screen) and error page (signon_error.screen)
      to be referenced by the sign-on filter without hardcoding.
    confidence: high
    confidence_basis: >
      The page URLs are declared in signon-config.xml (lines 41-47) in dedicated
      configuration elements. SignOnFilter loads and uses these values (lines 95-96)
      to determine which pages to display. The declarative approach ensures consistency
      and allows configuration changes without code modification.
    risk_class: operational
    basis: >
      signon-config.xml defines signon-form-login-page as "signon.screen" and
      signon-form-error-page as "signon_error.screen". SignOnDAO parses these values
      and SignOnFilter retrieves them via getSignOnPage() and getSignOnErrorPage()
      methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 40
        line_end: 47
        excerpt: |
          <signon-form-login-page>
            signon.screen
          </signon-form-login-page>
          <signon-form-error-page>
            signon_error.screen
          </signon-form-error-page>
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
            this.config = config;
            try {
              protectedResourcesURL = config.getServletContext().getResource("/WEB-INF/signon-config.xml");
              if (protectedResourcesURL != null) {
                SignOnDAO dao = new SignOnDAO(protectedResourcesURL);
                signOnErrorPage = dao.getSignOnErrorPage();
                signOnPage = dao.getSignOnPage();
                protectedResources = dao.getProtectedResources();
              }
            }
    stack_metadata:
      configuration: signon-config.xml

