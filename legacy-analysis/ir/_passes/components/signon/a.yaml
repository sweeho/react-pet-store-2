records:
  - record_key: AUTH-ENTITY-0001
    kind: entity
    capability_key: authentication
    requirement: >
      The system SHALL represent users as discrete entities with a unique username
      (primary key) and password field for authentication.
    confidence: high
    confidence_basis: >
      The UserEJB entity bean (CMP 2.x) and its interfaces are consistently defined
      across schema, declarative configuration, and Java implementation. The ejb-jar.xml
      explicitly declares the entity, its primary key field, and CMP fields. Multiple
      independent validation points confirm this structure: the ejb-jar.xml schema
      (lines 46-79), UserEJB.java (lines 54-58), and UserLocal interface (lines 49-54)
      all define the same entity shape.
    risk_class: financial
    basis: >
      UserEJB is declared as a CMP 2.x entity bean in ejb-jar.xml with abstract-schema-name
      "User". The CMP fields are declared in ejb-jar.xml (password, userName) and
      implemented as abstract methods in UserEJB.java. UserLocal interface provides
      accessor methods for both fields. The primary key is userName (String).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/ejb-jar.xml
        line_start: 46
        line_end: 79
        excerpt: |
          <entity>
            <display-name>UserEB</display-name>
            <ejb-name>UserEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.signon.user.ejb.UserLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.signon.user.ejb.UserLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.signon.user.ejb.UserEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>User</abstract-schema-name>
            <cmp-field>
              <field-name>password</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>userName</field-name>
            </cmp-field>
            <primkey-field>userName</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 54
        line_end: 58
        excerpt: |
          public abstract String getUserName();
          public abstract void setUserName(String userName);

          public abstract String getPassword();
          public abstract void setPassword(String password);
