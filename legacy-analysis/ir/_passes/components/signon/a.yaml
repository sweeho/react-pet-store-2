  - record_key: AUTH-REQ-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL validate that username does not exceed 25 characters in length
      when creating a user account.
    confidence: high
    confidence_basis: >
      The username length constraint is enforced in the ejbCreate method of UserEJB.java
      (lines 64-67) with explicit validation logic. The constraint references a constant
      MAX_USERID_LENGTH defined in the UserLocal interface. The validation is implemented
      in the entity bean's creation lifecycle and a CreateException is thrown if violated.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() method (lines 64-67) contains explicit validation checking
      that userName.length() is not greater than UserLocal.MAX_USERID_LENGTH (25).
      When violated, a CreateException is raised with the message referencing the limit.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 64
        line_end: 67
        excerpt: |
          if(userName.length() > UserLocal.MAX_USERID_LENGTH) {
              throw new CreateException("User ID cant be more than " +
              UserLocal.MAX_USERID_LENGTH + " chars long");
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserLocal.java
        line_start: 46
        line_end: 46
        excerpt: |
          public static final int MAX_USERID_LENGTH = 25;
    stack_metadata:
      ejb.bean: UserEJB

  - record_key: AUTH-REQ-0002
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL validate that username does not contain the special characters
      '%' (percent) or '*' (asterisk) when creating a user account.
    confidence: high
    confidence_basis: >
      The character validation is explicitly coded in UserEJB.ejbCreate() method
      (lines 72-76) with direct indexOf checks for both prohibited characters.
      A CreateException is raised if either character is found. The validation is
      part of the entity bean's creation lifecycle and is consistently enforced.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() method performs indexOf checks for '%' and '*' characters
      in the userName parameter. If either is found (indexOf returns != -1), a
      CreateException is thrown with a descriptive message.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 72
        line_end: 76
        excerpt: |
          if( (userName.indexOf('%') != -1) ||
          (userName.indexOf('*') != -1) ) {
              throw new CreateException("User Id cannot " +
              "have '%' or '*' characters");
          }
    stack_metadata:
      ejb.bean: UserEJB

  - record_key: AUTH-REQ-0003
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL authenticate a user by validating the supplied password
      against the stored password for a given username.
    confidence: high
    confidence_basis: >
      Authentication is implemented in two independent places that confirm the requirement:
      the SignOnEJB.authenticate() business method (lines 71-78) and the UserEJB.matchPassword()
      method (lines 88-90). The ejb-jar.xml explicitly declares the authenticate method
      with Required transaction attribute (lines 359-365). Both implement direct string
      comparison of passwords.
    risk_class: financial
    basis: >
      SignOnEJB.authenticate() method looks up a user by username via UserEJB.findByPrimaryKey(),
      then calls user.matchPassword(password). UserEJB.matchPassword() performs a direct
      String.equals() comparison. The method returns false if the user is not found or
      password does not match.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/ejb-jar.xml
        line_start: 359
        line_end: 365
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>SignOnEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>authenticate</method-name>
    stack_metadata:
      ejb.bean: SignOnEJB, UserEJB
      ejb.transaction: Required

  - record_key: AUTH-REQ-0004
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL create a new user account with a provided username and password.
    confidence: high
    confidence_basis: >
      User creation is declared in the business interface SignOnLocal and implemented
      in SignOnEJB.createUser() method. The ejb-jar.xml explicitly declares the createUser
      method with Required transaction attribute. The method delegates to UserEJB.create(),
      which is also declared in the configuration with Required transaction.
    risk_class: operational
    basis: >
      SignOnEJB.createUser() method delegates to ulh.create(userName, password), which
      creates a UserEJB entity. UserEJB.ejbCreate() is invoked as part of the entity
      creation lifecycle, which performs the validation checks and initializes the entity
      fields before persisting.
