  - record_key: AUTH-REQ-0006
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL allow users to optionally remember their username via a
      "Remember My User Name" checkbox. When selected, the username SHALL be stored
      in a cookie named "bp_signon" with a maximum age of 2678400 seconds (30 days).
    confidence: high
    confidence_basis: >
      Cookie creation and management logic are explicitly implemented in
      SignOnFilter.validateSignOn(). The cookie age value is hardcoded.
    risk_class: operational
    basis: >
      When the "j_remember_username" parameter is present in the sign-on form
      submission, a cookie is created with the username value and a 30-day expiry.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          // check if the user wants userName set in cookie
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }
    stack_metadata:
      framework: Servlet Filter

