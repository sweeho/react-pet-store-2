records:
  - record_key: AUTH-REQ-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL authenticate users by verifying a username and password pair
      against stored user credentials via the SignOnEJB.authenticate() method.
    confidence: high
    confidence_basis: >
      Both the SignOnEJB code and the SignOnFilter implementation confirm this requirement.
      The authenticate() method uses UserEJB.findByPrimaryKey() to locate the user and
      matchPassword() to verify credentials. Both passes should agree on this core workflow.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() finds user by username and calls user.matchPassword(password).
      UserEJB.matchPassword() performs direct string equality comparison of passwords.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      ejb.bean: SignOnEJB (Stateless Session)
      ejb.transaction: Required

  - record_key: AUTH-REQ-0002
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL maintain user authentication state in the HTTP session using
      a Boolean attribute keyed by "j_signon", and authorize access to protected
      resources only when this attribute is true.
    confidence: high
    confidence_basis: >
      Session attribute management is explicitly implemented in SignOnFilter.doFilter().
      The requirement is enforced at the filter entry point before resource access.
    risk_class: operational
    basis: >
      SignOnFilter checks session.getAttribute(SIGNED_ON_USER) to determine if user is
      authenticated. If false or null, and the URL matches a protected resource, the user
      is redirected to the sign-on form.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 155
        excerpt: |
          // check if the user is signed on
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          // jump to the resource if signed on
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
          // find out if the patterns match the target URL
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();
              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  return;
              }
          }
          // No matches if we made it to here
          chain.doFilter(request,response);
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

  - record_key: AUTH-REQ-0003
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL define protected resources via URL pattern matching declared
      in the signon-config.xml file. Each protected resource maps a URL pattern to
      a resource name and optional role-based access control list.
    confidence: high
    confidence_basis: >
      Configuration is explicitly loaded from signon-config.xml by SignOnDAO and
      enforced by SignOnFilter. The mapping is declarative and separate from code logic.
    risk_class: operational
    basis: >
      SignOnDAO.getProtectedResources() parses security-constraint elements from the
      configuration file. Each constraint contains web-resource-collection (URL pattern)
      and optional auth-constraint (roles).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 50
        line_end: 71
        excerpt: |
          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Customer Screen</web-resource-name>
             <url-pattern>customer.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Customer Action</web-resource-name>
             <url-pattern>customer.do</url-pattern>
            </web-resource-collection>
          </security-constraint>
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnDAO.java
        line_start: 127
        line_end: 163
        excerpt: |
          private HashMap getProtectedResources(Element root) {
              HashMap resources = new HashMap();
              // get the signon page and signon error page
              signOnLoginPage = getTagValue(root, SIGNON_FORM_LOGIN_PAGE ).trim();
              signOnErrorPage = getTagValue(root, SIGNON_FORM_ERROR_PAGE ).trim();

              // get protected pages //
              NodeList outterList = root.getElementsByTagName(SECURITY_CONSTRAINT);
              for (int outterLoop = 0; outterLoop < outterList.getLength(); outterLoop++) {
                  Element element = (Element)outterList.item(outterLoop);
                  ArrayList roles = new ArrayList();
                  NodeList list = element.getElementsByTagName(WEB_RESOURCE_COLLECTION);
                  for (int loop = 0; loop < list.getLength(); loop++) {
                      Node node = list.item(loop);
                      if (node != null) {
                          String resourceName = getSubTagValue(node, WEB_RESOURCE_NAME);
                          String urlPattern = getSubTagValue(node, URL_PATTERN);
                          ProtectedResource resource = new ProtectedResource(resourceName, urlPattern, roles);
    stack_metadata:
      declarative_validator: signon-config.xml

  - record_key: AUTH-REQ-0004
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL redirect authenticated users to their originally requested
      URL after successful sign-on. The original URL SHALL be stored in the
      "j_signon_original_url" session attribute before redirecting to the sign-on form.
    confidence: high
    confidence_basis: >
      Both sign-on success and session attribute management are explicitly implemented
      in SignOnFilter.validateSignOn().
    risk_class: operational
    basis: >
      When a protected resource is accessed, the original URL is stored in session
      before the sign-on form is displayed. After successful authentication, the
      filter retrieves this URL and performs a server-side redirect.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 146
        line_end: 148
        excerpt: |
          hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
          config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 191
        line_end: 205
        excerpt: |
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
          }
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

