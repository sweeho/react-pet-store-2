  - record_key: PROD-CAT-WORKFLOW-0008
    kind: workflow
    capability_key: product-catalog
    requirement: >
      GIVEN a search query string, start index, and count, WHEN searchItems is invoked,
      THEN the system SHALL tokenize the query by whitespace into keywords, search for
      items matching ANY keyword (OR logic) across product name, category ID, and item
      description, and return a Page of matching items with pagination state.
    confidence: high
    confidence_basis: >
      GenericCatalogDAO.searchItems (lines 343-398) explicitly tokenizes the query
      (line 346) via StringTokenizer, constructs an OR-based SQL query with parameterized
      wildcards (lines 359-365), and applies the standard pagination algorithm. The
      SQL fragments (CatalogDAOSQL.xml, lines 112-127) show the VARIABLE occurrence
      pattern for multiple keyword clauses.
    risk_class: operational
    basis: >
      The searchItems method tokenizes the search query into keywords via StringTokenizer.
      For each keyword, it appends three wildcard patterns (one each for name, catid, descn).
      The SQL uses LIKE with lowercase() functions and "%" wildcards, with OR logic between
      alternatives. If the keyword set is empty, it returns Page.EMPTY_PAGE (line 351).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 398
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[1 + (keywords.length * 3)];
                  parameterValues[0] = locale.toString();
                  for (int i = 0; i < keywords.length; i++) {
                    parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
                  }
                  statement = buildSQLStatement(connection, sqlStatements, XML_SEARCH_ITEMS, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List items = new ArrayList();
                      do {
                        int i = 1;
                        items.add(new Item(resultSet.getString(i++).trim(),
                                           resultSet.getString(i++).trim(),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++).trim(),
                                           resultSet.getString(i++).trim(),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++),
                                           resultSet.getString(i++),
                                           resultSet.getDouble(i++),
                                           resultSet.getDouble(i++)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(items, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                  throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                  closeAll(connection, statement, resultSet);
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
