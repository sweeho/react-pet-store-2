  - record_key: PROD-CAT-WORKFLOW-0003
    kind: workflow
    capability_key: product-catalog
    requirement: >
      GIVEN a start index and count, WHEN getCategories is invoked,
      THEN the system SHALL return a Page containing up to count categories
      (ordered alphabetically by name within each locale), with hasNext set to true
      if more categories exist beyond the returned page, and hasNext false otherwise.
    confidence: high
    confidence_basis: >
      The DAO query (CatalogDAOSQL.xml, lines 71-76) orders by name. The GenericCatalogDAO.getCategories
      (lines 182-210) implements pagination by calling resultSet.absolute(start + 1),
      then looping up to count rows while tracking hasNext as resultSet.next(). The logic
      is concrete and unambiguous.
    risk_class: operational
    basis: >
      CatalogDAOSQL.xml defines GET_CATEGORIES with "order by name". GenericCatalogDAO.getCategories
      positions to the start row, then pulls up to count categories into a list,
      setting hasNext = resultSet.next() (line 201) to detect whether a next row exists.
      If no more rows fit in the requested count, hasNext is false.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 76
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ?  order by name
              </SQLFragment>
          </SQLStatement>
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                  throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                  closeAll(connection, statement, resultSet);
              }
          }
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required
      db.object: category, category_details

