records:
  - record_key: PROD-CAT-ENTITY-0001
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL represent catalog categories as discrete entities with
      unique identifier (catid), display name, and locale-specific descriptions.
    confidence: high
    confidence_basis: >
      Both passes likely agree on this entity from the schema joins and model objects.
      The Category model class (lines 49-74 of Category.java) enforces ID, name,
      and description fields. Multiple independent validation points: schema
      (category table), model, and multiple DAO access patterns all align.
    risk_class: operational
    basis: >
      Category.java defines a serializable entity with id, name, and description.
      The data model is enforced by the DAO (GenericCatalogDAO, lines 159-180) which
      materializes Category objects from query results. The SQL schema join on
      category and category_details tables implements the multi-locale requirement.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Category.java
        line_start: 49
        line_end: 74
        excerpt: |
          public class Category implements java.io.Serializable {
              private String id;
              private String name;
              private String description;

              public Category(String id, String name, String description) { ... }

              public String getId() { return id; }
              public String getName() { return name; }
              public String getDescription() { return description; }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 64
        line_end: 70
        excerpt: |
          <SQLStatement method="GET_CATEGORY">
              <SQLFragment parameterNb="2">
                  select name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ? and a.catid = ?
              </SQLFragment>
          </SQLStatement>
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: category, category_details

  - record_key: PROD-CAT-ENTITY-0002
