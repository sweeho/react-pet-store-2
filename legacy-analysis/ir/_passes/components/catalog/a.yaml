  - record_key: PROD-CAT-ENTITY-0003
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL represent inventory items with unique identifier (itemid),
      parent product reference, pricing (listPrice, unitCost), image reference,
      five descriptive attributes, and category assignment.
    confidence: high
    confidence_basis: >
      Item model class (Item.java, lines 47-141) exhaustively enumerates all fields
      with type safety. DAO layer (GenericCatalogDAO, lines 266-300) retrieves all
      fields via a stable query structure. The field order in SQL queries matches
      the Java constructor argument order, proving intent. No ambiguity on which
      fields belong to Item.
    risk_class: operational
    basis: >
      Item.java defines category, productId, productName, attribute1-5, itemId,
      description, listPrice, and unitCost fields. The SQL queries (CatalogDAOSQL.xml,
      lines 92-100) materialize all these fields in consistent order, joining across
      item, item_details, product_details, and product tables. Pricing fields are
      double-typed, enforcing numeric constraints at the model layer.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Item.java
        line_start: 47
        line_end: 90
        excerpt: |
          public class Item implements Serializable {
              private String category;
              private String productId;
              private String productName;
              private String attribute1;
              private String attribute2;
              private String attribute3;
              private String attribute4;
              private String attribute5;
              private String itemId;
              private String description = "none";
              private double listPrice;
              private double unitCost;
              private String imageLocation;

              public Item(String category, String productId, String productName,
                          String itemId, String imageLocation, String description,
                          String attribute1, String attribute2, String attribute3,
                          String attribute4, String attribute5,
                          double listPrice, double unitCost) { ... }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 92
        line_end: 111
        excerpt: |
          <SQLStatement method="GET_ITEM">
              <SQLFragment parameterNb="2">
                  select catid, a.productid, name, b.image, b.descn, attr1, attr2, attr3,
                          attr4, attr5, listprice, unitcost
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and a.itemid = ?
              </SQLFragment>
          </SQLStatement>
          <SQLStatement method="GET_ITEMS">
              <SQLFragment parameterNb="2">
                  select catid, name, a.itemid, b.image, b.descn, attr1, attr2, attr3,
                          attr4, attr5, listprice, unitcost
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and a.productid = ?
              </SQLFragment>
          </SQLStatement>
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: item, item_details, product_details, product

  - record_key: PROD-CAT-ENTITY-0004
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL represent result pages as immutable collections with item list,
      start index, and pagination state (hasNext flag, previousPageAvailable logic).
    confidence: high
    confidence_basis: >
      Page.java (lines 45-94) defines the exact structure and pagination logic.
      All six DAO query methods return Page objects, enforcing a contract. The
      hasNext flag is consistently computed as a boolean across all result sets.
    risk_class: operational
    basis: >
      Page.java implements pagination with a contained List, start position,
      and hasNext boolean. The logic isPreviousPageAvailable() returns start > 0
      (line 84), and getStartOfPreviousPage() uses Math.max(start - objects.size(), 0).
      All DAO methods (GenericCatalogDAO, lines 182-210, 236-264, 302-341, 343-398)
      wrap results in Page objects with computed hasNext based on whether a next
      row exists in the result set.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              public static final Page EMPTY_PAGE =
                  new Page(Collections.EMPTY_LIST, 0, false);

              List objects;
              int start;
              boolean hasNext;

              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }

              public List getList() { return objects; }

              public boolean isNextPageAvailable() { return hasNext; }

              public boolean isPreviousPageAvailable() { return start > 0; }

              public int getStartOfNextPage() { return start + objects.size(); }

              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }

              public int getSize() { return objects.size(); }
          }
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: none

  - record_key: PROD-CAT-WORKFLOW-0001
    kind: workflow
    capability_key: product-catalog
    requirement: >
      The system SHALL provide a stateless session bean (CatalogEJB) that exposes
      seven methods: getCategory, getCategories, getProduct, getProducts, getItem,
      getItems, and searchItems, each accepting locale-specific filtering and
      pagination parameters.
    confidence: high
    confidence_basis: >
      CatalogLocal interface (lines 53-71) and ejb-jar.xml (lines 43-186) both declare
      the exact same seven method signatures with identical parameter types. The EJB
      container enforces all declarations. No ambiguity on what the bean exposes.
    risk_class: operational
    basis: >
      CatalogEJB (ejb-jar.xml, lines 48-79) is declared as a stateless session bean
      with container-managed transactions. CatalogLocal interface defines seven methods
      (lines 55-70), each with Locale parameter. CatalogEJB implementation (CatalogEJB.java,
      lines 85-149) delegates to the underlying DAO, wrapping CatalogDAOSysException
      in EJBException. All seven methods are mapped to transaction context
      (ejb-jar.xml, lines 91-181) with trans-attribute "Required".
    traces:
