  - record_key: product-catalog-requirement-0007
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL support full-text search of items by keyword query,
      tokenizing input by whitespace and matching against multiple item fields.
      Results SHALL be paginated with start position and page count.
    confidence: high
    confidence_basis: >
      searchItems() method in both EJB and DAO with complete implementation.
      GenericCatalogDAO shows tokenization logic, parameter array construction
      for variable keyword count, and pagination with same ResultSet logic.
    risk_class: operational
    basis: >
      CatalogEJB.searchItems() delegates to DAO. GenericCatalogDAO.searchItems()
      tokenizes query by whitespace into keywordSet, returns EMPTY_PAGE if no
      keywords. For each keyword, creates 3 parameter values with "%" wildcards
      (line_start 362-364), indicating 3 search fields per keyword. If start >= 0
      and ResultSet.absolute() succeeds, paginates with same logic as getItems().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 141
        line_end: 149
        excerpt: |
          public Page searchItems(String searchQuery, int start,
                                  int count, Locale l) {
              try {
                  return dao.searchItems(searchQuery, start, count, l);
              }
              catch (CatalogDAOSysException se) {
                  throw new EJBException(se.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 398
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                connection = getDataSource().getConnection();
                String[] parameterValues = new String[1 + (keywords.length * 3)];
                parameterValues[0] = locale.toString();
                for (int i = 0; i < keywords.length; i++) {
                  parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
                }
                statement = buildSQLStatement(connection, sqlStatements, XML_SEARCH_ITEMS, parameterValues);
                resultSet = statement.executeQuery();
                if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List items = new ArrayList();
                  do {
                    int i = 1;
                    items.add(new Item(resultSet.getString(i++).trim(), ...));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(items, start, hasNext);
                }
                return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                  throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                closeAll(connection, statement, resultSet);
              }
          }
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required
      db.object: SQL_SEARCH_ITEMS

