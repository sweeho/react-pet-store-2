    risk_class: operational
    basis: >
      XMLDocumentUtils.java provides toXML(Document, String, String, Result) and
      toXML(Document, String, URL, boolean, Result) methods. The serialize() method
      at line 364-386 sets OutputKeys for METHOD="xml", DOCTYPE declarations, ENCODING,
      and INDENT="yes". Supports both DTD (DOCTYPE_PUBLIC/SYSTEM) and XSD serialization.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 364
        line_end: 398
        excerpt: |
          public static void serialize(Transformer transformer, Document document, String dtdPublicId,
                                        String dtdSystemId, boolean xsdSupport, String encoding, Result result)
                throws XMLDocumentException {
            try {
              transformer.setOutputProperty(OutputKeys.METHOD, "xml");
              if (!xsdSupport) {
                if (dtdSystemId != null) {
                  transformer.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM, dtdSystemId);
                }
                transformer.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, dtdPublicId);
              }
              transformer.setOutputProperty(OutputKeys.ENCODING, encoding);
              transformer.setOutputProperty(OutputKeys.INDENT, "yes");
              transformer.transform(new DOMSource(document), result);
            } catch (Exception exception) {
              throw new XMLDocumentException(exception);
            }
          }

  - record_key: XMLDOC-REQUIREMENT-0003
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL provide utility methods to navigate and manipulate XML DOM trees,
      including element retrieval by tag name, namespace-aware lookup, and safe traversal
      of parent, child, and sibling relationships.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils contains 30+ utility methods that are used consistently throughout
      the codebase. Both passes can verify the same method signatures and behavior.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java provides getFirstChild(Element, String, boolean),
      getChild(Element, String, boolean), getSibling(Element, boolean),
      getNextSibling(Element, boolean), getContent(Element, boolean) and namespace-aware
      variants (getFirstChildNS, getChildNS, getSiblingNS, getNextSiblingNS).
      All methods accept an optional boolean parameter to control whether missing elements
      throw exceptions or return null. Methods return typed values (String, int, float).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 67
        line_end: 190
        excerpt: |
          public static String getAttribute(Element element, String name, boolean optional) throws XMLDocumentException {
            String value = element.getAttribute(name);
            if (value == null && !optional) {
              throw new XMLDocumentException("Attribute " + name + " of " + element.getTagName() + " expected.");
            }
            return value;
          }
          public static int getAttributeAsInt(Element element, String name, boolean optional) throws XMLDocumentException {
            try {
              return Integer.parseInt(getAttribute(element, name, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + "/@" + name + " attribute: value format error.", exception);
            }
          }
          public static Element getFirstChild(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getTagName().equals(name)) {
                  return (Element) child;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as first child of " + element.getTagName() + ".");
            }
            return null;
          }

  - record_key: XMLDOC-REQUIREMENT-0004
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL provide utility methods to create and populate XML DOM elements
      programmatically, supporting element creation with text content, namespace declarations,
      and typed value handling (String, long, float).
    confidence: high
    confidence_basis: >
      createElement() and appendChild() methods are used consistently for DOM construction.
      Both passes can verify the same method signatures.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java provides createElement(Document, String, String) and
      createElement(Document, String, long/float) variants for creating elements with content.
      appendChild(Document, Node, String, String/long/float) methods for adding child elements.
      Namespace-aware variants (createElementNS, appendChildNS) support XML namespace prefixes.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 274
        line_end: 341
        excerpt: |
          public static Element createElement(Document document, String name, String value) {
            if (value != null) {
              Element element = (Element) document.createElement(name);
              element.appendChild(document.createTextNode(value));
              return element;
            }
            throw new IllegalArgumentException("XMLDocumentUtils.createElement: value of " + name + " element can't be null.");
          }
          public static Element createElement(Document document, String name, long value) {
            return createElement(document, name, Long.toString(value));
          }
          public static void appendChild(Document document, Node root, String name, String value) {
            Node node = document.createElement(name);
            node.appendChild(document.createTextNode(value != null ? value : ""));
            root.appendChild(node);
            return;
          }

  - record_key: XMLDOC-REQUIREMENT-0005
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL support entity catalog resolution for mapping DTD and XSD public
      identifiers to local system paths, with fallback support for parent resolvers and
      resource path lookup.
    confidence: high
    confidence_basis: >
      CustomEntityResolver is instantiated and used throughout for DTD/XSD resolution.
      Both passes can verify the same resolution logic and catalog loading.
    risk_class: operational
    basis: >
      CustomEntityResolver.java implements EntityResolver with resolveEntity(String, String)
      method. It loads an entity catalog from EntityCatalog.properties. The mapEntityURI()
      method looks up public identifiers in the catalog. The resolveEntity() method tries:
      1) parent resolver (if set), 2) catalog lookup via mapEntityURI(), 3) direct URL
      resolution (as file URL or resource path).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 218
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final String ENTITY_CATALOG = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;
            public CustomEntityResolver(URL entityCatalogURL) {
              this(entityCatalogURL, null);
            }
            public String mapEntityURI(String entityURI) {
              if (entityCatalog != null) {
                if (entityURI != null) {
                  String entityURL = entityCatalog.getProperty(entityURI);
                  return entityURL;
                }
              }
              return null;
            }
            public InputSource resolveEntity(String entityURI, String entityURL) {
              try {
                if (parentResolver != null) {
                  source = parentResolver.resolveEntity(entityURI, entityURL);
                  if (source != null) return source;
                }
              } catch (Exception exception) { }
              try {
                if (entityURI != null) {
                  String mappedEntityURL = mapEntityURI(entityURI);
                  if (mappedEntityURL != null) {
                    source = resolveEntityFromURL(mappedEntityURL);
                    if (source != null) return source;
                  }
                }
                if (entityURL != null) {
                  source = resolveEntityFromURL(entityURL);
                  if (source != null) return source;
                }
              } catch (Exception exception) { }
              return null;
            }
          }

  - record_key: XMLDOC-REQUIREMENT-0006
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL provide document editor factory for instantiating XML document editors
      by schema URI with a catalog mapping configuration.
    confidence: medium
    confidence_basis: >
      XMLDocumentEditorFactory is a simple factory but used less frequently than other classes.
      Catalog-based instantiation is verifiable from source but usage patterns are limited.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory.java loads an XDE catalog (mapping schema URIs to class names)
      and provides getXDE(schemaURI) method that looks up the class name and instantiates it
      via reflection using createXDE(className) which calls Class.forName().newInstance().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 76
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();
            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
            }
            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }
              throw new XMLDocumentException("No mapping for schema: " + schemaURI);
            }
            public XMLDocumentEditor createXDE(String className) throws XMLDocumentException {
              try {
                return (XMLDocumentEditor) Class.forName(className).newInstance();
              } catch(Exception exception) {
                throw new XMLDocumentException("Can't instantiate XDE: " + className, exception);
              }
            }
          }

  - record_key: XMLDOC-REQUIREMENT-0007
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL support bidirectional conversion between XML and Java object models
      (DOM-based) for Order Approval documents via toXML() and fromXML() methods.
    confidence: high
    confidence_basis: >
      OrderApproval serialization is core functionality demonstrated in multiple methods.
      Both passes can verify the same toDOM/fromDOM/toXML/fromXML contract.
    risk_class: operational
    basis: >
      OrderApproval.java provides toXML() which returns String, toXML(Result) for streaming,
      fromXML(Source), fromXML(String) with optional entityCatalogURL and validating parameters.
      toDOM() method creates Document with root element "OrderApproval" containing child Order
      elements. fromDOM() factory method reconstructs OrderApproval from Node, iterating through
      ChangedOrder children.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 89
        line_end: 170
        excerpt: |
          public void toXML(Result result) throws XMLDocumentException {
            toXML(result, null);
          }
          public String toXML() throws XMLDocumentException {
            return toXML((URL) null);
          }
          public static OrderApproval fromXML(Source source) throws XMLDocumentException {
            return fromXML(source, null, VALIDATING);
          }
          public Document toDOM() throws XMLDocumentException {
            Document document = XMLDocumentUtils.createDocument();
            Element root = (Element) toDOM(document);
            document.appendChild(root);
            return document;
          }
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ORDERAPPROVAL);
            for (Iterator i = orderList.iterator(); i.hasNext();) {
              ChangedOrder changedOrder = (ChangedOrder) i.next();
              root.appendChild(changedOrder.toDOM(document));
            }
            return root;
          }
          public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDERAPPROVAL)) {
              Element child;
              OrderApproval orderApproval = new OrderApproval();
              orderApproval.orderList = new ArrayList();
              for (child = XMLDocumentUtils.getFirstChild(element, ChangedOrder.XML_ORDER, false);
                   child != null;
                   child = XMLDocumentUtils.getNextSibling(child, ChangedOrder.XML_ORDER, true)) {
                orderApproval.orderList.add(ChangedOrder.fromDOM(child));
              }
              return orderApproval;
            }
            throw new XMLDocumentException(XML_ORDERAPPROVAL + " element expected.");
          }

