  - record_key: XMLDOC-REQUIREMENT-0009
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL provide an exception wrapper class that supports exception chaining
      and root cause extraction for XML document processing errors.
    confidence: high
    confidence_basis: >
      XMLDocumentException is used consistently throughout the codebase. The exception
      handling pattern is verifiable from source.
    risk_class: operational
    basis: >
      XMLDocumentException.java extends Exception and maintains a wrapped exception field.
      Provides three constructors: (String message), (Exception exception),
      (String message, Exception exception). Methods: getException() returns wrapped exception,
      getRootCause() recursively extracts root cause if wrapped exception is XMLDocumentException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentException.java
        line_start: 45
        line_end: 105
        excerpt: |
          public class XMLDocumentException extends Exception {
            private Exception exception;
            public XMLDocumentException(String message, Exception exception) {
              super(message);
              this.exception = exception;
            }
            public XMLDocumentException(String message) {
              this(message, null);
            }
            public XMLDocumentException(Exception exception) {
              this(null, exception);
            }
            public Exception getException() {
              return exception;
            }
            public Exception getRootCause() {
              if (exception instanceof XMLDocumentException) {
                return ((XMLDocumentException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
          }

