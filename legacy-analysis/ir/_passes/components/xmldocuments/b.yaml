  - record_key: XMLDOC-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL support parsing and validating XML documents from multiple sources
      (Source, InputSource, String) using configurable DTD or XSD validation with optional
      entity catalog resolution.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.fromXML() methods are extensively used throughout the codebase.
      Both passes can verify the same method signatures and validation parameters.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java provides fromXML(Source, String, URL, boolean) and
      fromXML(InputSource, String, URL, boolean) methods where the boolean parameter
      controls validating. CustomEntityResolver handles entity catalog mapping for DTD/XSD
      resolution. The component supports both DTD validation (VALIDATING=true) and
      XSD validation (xsdSupport=true parameter).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 503
        line_end: 545
        excerpt: |
          public static Document fromXML(Source source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            return deserialize(createTransformer(), source, dtdPublicId, entityCatalogURL, validating, false);
          }
          public static Document fromXML(InputSource source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            Document document;
            try {
              if (source.getSystemId() == null) {
                source.setSystemId(SCHEMAS_DIRECTORY_PATH);
              }
              DocumentBuilderFactory builderFactory = DocumentBuilderFactory.newInstance();
              builderFactory.setValidating(validating);
              DocumentBuilder builder = builderFactory.newDocumentBuilder();
              builder.setErrorHandler(new ErrorHandler() { ... });
              builder.setEntityResolver(new CustomEntityResolver(entityCatalogURL));
              document = builder.parse(source);
            } catch (Exception exception) {
              throw new XMLDocumentException(exception);
            }
            if (!validating || XMLDocumentUtils.checkDocumentType(document, dtdPublicId)) {
              return document;
            }
            throw new XMLDocumentException("Document not of type: " + dtdPublicId);
          }

