      ChangedOrder is a simple value object with clear getter and factory methods.
      Both passes can verify the field names, types, and serialization contract from source.
    risk_class: operational
    basis: >
      ChangedOrder.java defines orderId and orderStatus fields with getOrderId()
      and getOrderStatus() accessors. Constructor takes both parameters. The toDOM()
      method appends both fields to an Order XML element with XML element names
      XML_ORDERID and XML_ORDERSTATUS.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 44
        line_end: 91
        excerpt: |
          public class ChangedOrder {
            public static final String XML_ORDER = "Order";
            public static final String XML_ORDERID = "OrderId";
            public static final String XML_ORDERSTATUS = "OrderStatus";
            private String orderId;
            private String orderStatus;
            public ChangedOrder(String id, String stat) {
              orderId = id;
              orderStatus = stat;
            }
            public String getOrderId() { return(orderId); }
            public String getOrderStatus() { return orderStatus; }
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ORDER);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERSTATUS, orderStatus);
              return root;
            }
          }

