records:
  - record_key: XMLDOC-ENTITY-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL support PurchaseOrder XML documents containing
      OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice,
      CreditCard, and one or more LineItem elements, with locale attribute defaulting to "en_US".
    confidence: high
    confidence_basis: >
      DTD schema explicitly defines the PurchaseOrder element structure with all child elements
      and attributes clearly specified. The element is used in XML serialization methods with
      exact element names. Two sources confirm: DTD declarations and serialization code paths.
    risk_class: operational
    basis: >
      PurchaseOrder.dtd lines 38-84 define the complete element structure including required
      and optional elements. OrderApproval.java references order placement workflows.
      XMLDocumentUtils.java provides the parsing infrastructure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 84
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
          <!ATTLIST PurchaseOrder
          	locale CDATA "en_US"
          >
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>

  - record_key: XMLDOC-ENTITY-0002
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support Invoice XML documents containing OrderId, UserId, OrderDate,
      ShippingDate, one or more LineItem elements, with locale attribute defaulting to "en_US".
    confidence: high
    confidence_basis: >
      Invoice.dtd explicitly defines the schema structure. The DTD is referenced in imports
      and the XMLDocumentUtils class is used for parsing. Invoice documents are distinct from
      purchase orders and are generated after order fulfillment.
    risk_class: financial
    basis: >
      Invoice.dtd lines 41-53 define the complete structure. The locale attribute requirement
      matches PurchaseOrder pattern, suggesting system-wide localization support.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 41
        line_end: 53
        excerpt: |
          <!ELEMENT Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItem+)>
          <!ATTLIST Invoice
          	locale CDATA "en_US"
          >

