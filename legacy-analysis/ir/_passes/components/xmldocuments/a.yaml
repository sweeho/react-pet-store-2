  - record_key: XMLDOC-INTEGRATION-0003
    kind: integration
    capability_key: supplier-management
    requirement: >
      The system SHALL support namespace-aware XML parsing and generation for TPA documents.
      All namespace-prefixed elements SHALL be created and parsed using the getChildNS, getAttributeNS,
      and createElementNS methods with explicit namespace URIs.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java provides namespace-aware methods (getChildNS, getAttributeNS, etc.)
      at lines 188-272. TPASupplierOrderXDE.java uses these methods extensively.
      The TPA schemas define target namespaces explicitly.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java lines 188-272 implement namespace-aware element and attribute access.
      TPASupplierOrderXDE.java line 60 defines XSD_PUBLIC_ID with namespace.
      The TPA schemas (TPASupplierOrder.xsd, TPALineItem.xsd) define targetNamespace.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 208
        line_end: 235
        excerpt: |
          public static Element getFirstChildNS(Element element, String nsURI, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getLocalName().equals(name) && ((Element) child).getNamespaceURI().equals(nsURI)) {
                  return (Element) child;
                }

  - record_key: XMLDOC-REQUIREMENT-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL serialize PurchaseOrder objects to XML format using UTF-8 encoding with
      DTD DOCTYPE declaration included in the output.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java defines DEFAULT_ENCODING as "UTF-8" (line 56) and uses it consistently
      in serialization methods. The serialize method (lines 364-386) includes DOCTYPE properties.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java lines 56 and 378 enforce UTF-8 encoding.
      Lines 371-373 set DOCTYPE_SYSTEM and DOCTYPE_PUBLIC properties.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 56
        line_end: 56
        excerpt: |
          public static final String DEFAULT_ENCODING = "UTF-8";
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 364
        line_end: 386
        excerpt: |
          public static void serialize(Transformer transformer, Document document, String dtdPublicId,
                                       String dtdSystemId, boolean xsdSupport, String encoding, Result result)
                throws XMLDocumentException {
            try {
              transformer.setOutputProperty(OutputKeys.METHOD, "xml");
              if (!xsdSupport) {
                if (dtdSystemId != null) {
                  transformer.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM, dtdSystemId);
                }
                transformer.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, dtdPublicId);

  - record_key: XMLDOC-REQUIREMENT-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL parse XML documents with optional DTD validation. When validating,
      the system SHALL enforce that the document's DOCTYPE matches the expected DTD public identifier.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java lines 503-545 implement fromXML methods with a validating parameter.
      Lines 541-544 enforce DOCTYPE validation through checkDocumentType method.
      OrderApproval.java line 69 defines VALIDATING = true as default.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java lines 626-634 implement checkDocumentType method.
      Lines 515-545 show parsing with validation enforcement.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 626
        line_end: 634
        excerpt: |
          public static boolean checkDocumentType(Document document, String dtdPublicId) {
            DocumentType documentType = document.getDoctype();
            if (documentType != null) {
              String publicId = documentType.getPublicId();
              return publicId != null && publicId.equals(dtdPublicId);
            }
            return true;
          }

  - record_key: XMLDOC-REQUIREMENT-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL support attribute access on XML elements, including optional attributes
      that may be absent. GIVEN an element with optional attributes, WHEN accessing the attribute,
      THEN the system SHALL return the attribute value or null without raising an error.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java lines 67-77 implement attribute access with an optional flag.
      Lines 67-73 show getAttributeAsString returning null for optional missing attributes.
      Lines 79-85 show getAttributeAsInt with similar behavior.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java lines 67-85 implement getAttributeAsString and getAttributeAsInt
      with optional parameter controlling null vs exception behavior.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 67
        line_end: 85
        excerpt: |
          public static String getAttribute(Element element, String name, boolean optional) throws XMLDocumentException {
            String value = element.getAttribute(name);
            if (value == null && !optional) {
              throw new XMLDocumentException("Attribute " + name + " of " + element.getTagName() + " expected.");
            }
            return value;
          }
          public static int getAttributeAsInt(Element element, String name, boolean optional) throws XMLDocumentException {
            try {
              return Integer.parseInt(getAttribute(element, name, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + "/@" + name + " attribute: value format error.", exception);
            }
          }

  - record_key: XMLDOC-REQUIREMENT-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support internationalization of XML documents through locale attributes.
      GIVEN a document with a locale attribute (e.g., "en_US"), WHEN retrieving the locale string,
      THEN the system SHALL parse it into a Locale object compatible with java.util.Locale.
    confidence: medium
    confidence_basis: >
      XMLDocumentUtils.java lines 644-678 implement getLocaleFromString method that parses
      locale strings in language_country_variant format. The PurchaseOrder and Invoice DTDs
      both define locale attributes. However, no direct integration with document parsing is visible.
    risk_class: presentational
    basis: >
      XMLDocumentUtils.java lines 644-678 implement locale parsing. PurchaseOrder.dtd line 40-42
      and Invoice.dtd lines 43-45 define locale attributes defaulting to "en_US".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 644
        line_end: 678
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
            if (localeString == null) {
              return null;
            }
            if (localeString.toLowerCase().equals("default")) {
              return Locale.getDefault();
            }

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      Line 44 contains a FIXME comment stating "should be attribute" for OrderStatus element.
      This indicates design debt — the element should be an attribute on Order instead of a child element.
      It is unclear whether this was ever implemented or remains as a design issue.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      Lines 632-633 show a DOCTYPE validation workaround comment: "return true; // false; Due to problem
      of IdentityTransformer not creating the DocType nodes". The system currently returns true for DOCTYPE
      validation even when the DOCTYPE is missing. This is a known defect in the validation logic that
