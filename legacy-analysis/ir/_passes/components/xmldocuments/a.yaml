      maps public identifiers to local resource paths.
    confidence: high
    confidence_basis: >
      CustomEntityResolver.java implements EntityResolver interface and loads entity mappings from
      a properties catalog (EntityCatalog.properties). The resolver attempts to map entity URIs
      through the catalog before falling back to direct URL resolution.
    risk_class: operational
    basis: >
      CustomEntityResolver.java lines 47-218 implement the entity resolution logic.
      Lines 159-173 implement URI mapping through the catalog.
      Lines 175-217 implement the main resolveEntity method with fallback logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 159
        line_end: 173
        excerpt: |
          public String mapEntityURI(String entityURI) {
            if (TRACE) {
              System.err.println("mapEntityURI: " + entityURI);
            }
            if (entityCatalog != null) {
              if (entityURI != null) {
                String entityURL = entityCatalog.getProperty(entityURI);
                if (TRACE) {
                  System.err.println("mapEntityURI: " + entityURI + " mapped to: " + entityURL);
