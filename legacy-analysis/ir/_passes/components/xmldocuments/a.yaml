  - record_key: XMLDOC-ENTITY-0006
    kind: entity
    capability_key: supplier-management
    requirement: >
      The system SHALL support TPA (Third-Party Application) SupplierOrder XML documents
      with namespace "http://blueprints.j2ee.sun.com/TPASupplierOrder" containing OrderId (string),
      OrderDate (date), ShippingAddress (address type), and LineItems with unique itemId constraint.
    confidence: high
    confidence_basis: >
      TPASupplierOrder.xsd explicitly defines XSD schema with namespace and type constraints.
      TPASupplierOrderXDE.java implements the document editor for this variant.
      XSD schema provides stronger typing than DTD.
    risk_class: operational
    basis: >
      TPASupplierOrder.xsd lines 1-46 define the complete XSD schema with namespace,
      element types, and uniqueness constraints. TPASupplierOrderXDE.java lines 57-108
      implement processing with namespace support.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd
        line_start: 1
        line_end: 46
        excerpt: |
          <xsd:element name="SupplierOrder">
            <xsd:complexType>
              <xsd:sequence>
                <xsd:element name="OrderId" type="xsd:string" />
                <xsd:element name="OrderDate" type="xsd:date" />
                <xsd:element name="ShippingAddress" type="address" />
              </xsd:sequence>
            </xsd:complexType>
          </xsd:element>

