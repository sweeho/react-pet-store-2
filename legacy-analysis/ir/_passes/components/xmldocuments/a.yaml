  - record_key: XMLDOC-INTEGRATION-0001
    kind: integration
    capability_key: order-placement
    requirement: >
      The system SHALL support a factory pattern for instantiating XML Document Editor implementations
      loaded from a properties catalog, allowing different document types to have custom processors.
    confidence: high
    confidence_basis: >
      XMLDocumentEditorFactory.java implements the factory pattern. A properties file (EntityCatalog.properties)
      maps schema URIs to XMLDocumentEditor implementation class names. The factory loads implementations
      dynamically using reflection (Class.forName).
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory.java lines 45-75 implement the factory with properties-based loading.
      The factory loads a catalog URL and instantiates editors by class name string.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 75
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();
            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
            }
            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }

  - record_key: XMLDOC-INTEGRATION-0002
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support custom entity resolution for XML parsing. When parsing XML documents,
