    confidence: high
    confidence_basis: >
      SupplierOrder.dtd explicitly defines the schema. The element names are lowercase,
      indicating a different convention from internal documents. Used in TPA (third-party
      application) supplier coordination workflows.
    risk_class: operational
    basis: >
