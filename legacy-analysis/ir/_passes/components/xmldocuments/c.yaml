  - record_key: SUPP-MGT-XML-0003
    kind: entity
    capability_key: supplier-management
    requirement: >
      LineItem entity SHALL contain attributes: categoryId (string), productId (string), itemId (string),
      lineNo (non-negative integer), quantity (positive integer), unitPrice (decimal >= 0.0).
      ItemId values SHALL be unique within a single LineItems container.
    confidence: high
    confidence_basis: >
      TPALineItem.xsd defines lineItem complex type with attribute definitions and positiveDecimal
      restriction. UniqueConstraint in TPASupplierOrder.xsd enforces itemId uniqueness. Both
      declarative schema constraints and implementation in TPALineItemUtils confirm this structure.
    risk_class: operational
    basis: >
      TPALineItem.xsd lines 10-17 define lineItem complex type with all required attributes.
      positiveDecimal restriction (lines 19-23) constrains unitPrice to decimal with minInclusive
      0.0. TPASupplierOrder.xsd unique constraint (lines 23-26) enforces itemId uniqueness via
      XSD selector/field. TPALineItemUtils.addLineItem() confirms attribute structure in code.
    traces:
