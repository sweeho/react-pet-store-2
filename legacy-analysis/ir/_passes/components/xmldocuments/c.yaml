  - record_key: SUPP-MGT-XML-0001
    kind: requirement
    capability_key: supplier-management
    requirement: >
      The system SHALL support creation, serialization, and deserialization of Supplier Order
      XML documents containing OrderId (string), OrderDate (date), ShippingAddress (with first/last
      name, street, city, state, country, zipcode, email, phone), and LineItems (with multiple
      product line items).
    confidence: high
    confidence_basis: >
      Schema definition in TPASupplierOrder.xsd is authoritative; confirmed by dedicated
      TPASupplierOrderXDE class with complete implementation of serialization/deserialization,
      and entity catalog mapping binding schema URIs to implementations.
    risk_class: operational
    basis: >
      TPASupplierOrder.xsd defines the complete element structure for supplier orders. The schema
      enforces OrderId (xsd:string), OrderDate (xsd:date), ShippingAddress (address complex type),
      and LineItems container. TPASupplierOrderXDE implements builder pattern to construct and
      serialize these documents with methods setOrderId(), setOrderDate(), setShippingAddress(),
      addLineItem(). Entity catalog maps namespace "http://blueprints.j2ee.sun.com/TPASupplierOrder"
      to both DTD and XSD resources.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd
