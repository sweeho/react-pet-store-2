  - record_key: XML-UTIL-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide XML document deserialization with optional DTD/XSD validation
      and entity resolution via catalog. Documents SHALL be parsed into DOM objects and validated
      against declared document types.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.fromXML() and related methods provide complete deserialization with
      validation support. CustomEntityResolver is integrated into parser configuration. Both
      TPA XDE classes instantiate parsers with validation support. Multiple fromXML() overloads
      confirm this is primary deserialization path.
    risk_class: operational
    basis: >
      XMLDocumentUtils provides fromXML() (lines 503-545) which deserializes XML via
      DocumentBuilder or SAXParser depending on source type. Parser configuration (lines 559-610)
      sets up custom entity resolver for DTD/XSD resolution. Validation flag controls
      setValidating() and schema property setup. CustomEntityResolver.mapEntityURI() resolves
      public identifiers through entity catalog before falling back to direct URL.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 503
        line_end: 545
        excerpt: |
          public static Document fromXML(InputSource source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            Document document;
            try {
              if (source.getSystemId() == null) { // Set the base URI to resolve relative URI
                source.setSystemId(SCHEMAS_DIRECTORY_PATH);
              }
              DocumentBuilderFactory builderFactory = DocumentBuilderFactory.newInstance();
              builderFactory.setValidating(validating);
              DocumentBuilder builder = builderFactory.newDocumentBuilder();
              builder.setErrorHandler(new ErrorHandler() {
                public void warning(SAXParseException exception) {
                  System.err.println("[Warning]: " + exception.getMessage());
                  return;
                }
                public void error(SAXParseException exception) {
                  System.err.println("[Error]: " + exception.getMessage());
                  return;
                }
                public void fatalError(SAXParseException exception) throws SAXException {
                  System.err.println("[Fatal Error]: " + exception.getMessage());
                  throw exception;
                }
              });
              builder.setEntityResolver(new CustomEntityResolver(entityCatalogURL));
              document = builder.parse(source);
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
