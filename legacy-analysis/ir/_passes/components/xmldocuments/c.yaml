      XMLDocumentUtils methods: getAttribute() (line 67), getAttributeAsInt() (line 79), getChild()
      (line 102), getSibling() (line 120), getContent() (line 153), getContentAsInt() (line 172),
      all take optional parameter. When false, XMLDocumentException is thrown at line 70, 111, 163,
