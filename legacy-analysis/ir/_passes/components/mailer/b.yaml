  - record_key: NOTIF-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      When a TextMessage arrives on the mailer queue, the system SHALL extract
      the message text as XML, deserialize it into a Mail object containing
      address, subject, and content, and send an email using those fields.
    confidence: high
    confidence_basis: >
      The requirement is explicit in the onMessage() method implementation and
      validated against schema. The flow follows a single, consistent path:
      TextMessage.getText() -> Mail.fromXML() -> sendMail(). The Mail class
      enforces structure via DTD validation, and both code and schema converge
      on the same three fields (address, subject, content).
    risk_class: operational
    basis: >
      MailerMDB.onMessage() casts the incoming Message to TextMessage, extracts
      text via getText(), and passes it to Mail.fromXML(). The Mail class
      deserializes the XML and provides getAddress(), getSubject(), getContent()
      accessors. These values are then passed to sendMail() which constructs the
      email message.
