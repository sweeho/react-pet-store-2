          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 59
        line_end: 71
