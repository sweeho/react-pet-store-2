  - record_key: NOTIF-ENTITY-0001
    kind: entity
    capability_key: notifications
    requirement: >
      A Mail entity SHALL contain exactly three required fields: address (email
      recipient address), subject (email subject line), and content (email body text),
      in that order.
    confidence: high
    confidence_basis: >
      The structure is enforced by two independent layers that converge on the same
      schema: the Mail.dtd declares the structure via DTD element declarations, and the
      Mail.java class enforces it via constructor parameters and instance fields. Both
      the serialization (toXML/toDOM) and deserialization (fromXML/fromDOM) methods
      validate this three-field structure.
    risk_class: operational
    basis: >
      The Mail.dtd declares Mail as an ELEMENT containing an ordered tuple of
      (Address, Subject, Content) child elements, each of type #PCDATA. The Mail.java
      class defines three private fields (address, subject, content), a constructor
      accepting all three, and accessor methods for each. The fromDOM method extracts
      these three fields in order and throws XMLDocumentException if the structure
      does not match.
    traces:
