    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL receive email notifications asynchronously via a
      message-driven bean that listens to a JMS Queue for incoming mail messages.
    confidence: high
    confidence_basis: >
      The requirement is enforced in two independent declarative places: the
      ejb-jar.xml declares the message-driven-bean and message-driven-destination
      as a Queue, and the MailerMDB class explicitly implements both MessageDrivenBean
      and MessageListener interfaces with an onMessage() callback. This dual
      enforcement at both configuration and code level ensures consistency.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares MailerMDB as a message-driven bean with
      destination-type javax.jms.Queue. The MailerMDB class implements
      MessageDrivenBean and MessageListener, defining the onMessage(Message)
      method to receive and process queue messages.
