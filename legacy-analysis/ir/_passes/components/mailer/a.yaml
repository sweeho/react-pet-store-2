  - record_key: NOTIF-ENTITY-0001
    kind: entity
    capability_key: notifications
    requirement: >
      A Mail entity contains three required fields: address (email recipient),
      subject (email subject line), and content (email body text).
    confidence: high
    confidence_basis: >
      The structure is enforced by the Mail.dtd schema and the Mail.java class
      constructor. Both validation layers are independent and converge on the
      same three fields.
    risk_class: operational
    basis: >
      The Mail.dtd declares Mail as a required ordered triple of
      (Address, Subject, Content) elements. The Mail.java class constructor
      accepts and stores these three fields, and the fromXML/toXML serialization
      enforces this structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 59
        line_end: 71
        excerpt: |
          private String address = null;
          private String subject  = null;
          private String content = null;

          private Mail() {}

          public Mail(String address, String subject, String content) {
            this.address = address;
            this.subject = subject;
            this.content = content;
            return;
