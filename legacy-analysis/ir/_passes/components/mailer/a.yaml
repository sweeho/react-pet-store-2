  - record_key: NOTIF-WORKFLOW-0001
    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL receive email notifications asynchronously via a
      message-driven bean that listens to a JMS Queue for incoming mail messages.
    confidence: high
    confidence_basis: >
      Both passes will find this requirement enforced in two independent places:
      the ejb-jar.xml declares the message-driven-destination, and MailerMDB
      implements MessageListener with onMessage callback. The architecture is
      explicit and declared.
    risk_class: operational
    basis: >
      The MailerMDB class implements MessageDrivenBean and MessageListener,
      with an onMessage() method that processes javax.jms.Message objects.
      The ejb-jar.xml declares it as a message-driven bean listening to a
      javax.jms.Queue.
