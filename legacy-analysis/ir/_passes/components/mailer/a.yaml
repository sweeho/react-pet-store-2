  - record_key: NOTIF-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      When a TextMessage arrives on the mailer queue, the system SHALL parse
      the message text as XML, deserialize it into a Mail object containing
      address, subject, and content, and send an email to the specified address.
    confidence: high
    confidence_basis: >
      Both passes will find this flow explicit in the onMessage() method.
      The data structure is validated against a DTD, and the parsing logic
      is declarative (XML deserialization).
    risk_class: operational
    basis: >
      The onMessage() method extracts text from the TextMessage, calls
      Mail.fromXML() to deserialize it, extracts the address/subject/content,
      and passes them to sendMail(). The Mail class enforces the structure
      (Address, Subject, Content) via DTD validation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 91
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage textMessage = null;
            String xmlMailMessage = null;
            Mail recMail = null;
            try {
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
            } catch (MailerAppException me) {
              //throw new EJBException("MailerMDB.onMessage" + me);
              //ignore since user probably forgot to set up mail server
            } catch (XMLDocumentException xde) {
              throw new EJBException("MailerMDB.onMessage" + xde);
            } catch(JMSException je) {
              throw new EJBException("MailerMDB.onMessage" + je);
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
    stack_metadata:
