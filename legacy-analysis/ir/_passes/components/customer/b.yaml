findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
    description: >
      The customer component does not appear to declare a findAllCustomers() method in the
      CustomerEJB class itself, but ejb-jar.xml defines an EJBQL query for it (line 87).
      The query logic is inferred from the EJBQL "Select OBJECT(a) From Customer a" but
      no explicit implementation is visible. This is normal for CMP 2.x (container generates
      finders), but the semantics of "all customers" (does it return active only? deleted?)
      are not declared.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      CreditCard.getExpiryMonth() and getExpiryYear() methods are declared in the
      assembly-descriptor (lines 913-926) but no corresponding CMP fields exist in the
      schema. The expiryDate CMP field is a String. The parsing logic (MM/YY? MM/DD/YYYY?)
      is not visible and must be inferred from method names.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
    description: >
      AccountEJB.ejbPostCreate() has two overloads (lines 80 and 96), and the no-args
      overload (line 96) also calls setStatus(status), but the status parameter is not
      available in that method signature. This appears to be dead code or a leftover
      that does not match the constructor signature at line 70. The reachability and
      semantics of this method are unclear.
