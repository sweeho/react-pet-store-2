  - record_key: CUSTMGT-WRKFLOW-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      When a Customer is created with a userId, the system SHALL automatically create
      and associate a new Account with status "active" and a new Profile with default
      preferences.
    confidence: high
    confidence_basis: >
      The CustomerEJB.ejbPostCreate() method explicitly looks up and creates Account and
      Profile beans using their LocalHome interfaces, setting Account to AccountLocalHome.Active
      and Profile to the declared defaults. This is a container-managed relationship with
      cascade delete, ensuring the association is enforced.
    risk_class: operational
    basis: >
      ejbPostCreate method at lines 74-89 of CustomerEJB.java shows explicit creation of
      Account and Profile, and ejb-jar.xml relationships (lines 264-327) define 1:1 OneToMany
      with cascade-delete.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
            try {
            InitialContext ic = new InitialContext();
            AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
            AccountLocal account = alh.create(AccountLocalHome.Active);
            setAccount(account);

            ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
            ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
            ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
            ProfileLocalHome.DefaultBannerPreference);
            setProfile(profile);
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 264
        line_end: 285
        excerpt: |
          <ejb-relation>
            <ejb-relation-name></ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>CustomerEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>CustomerEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>account</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />

  - record_key: CUSTMGT-WRKFLOW-0002
    kind: workflow
    capability_key: customer-management
    requirement: >
      When an Account is created, the system SHALL automatically create and associate a
      new ContactInfo and a new CreditCard.
    confidence: high
    confidence_basis: >
      AccountEJB.ejbPostCreate() method explicitly creates ContactInfo and CreditCard
      beans using their LocalHome interfaces. The ejb-jar.xml defines cascade-delete
      relationships for both.
    risk_class: operational
    basis: >
      ejbPostCreate method at lines 80-94 of AccountEJB.java shows explicit creation.
      ejb-jar.xml relationships (lines 328-369) define 1:1 associations with cascade-delete.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 94
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);

