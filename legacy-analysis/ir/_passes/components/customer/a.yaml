records:
  - record_key: CUSTOMERMANAGEMENT-ENTITY-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a Customer entity with a primary identifier userId
      (String). Each customer record SHALL have exactly one associated Account and
      one associated Profile.
    confidence: high
    confidence_basis: >
      The Customer entity is declared in CMP field definitions and relationships in
      ejb-jar.xml. The CustomerEJB implements abstract getter/setter methods for userId.
      The relationship declarations explicitly define one-to-one cardinality for both
      Account and Profile relationships with cascade-delete semantics on the related entities.
    risk_class: operational
    basis: >
      CMP field userId declared in ejb-jar.xml lines 57-61 with prim-key-class java.lang.String.
      CMR relationships defined in lines 62-75, with ejb-local-ref entries for both ejb/Profile
      and ejb/Account. Relationship declarations in lines 265-327 define CustomerEJB to AccountEJB
      (One to One, cascade-delete) and CustomerEJB to ProfileEJB (One to One, cascade-delete).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 46
        line_end: 89
        excerpt: |
          <entity>
            <display-name>CustomerEB</display-name>
            <ejb-name>CustomerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.customer.ejb.CustomerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.customer.ejb.CustomerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.customer.ejb.CustomerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Customer</abstract-schema-name>
            <cmp-field>
              <description>no description</description>
              <field-name>userId</field-name>
            </cmp-field>
            <primkey-field>userId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 51
        line_end: 65
        excerpt: |
          public abstract class CustomerEJB implements javax.ejb.EntityBean {
            private EntityContext context = null;
            public abstract String getUserId();
            public abstract void setUserId(String userId);
            public abstract AccountLocal getAccount();
            public abstract void setAccount(AccountLocal account);
            public abstract ProfileLocal getProfile();
            public abstract void setProfile(ProfileLocal profile);
    stack_metadata:
      ejb.entity.type: Container-Managed Persistence (CMP 2.x)
      ejb.persistence.type: Container
      ejb.pk.type: java.lang.String

  - record_key: CUSTOMERMANAGEMENT-BUSINESSRULE-0002
    kind: business-rule
    capability_key: customer-management
    requirement: >
      When a new Customer is created, the system SHALL automatically create and
      associate one Account entity with status "active" and one Profile entity with
      default preferences (preferredLanguage="en_US", favoriteCategory=null,
      myListPreference=true, bannerPreference=true).
    confidence: high
    confidence_basis: >
      The ejbPostCreate method in CustomerEJB explicitly creates both Account and Profile
      entities using hardcoded default values. The default values are declared as constants
      in ProfileLocalHome (DefaultPreferredLanguage, DefaultFavoriteCategory, etc.) and
      AccountLocalHome (Active constant = "active"). The code uses JNDI lookup and create
      methods to instantiate these entities immediately upon customer creation.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate method (lines 74-89) performs JNDI lookups for both
      AccountLocalHome and ProfileLocalHome, then calls create with hardcoded default values.
      ProfileLocalHome constants defined in lines 44-47 specify the defaults.
      AccountLocalHome.Active constant defined in line 48 of AccountLocalHome.java.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
            try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
            } catch (NamingException ne) {
              throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/profile/ejb/ProfileLocalHome.java
        line_start: 43
        line_end: 50
        excerpt: |
          public interface ProfileLocalHome extends javax.ejb.EJBLocalHome {
            public static final String DefaultPreferredLanguage = "en_US";
            public static final String DefaultFavoriteCategory = null;
            public static final boolean DefaultMyListPreference = true;
            public static final boolean DefaultBannerPreference = true;

