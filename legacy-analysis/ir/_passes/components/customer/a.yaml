      ContactInfo, Address). This is declarative configuration that the EJB container enforces.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor defines container-transaction elements for all
      methods on each entity bean, with trans-attribute="Required" consistently applied
      throughout lines 675-1375.
    traces:
