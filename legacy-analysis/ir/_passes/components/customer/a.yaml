  - record_key: CUSTOMERMANAGEMENT-REQUIREMENT-0008
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL support two variants of Account creation: (1) creation with only
      a status parameter, in which case ContactInfo and CreditCard are automatically
      created as empty entities, and (2) creation with status, ContactInfo, and CreditCard
      parameters supplied as EJB references.
    confidence: high
    confidence_basis: >
      AccountEJB declares two overloaded ejbCreate methods (lines 70-78) matching the
      two create method signatures in AccountLocalHome. The first variant (single status
      parameter) automatically creates empty ContactInfo and CreditCard in ejbPostCreate.
      The second variant (with entity references) uses the provided entities.
    risk_class: operational
    basis: >
      AccountEJB lines 70-99 define two ejbCreate and two ejbPostCreate method pairs
      implementing the two creation patterns. AccountLocalHome lines 51-54 declare the
      matching create method signatures.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 70
        line_end: 99
        excerpt: |
          public Object ejbCreate(String status, ContactInfoLocal contactInfo, CreditCardLocal creditCard) throws CreateException {
            setStatus(status);
            return null;
          }

          public Object ejbCreate(String status) throws CreateException {
            setStatus(status);
            return null;
          }

          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);
            } catch (javax.naming.NamingException ne) {
              throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
            }
          }

  - record_key: CUSTOMERMANAGEMENT-REQUIREMENT-0009
