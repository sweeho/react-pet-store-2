  - record_key: UIDGEN-BR-0008
    kind: business-rule
    capability_key: order-placement
    requirement: >
      GIVEN a Counter with primary key not found, WHEN UniqueIdGeneratorEJB invokes
      CounterLocalHome.findByPrimaryKey(), and a FinderException is caught, THEN
      CounterLocalHome.create(name) SHALL be invoked to create a new Counter.
    confidence: high
    confidence_basis: >
      The getCounter() method (lines 74-86) implements an explicit try-catch pattern
      for FinderException. This is the single implementation but the logic is clear
      and deterministic.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter() (lines 74-86) attempts findByPrimaryKey(name);
      if FinderException is caught, it invokes create(name). The counter is returned
      in either case.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB

