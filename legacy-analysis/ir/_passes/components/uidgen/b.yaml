records:
  - record_key: UIDGEN-ENTITY-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      A Counter entity SHALL consist of two persistent fields: name (String, primary key)
      and counter (int), managed via CMP 2.x container-managed persistence.
    confidence: high
    confidence_basis: >
      Both the CounterEJB abstract class (lines 50-54) and the ejb-jar.xml deployment
      descriptor (lines 57-65) independently declare the same two CMP fields. The dual
      declaration across code and configuration provides high confidence.
    risk_class: operational
    basis: >
      CounterEJB declares abstract getCounter/setCounter and getName/setName pairs
      (lines 50-54). The ejb-jar.xml <entity> section lists both as <cmp-field>
      declarations (lines 57-64) with name as the <primkey-field> (line 65).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 50
        line_end: 54
        excerpt: |
          public abstract int getCounter();
          public abstract void setCounter(int counter);
          public abstract String getName();
          public abstract void setName(String name);
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 57
        line_end: 65
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>counter</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>name</field-name>
          </cmp-field>
          <primkey-field>name</primkey-field>
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.persistence: CMP 2.x

  - record_key: UIDGEN-BR-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      When getNextValue() is invoked on a Counter, the system SHALL increment the
      counter field by one, persist the new value, and return a string concatenation
      of the counter's name field with the incremented counter value.
    confidence: high
    confidence_basis: >
      The implementation is declared in the CounterEJB.getNextValue() method (lines
      67-71), and the counter is persisted through CMP container management. This is
      the single source of the logic, but the requirement is enforced in code and
      database transactions are managed declaratively, providing confidence.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() (lines 67-71) fetches the current counter value,
      increments it, calls setCounter() to persist the new value, and returns
      getName() concatenated with String.valueOf(count).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.transaction: Required

  - record_key: UIDGEN-BR-0002
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL initialize a new Counter with counter value 0 when created
      via CounterLocalHome.create(String name).
    confidence: high
    confidence_basis: >
      The ejbCreate method in CounterEJB (lines 58-62) explicitly sets counter to 0.
      This is the sole implementation of Counter creation and is consistent with
      initialization semantics.
    risk_class: operational
    basis: >
      CounterEJB.ejbCreate(String name) (lines 58-62) calls setName(name) and
      setCounter(0) to initialize the entity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.transaction: Required

  - record_key: UIDGEN-WORKFLOW-0001
    kind: workflow
    capability_key: order-placement
    requirement: >
      GIVEN a UniqueIdGeneratorEJB session, WHEN getUniqueId(String idPrefix) is
      invoked, THEN the system SHALL attempt to retrieve or create a Counter with
      the given prefix as its name, obtain the next value from that Counter, and
      return it.
    confidence: high
    confidence_basis: >
      The UniqueIdGeneratorEJB.getUniqueId() method (line 68) delegates to
      getCounter() (lines 74-86), which encapsulates the lookup-or-create logic.
      Both methods are straightforward implementations with no ambiguity.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getUniqueId(String idPrefix) calls getCounter(idPrefix).getNextValue().
      The getCounter() helper (lines 74-86) attempts CounterLocalHome.findByPrimaryKey(name);
      if a FinderException is thrown, it calls create(name) to instantiate a new Counter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      ejb.transaction: Required

  - record_key: UIDGEN-BR-0003
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The UniqueIdGeneratorEJB SHALL be a stateless session bean with
      container-managed transactions.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor (lines 77-78) explicitly declares
      <session-type>Stateless</session-type> and <transaction-type>Container</transaction-type>.
      This is declarative configuration that is definitive.
    risk_class: operational
    basis: >
      The ejb-jar.xml <session> descriptor for UniqueIdGeneratorEJB (lines 71-90)
      declares session-type as Stateless and transaction-type as Container.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 90
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
    stack_metadata:
