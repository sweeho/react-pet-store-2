  - record_key: UIDGEN-BR-0010
    kind: business-rule
    capability_key: order-placement
    requirement: >
      GIVEN a NamingException during UniqueIdGeneratorEJB.ejbCreate(), WHEN the
      Counter EJB home lookup fails, THEN an EJBException SHALL be thrown with message
      "UniqueIdGeneratorEJB Got naming exception! " + exception message.
    confidence: medium
    confidence_basis: >
      The ejbCreate() method (lines 56-63) explicitly catches NamingException, but this
      is an initialization error path. The logic is deterministic but not commonly
      exercised.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.ejbCreate() (lines 60-62) attempts InitialContext.lookup()
      of "java:comp/env/ejb/Counter". If NamingException is thrown, it is caught and
      re-thrown as EJBException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 56
        line_end: 63
        excerpt: |
          public void ejbCreate() {
            try {
              ic = new InitialContext();
              clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
            } catch (NamingException ne) {
               throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
            }
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorLocal.java
    description: >
      Line 43 declares parameter idPrfix with apparent typo (missing 'e'), while the
      interface documentation (line 42) and implementation use idPrefix. This is either
      a typo in the interface signature or the implementation does not match the
      interface contract. Verify whether both methods have the same parameter name or
      if one is a documentation error.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
    description: >
      The ejbCreate() method initializes CounterLocalHome via JNDI lookup at bean
      creation time, storing it in instance field clh. This pattern is valid for a
      stateless session bean if the container manages instance pooling, but the
      initialization order and re-initialization behavior across the pool is not
      explicitly documented in the code. Whether clh is safely shared across instances
      or if ejbCreate is called for each instance cannot be determined from the source
      alone.
