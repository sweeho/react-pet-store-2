      ejb.transaction: Container

  - record_key: UIDGEN-BR-0004
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The CounterEJB SHALL be a non-reentrant entity bean with container-managed
      persistence and Container-managed transactions.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor (lines 46-70) explicitly declares
      <reentrant>False</reentrant>, <persistence-type>Container</persistence-type>,
      and <cmp-version>2.x</cmp-version>. Transaction type is Container (inherited
      from EJB 2.0 defaults for entity beans).
    risk_class: operational
    basis: >
      The ejb-jar.xml <entity> descriptor for CounterEJB (lines 46-70) declares these
      deployment attributes. The counter transactions are managed through
      <container-transaction> declarations (lines 203-231).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 46
        line_end: 70
        excerpt: |
          <entity>
            <display-name>CounterEB</display-name>
            <ejb-name>CounterEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.persistence: CMP 2.x
      ejb.reentrant: false

