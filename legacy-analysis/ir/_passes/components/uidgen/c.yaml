records:
  - record_key: authentication-requirement-0001
    kind: requirement
    capability_key: authentication
    requirement: >
      The system SHALL provide a unique identifier generation service accessible as a
      local EJB component. The service accepts a string prefix parameter and returns a
      unique identifier composed of the prefix concatenated with a numeric counter value.
    confidence: high
    confidence_basis: >
      The UniqueIdGeneratorLocal interface explicitly declares the getUniqueId(String)
      business method, and this interface is deployed in ejb-jar.xml as a stateless
      session bean. The implementation in UniqueIdGeneratorEJB directly implements this
      contract. This requirement is both declaratively configured and implemented in code.
    risk_class: operational
    basis: >
      UniqueIdGeneratorLocal.java declares the public interface getUniqueId(String idPrfix)
      which returns String. UniqueIdGeneratorEJB.java implements this method by delegating
      to a Counter entity bean's getNextValue() method. The ejb-jar.xml deployment descriptor
      defines UniqueIdGeneratorEJB as a Stateless session bean with local interfaces.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorLocal.java
        line_start: 42
        line_end: 43
        excerpt: |
          /** param idPrefix is the prefix needed for each of the counter values. It must not be null. */
          public String getUniqueId(String idPrfix);
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 90
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      ejb.session_type: Stateless
      ejb.transaction_type: Container

  - record_key: authentication-entity-0001
    kind: entity
    capability_key: authentication
    requirement: >
      The system SHALL maintain a Counter persistent entity with two fields: a string
      name field (serving as the primary key) and an integer counter field (initialized
      to 0). Counter entities are managed via container-managed persistence (CMP 2.x).
    confidence: high
    confidence_basis: >
      The Counter entity is declared in three places in complete agreement: (1) the
      ejb-jar.xml deployment descriptor specifies CMP 2.x with name as primary key,
      (2) CounterEJB.java provides abstract accessor methods for both fields, and
      (3) the abstract class structure indicates container-managed persistence. No
      contradictions exist between any source.
    risk_class: operational
    basis: >
      The ejb-jar.xml defines Counter as a <entity> bean with <persistence-type>Container</persistence-type>,
      <cmp-version>2.x</cmp-version>, and two <cmp-field> declarations: counter (int)
      and name (String). The <primkey-field> is set to name. CounterEJB.java (lines 50-54)
      provides abstract getter/setter methods for both fields, confirming the CMP field
      structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 46
        line_end: 65
        excerpt: |
          <entity>
            <display-name>CounterEB</display-name>
            <ejb-name>CounterEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Counter</abstract-schema-name>
            <cmp-field>
              <description>no description</description>
              <field-name>counter</field-name>
            </cmp-field>
            <cmp-field>
              <description>no description</description>
              <field-name>name</field-name>
            </cmp-field>
            <primkey-field>name</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 50
        line_end: 54
        excerpt: |
          public abstract int getCounter();
          public abstract void setCounter(int counter);
          public abstract String getName();
          public abstract void setName(String name);
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.persistence_type: Container
      cmp_version: 2.x
      primary_key_class: java.lang.String
      reentrant: false

  - record_key: authentication-business-rule-0001
    kind: business-rule
    capability_key: authentication
    requirement: >
      GIVEN a request to create a new Counter entity with a string name parameter,
      WHEN the CounterLocalHome.create(String name) method is invoked, THEN the Counter
      entity SHALL initialize with the provided name as its primary key and the counter
      field SHALL be set to 0.
    confidence: high
    confidence_basis: >
      The CounterEJB.ejbCreate(String name) method is the sole implementation of the
      create lifecycle callback. It explicitly calls setName(name) and setCounter(0).
      This is enforced at the container level via the deployment descriptor declaring
      this as a Container-managed entity, making the initialization behavior deterministic.
    risk_class: operational
    basis: >
      CounterEJB.ejbCreate(String name) (lines 58-62) receives the name parameter,
      calls setName(name) to assign the primary key, and calls setCounter(0) to
      initialize the counter field to zero. This is the only code path for Counter creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.transaction: Required

  - record_key: authentication-business-rule-0002
    kind: business-rule
    capability_key: authentication
    requirement: >
      GIVEN an invocation of CounterLocal.getNextValue(), WHEN the method executes,
      THEN the counter field SHALL be incremented by exactly 1, the new counter value
      SHALL be persisted to the container-managed database, and the method SHALL return
      a string concatenation of the Counter's name field with the incremented counter value
      (as a string).
    confidence: high
    confidence_basis: >
      The CounterEJB.getNextValue() method (lines 67-71) contains the sole implementation
      of this logic. The sequence is: fetch current counter, increment by 1, persist via
      setCounter(), concatenate and return. Container-managed persistence ensures the
      setCounter() call is persisted to the database. The transaction attribute is Required,
      ensuring atomicity.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() (lines 67-71) fetches the current counter with getCounter(),
      increments it by 1, calls setCounter(count) to persist the new value, and returns
      the concatenation of getName() (the counter's name/prefix) with String.valueOf(count).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }
    stack_metadata:
      ejb.bean: CounterEJB
      ejb.transaction: Required

  - record_key: authentication-workflow-0001
    kind: workflow
    capability_key: authentication
    requirement: >
      GIVEN a call to UniqueIdGeneratorEJB.getUniqueId(String idPrefix), WHEN the method
      executes, THEN the system SHALL (1) invoke UniqueIdGeneratorEJB.getCounter(idPrefix),
      which attempts to find an existing Counter entity by primary key; (2) if no Counter
      exists (FinderException is caught), create a new Counter with that name via
      CounterLocalHome.create(idPrefix); and (3) invoke getNextValue() on the Counter
      (whether newly created or existing) and return the result.
    confidence: high
    confidence_basis: >
      The UniqueIdGeneratorEJB.getUniqueId() method (line 68) delegates directly to
      getCounter(idPrefix).getNextValue(). The getCounter() helper method (lines 74-86)
      implements the lookup-or-create pattern with an explicit try-catch for FinderException.
      This is the only code path for unique ID generation, and the logic is transparent.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getUniqueId(String idPrefix) (line 68) calls getCounter(idPrefix).getNextValue().
      The getCounter(String name) helper (lines 74-86) attempts CounterLocalHome.findByPrimaryKey(name);
      if a FinderException is caught, it calls CounterLocalHome.create(name) to instantiate
      a new Counter. The counter is then returned and its getNextValue() is invoked.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      ejb.transaction: Required

  - record_key: authentication-business-rule-0003
    kind: business-rule
    capability_key: authentication
    requirement: >
