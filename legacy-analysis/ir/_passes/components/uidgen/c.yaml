  - record_key: authentication-business-rule-0005
    kind: business-rule
    capability_key: authentication
    requirement: >
      GIVEN that a CreateException is thrown during CounterLocalHome.create(String name),
      WHEN UniqueIdGeneratorEJB.getCounter() catches this exception, THEN an EJBException
