  - record_key: authentication-business-rule-0006
    kind: business-rule
    capability_key: authentication
    requirement: >
      GIVEN that a NamingException is thrown during UniqueIdGeneratorEJB.ejbCreate(),
      WHEN the JNDI lookup of "java:comp/env/ejb/Counter" fails, THEN an EJBException
      SHALL be thrown with a message in the format "UniqueIdGeneratorEJB Got naming exception! <original exception message>".
    confidence: medium
    confidence_basis: >
      The ejbCreate() method (lines 56-63) explicitly catches NamingException and
      re-throws as EJBException. This is a bean initialization error path. The logic is
      deterministic and visible, but this is an exceptional initialization-time condition.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.ejbCreate() (lines 56-63) attempts InitialContext.lookup()
      of "java:comp/env/ejb/Counter". If NamingException is thrown, it is caught and
      re-thrown as EJBException with a descriptive message.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 56
        line_end: 63
        excerpt: |
          public void ejbCreate() {
            try {
              ic = new InitialContext();
              clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
            } catch (NamingException ne) {
               throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
            }
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB

