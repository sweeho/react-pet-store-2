  - record_key: CART-WORKFLOW-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The shopping cart workflow SHALL support the following actions: ADD_ITEM, DELETE_ITEM,
      UPDATE_ITEMS (multiple), and EMPTY. The UPDATE_ITEMS action SHALL accept a map of
      itemId to quantity pairs, where quantity of zero or negative removes the item.
    confidence: high
    confidence_basis: >
      CartEvent class defines these action types as constants and has constructors
      for each pattern. Both passes can verify the event class independently.
    risk_class: operational
    basis: >
      CartEvent.java defines static constants ADD_ITEM=1, DELETE_ITEM=2, UPDATE_ITEMS=3,
      EMPTY=4. Multiple constructors support different event payloads: single item,
      single item with quantity, multiple items (HashMap).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/events/CartEvent.java
        line_start: 55
        line_end: 130
        excerpt: |
          public class CartEvent extends EventSupport {
              public static final int ADD_ITEM = 1;
              public static final int DELETE_ITEM = 2;
              public static final int UPDATE_ITEMS = 3;
              public static final int EMPTY = 4;
              ...
              public CartEvent(int actionType) { ... }
              public CartEvent(int actionType, String itemId) { ... }
              public CartEvent(int actionType, String itemId, int quantity) { ... }
              public CartEvent(int actionType, HashMap items) { ... }
          }
    stack_metadata:
      framework: Struts
      event.class: CartEvent

  - record_key: CART-REQUIREMENT-0011
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The shopping cart SHALL be stored in the HTTP session, keyed by a standard session
      attribute, enabling persistence across multiple page requests within a user session.
    confidence: medium
    confidence_basis: >
      The cart.jsp uses JSTL to access ${cart.count} and ${cart.items}, indicating
      the cart is available as a request/session attribute. However, the exact storage
      mechanism and attribute name require cross-referencing with the PetstoreComponentManager.
    risk_class: operational
    basis: >
      cart.jsp uses ${cart.count}, ${cart.items}, ${cart.subTotal} suggesting cart
      is available as a request attribute. PetstoreComponentManager sets session
      attribute using PetstoreKeys.CART and calls getShoppingCart(session).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 43
        line_end: 48
        excerpt: |
          <c:choose>
           <c:when test="${cart.count == 0}">
            <p class="petstore_title">Your Shopping Cart is Empty.</p>
           </c:when>
           <c:otherwise>
            <p class="petstore_title">Shopping Cart</p>

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      getItems() catches CatalogException but only prints to System.out, not re-throwing
      or propagating the error. The behavior when catalog lookup fails is unclear - does
      the item silently disappear from the cart view, or is the entire operation rolled back?
      The exception handling path is not visible in the source and could mask data loss.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      getSubTotal() returns null when items collection is null, but the caller's behavior
      with a null return is unknown. Cart.jsp uses <fmt:formatNumber> which may fail or
      render empty if passed null. Unclear whether this is intentional error signaling or
      a latent defect.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      The addItem(String itemID) method stores a quantity of 1 directly, but the addItem(String itemID, int qty)
      overload is visible in the implementation but not declared in the ShoppingCartLocal interface.
      Both passes can see the implementation takes qty, but the interface-level contract for this overload
      is missing, making it unclear whether it is part of the public API contract or an internal implementation detail.
