  - record_key: CART-REQUIREMENT-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support updating the quantity of an item in the shopping cart.
      GIVEN a quantity is set to a value less than or equal to zero, THEN the item
      SHALL be removed from the cart.
    confidence: high
    confidence_basis: >
      updateItemQuantity is declared in interface and implementation shows explicit
      logic for removing items when newQty <= 0. This is coded directly and verifiable.
    risk_class: operational
    basis: >
      ShoppingCartLocal interface declares updateItemQuantity(String itemID, int newQty).
      Implementation removes the item first, then only re-adds it if newQty > 0,
      effectively implementing the deletion-on-zero-or-negative rule.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 69
        line_end: 69
        excerpt: |
          public void updateItemQuantity(String itemID, int newQty);
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

  - record_key: CART-REQUIREMENT-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide a retrieval operation that returns all items currently
      in the shopping cart, with each item populated with current pricing and catalog
      metadata from the Catalog component.
    confidence: medium
    confidence_basis: >
      The getItems() method exists and calls catalog component, but the dynamic pricing
      lookup means prices are not stored in cart state. Both passes see the code path
      but resolving CatalogException handling requires understanding the catalog component's
      behavior.
    risk_class: operational
    basis: >
      ShoppingCartLocal declares getItems() returning Collection. Implementation fetches
      CatalogHelper and iterates over stored itemIDs, retrieving each item's current
      details via catalog.getItem(key, locale), converting to CartItem objects. Cart
      stores only itemID->quantity mapping; prices are fetched at retrieval time.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 65
        line_end: 65
        excerpt: |
          public Collection getItems();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 80
        line_end: 109
        excerpt: |
          public Collection getItems() {
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required
      integration: CatalogComponent

