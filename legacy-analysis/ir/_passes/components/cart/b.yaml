  - record_key: CART-REQUIREMENT-0006
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide a subtotal calculation operation that sums the total
      cost across all items in the shopping cart, calculated as the sum of
      (item quantity × item unit cost) for each item.
    confidence: high
    confidence_basis: >
      getSubTotal() is implemented with explicit iteration and multiplication.
      The calculation logic is directly visible in code and verifiable by both passes.
    risk_class: financial
    basis: >
      ShoppingCartLocal declares getSubTotal() returning Double. Implementation retrieves
      all items via getItems(), iterates over them, and accumulates sum of
      (i.getUnitCost() * i.getQuantity()) for each CartItem.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 71
        line_end: 71
        excerpt: |
          public Double getSubTotal();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

