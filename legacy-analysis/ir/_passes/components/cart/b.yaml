records:
  - record_key: CART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A CartItem entity SHALL store individual line items within a shopping cart,
      holding references to: item identifier, product identifier, category, product name,
      item attribute, quantity, and unit cost.
    confidence: high
    confidence_basis: >
      CartItem class is directly instantiated and used throughout the codebase.
      Both passes can verify the same class structure and field names. The entity
      is created from catalog data and stored in cart state.
    risk_class: operational
    basis: >
      CartItem.java defines all properties with getters for itemId, productId, category, name,
      attribute, quantity, and unitCost. Constructor takes all parameters and getTotalCost()
      multiplies quantity by unitCost.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;
              public double getTotalCost() {
                  return quantity * unitCost;
              }
          }

  - record_key: CART-ENTITY-0002
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A ShoppingCartModel entity SHALL wrap a collection of CartItems and provide
      aggregation methods to calculate total cart size and total cost across all items.
    confidence: high
    confidence_basis: >
      ShoppingCartModel is a simple value object with a clear contract. Both passes
      can verify the collection wrapping and the getTotalCost() calculation method.
    risk_class: operational
    basis: >
      ShoppingCartModel.java wraps a Collection of CartItems and provides getSize(),
      getCart(), getItems(), and getTotalCost() which iterates over items and sums
      each item's getTotalCost().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 49
        line_end: 96
        excerpt: |
          public class ShoppingCartModel implements Serializable {
              private Collection items;
              public int getSize() {
                  if (items != null) return items.size();
                  else return 0;
              }
              public double getTotalCost() {
                  double total = 0;
                  for (Iterator li = getItems(); li.hasNext(); ) {
                      CartItem item = (CartItem) li.next();
                      total += item.getTotalCost();
                  }
                  return total;
              }
          }

  - record_key: CART-REQUIREMENT-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support adding a product item to the shopping cart, with
      a default quantity of 1 or an optionally specified quantity.
    confidence: high
    confidence_basis: >
      The addItem method is declared in both the interface and implementation with
      two overloaded signatures. Both passes can verify this independently from source.
    risk_class: operational
    basis: >
      ShoppingCartLocal interface declares addItem(String itemID) and implementation
      ShoppingCartLocalEJB shows two overloaded addItem methods: one with just itemID
      (defaults to qty 1) and one with itemID and qty parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 61
        line_end: 61
        excerpt: |
          public void addItem(String itemID);
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }
          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

