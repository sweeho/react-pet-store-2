  - record_key: shopping-cart-item-cost-calculation-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the total cost of a cart item as the product of
      its unit cost and quantity. GIVEN a cart item with unitCost=10.50 and quantity=3,
      WHEN getTotalCost is called, THEN the result SHALL be 31.50.
    confidence: high
    confidence_basis: >
      Calculation formula is explicit in CartItem.getTotalCost() method. Simple
      multiplication with no rounding or special handling. Used consistently in
      ShoppingCartModel.getTotalCost() and OrderEJBAction line item creation.
    risk_class: financial
    basis: >
      CartItem.getTotalCost() returns (quantity * unitCost). Used by
      ShoppingCartModel.getTotalCost() which sums all cart items. OrderEJBAction
      converts to float and accumulates for purchase order total.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 95
        line_end: 97
        excerpt: |
          public double getTotalCost() {
              return quantity * unitCost;
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 137
