      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Container-managed

  - record_key: shopping-cart-add-item-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide an addItem operation that adds an item to the shopping
      cart. When an item is added without an explicit quantity, the default quantity
      SHALL be 1. The operation accepts an itemId as a parameter.
    confidence: high
    confidence_basis: >
      Two independent implementations both implement identical add behavior. addItem
      with String parameter defaults to quantity 1 in the EJB implementation. Overloaded
      addItem with explicit quantity also present. Behavior is deterministic and enforced
      at both EJB and controller action layers.
    risk_class: operational
    basis: >
      ShoppingCartLocal defines addItem(String itemID). ShoppingCartLocalEJB
      implements with default quantity 1. CartHTMLAction processes purchase action
      type and invokes addItem with itemId.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
