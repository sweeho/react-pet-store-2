  - record_key: shopping-cart-get-items-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide a getItems operation that returns a collection of all
      CartItem objects currently in the shopping cart. Each CartItem contains the itemId,
      productId, category, name, attribute, quantity, and unitCost. The cart SHALL
      resolve item metadata from the catalog component.
    confidence: medium
    confidence_basis: >
      Interface is clear and consistent. Implementation delegates to CatalogHelper to
      fetch Item metadata and converts to CartItem. However, the CatalogException is
      caught and silently logged with System.out.println, making error handling behavior
      ambiguous. The conversion logic is deterministic but error paths are not clearly
      defined.
    risk_class: operational
    basis: >
      ShoppingCartLocal defines getItems() returning Collection. ShoppingCartLocalEJB
      implementation iterates HashMap, calls CatalogHelper.getItem(itemId, locale) for
      each item, then constructs CartItem with resolved product metadata. OrderEJBAction
      uses getItems() to iterate items for order creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 65
        line_end: 65
        excerpt: |
          public Collection getItems();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB

  - record_key: shopping-cart-get-subtotal-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide a getSubTotal operation that returns a Double representing
      the sum of all cart item line totals. Each line total is calculated as
      unit cost × quantity. If the cart is empty or null, the operation SHALL return null.
    confidence: medium
    confidence_basis: >
      Implementation is explicit for the calculation (unit cost × quantity sum).
      However, the null return for empty cart is implicit—getItems() could return null,
      and the code has a null check, but the empty array case returns 0.0d instead.
      This inconsistency between null and 0.0d for empty carts makes confidence medium.
    risk_class: financial
    basis: >
      ShoppingCartLocal defines getSubTotal() returning Double. ShoppingCartLocalEJB
      implementation calls getItems(), iterates items, and accumulates
      (unitCost * quantity) for each CartItem. Returns null if items collection is null.
      JSP displays subtotal using fmt:formatNumber tag.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 71
        line_end: 71
        excerpt: |
          public Double getSubTotal();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 96
        line_end: 98
        excerpt: |
          <fmt:formatNumber value="${cart.subTotal}" type="currency" />
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB

