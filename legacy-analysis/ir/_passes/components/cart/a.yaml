records:
  - record_key: shopping-cart-entity-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL maintain a shopping cart as a stateful session object containing
      a collection of cart items, each identified by an itemId and tracked with a quantity
      and unit cost.
    confidence: high
    confidence_basis: >
      Verified by both ShoppingCartLocal interface definition and ShoppingCartLocalEJB
      implementation. The interface is declarative (interface), and the implementation
      (HashMap in ejb) is consistent. Stateful session type declared in ejb-jar.xml.
    risk_class: operational
    basis: >
      ShoppingCartLocal interface defines addItem, deleteItem, updateItemQuantity,
      getItems, getCount, getSubTotal, empty, and setLocale methods. ShoppingCartLocalEJB
      implements these using a HashMap<String, Integer> where key is itemId and value is
      quantity. CartItem model object holds itemId, productId, category, name, attribute,
      quantity, and unitCost.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 54
        line_end: 76
        excerpt: |
          public interface ShoppingCartLocal extends EJBLocalObject {
              public void addItem(String itemID);
              public void setLocale(Locale locale);
              public Collection getItems();
              public void deleteItem(String itemID);
              public void updateItemQuantity(String itemID, int newQty);
              public Double getSubTotal();
              public Integer getCount();
              public void empty();
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 62
        line_end: 70
        excerpt: |
          public class ShoppingCartLocalEJB implements SessionBean {
              private HashMap cart;
              private Locale locale = Locale.US;
              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 66
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 47
        line_end: 54
        excerpt: |
          <session>
              <display-name>ShoppingCartSB</display-name>
              <ejb-name>ShoppingCartEJB</ejb-name>
              <session-type>Stateful</session-type>
              <transaction-type>Container</transaction-type>
          </session>
