  - record_key: shopping-cart-screen-display-0001
    kind: screen
    capability_key: shopping-cart
    requirement: >
      The system SHALL display a shopping cart screen that lists all cart items with
      their product attributes, name, quantity, and unit cost. The screen SHALL display
      the cart subtotal in currency format. When the cart is empty, the screen SHALL
      display "Your Shopping Cart is Empty." The screen SHALL provide a form to update
      item quantities and an "Update Cart" submit button. Each item SHALL have a "Remove"
      link.
    confidence: high
    confidence_basis: >
      Screen definition is explicit in cart.jsp. Condition logic for empty vs populated
      states is clear. Form fields and display format (currency) are unambiguous. JSP
      tags use standard formatting (fmt:formatNumber for currency).
    risk_class: presentational
    basis: >
      cart.jsp uses <c:choose> to detect empty state (cart.count == 0). Non-empty state
      displays items in table with remove link per item, quantity input fields named
      itemQuantity_<itemId>, and currency-formatted subtotal. Currency formatting done
      via fmt:formatNumber. Form posts to cart.do with action=update.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 42
        line_end: 115
        excerpt: |
          <c:choose>
           <c:when test="${cart.count == 0}">
            <p class="petstore_title">Your Shopping Cart is Empty.</p>
           </c:when>
           <c:otherwise>
            <fmt:setLocale value="en_US" />
            <p class="petstore_title">Shopping Cart</p>
            <form action="cart.do">
             <input type="hidden" name="action" value="update">
             <table border="0"width="100%" cellpadding="1" cellspacing="0">
              <tr>
               <td bgcolor="#808080">
                <table width="100%" cellspacing="0" cellpadding="2" border="0" bgcolor="#FFFFFF">
                 <c:forEach var="item" items="${cart.items}" >
                 <tr>
                  <td width="50%" class="petstore_listing">
                   <a href='...'>${item.attribute} ${item.name}</a>
                  </td>
                  <td class="petstore_listing">
                   <a href='...'>Remove</a>
                  </td>
                  <td class="petstore_listing" align="right">
                   <input type="text" name="itemQuantity_${item.itemId}" value="${item.quantity}">
                  </td>
                  <td class="petstore_listing" align="right">@
                   <fmt:formatNumber value="${item.unitCost}" type="currency" />
                  </td>
                 </tr>
                 </c:forEach>
                 <tr>
                  <td colspan="2"><input type="submit" value="Update Cart"></td>
                  <td align="right"><b>Total:</b></td>
                  <td bgcolor="#CCCCFF" align="right">
                   <fmt:formatNumber value="${cart.subTotal}" type="currency" />
                  </td>
                 </tr>
                </table>
              </c:otherwise>
            </c:choose>
    stack_metadata:
      jsp.page: cart.jsp

  - record_key: shopping-cart-transactional-operations-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      All cart mutation operations (addItem, deleteItem, updateItemQuantity, empty,
      setLocale, getItems, getCount, getSubTotal) SHALL run within a container-managed
      transaction with transaction attribute "Required".
    confidence: high
    confidence_basis: >
      All cart methods are explicitly declared in ejb-jar.xml assembly-descriptor with
      <trans-attribute>Required</trans-attribute>. This is declarative configuration,
      the highest confidence evidence in a J2EE application. Container enforces these
      declarations at runtime.
    risk_class: operational
