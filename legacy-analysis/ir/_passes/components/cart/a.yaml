  - record_key: shopping-cart-update-quantity-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide an updateItemQuantity operation that updates the quantity
      of an item in the shopping cart. The operation accepts an itemId and a new quantity
      value. If the new quantity is less than or equal to 0, the item SHALL be removed
      from the cart. If the new quantity is greater than 0, the item SHALL be stored with
      the new quantity.
    confidence: high
    confidence_basis: >
      Implementation is explicit and consistent. The condition "if (newQty > 0)" is
      clearly stated with only one branch (remove-and-reinsert if qty>0). Declaratively
      marked Required transaction in ejb-jar.xml. Interface and controller action both
      support this operation.
    risk_class: operational
    basis: >
      ShoppingCartLocal defines updateItemQuantity(String itemID, int newQty).
      ShoppingCartLocalEJB implements by removing the item, then conditionally
      reinserting if newQty > 0. CartHTMLAction processes update action type and
      extracts itemQuantity_* parameters.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 69
        line_end: 69
        excerpt: |
          public void updateItemQuantity(String itemID, int newQty);
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 99
        line_end: 121
        excerpt: |
          else if (actionType.equals("update")) {
              Map quantities = new HashMap();
              Map parameters = request.getParameterMap();
              for (Iterator it = parameters.keySet().iterator();
                   it.hasNext(); ) {
                  String name = (String) it.next();
                  String value = ((String[]) parameters.get(name))[0];
                  final String ITEM_QTY = "itemQuantity_";
                  if (name.startsWith(ITEM_QTY)) {
                      String itemID = name.substring(ITEM_QTY.length());
                      Integer quantity = null;
                      try {
                          quantity = new Integer(value);
                      }
                      catch (NumberFormatException nfe) {
                          quantity = new Integer(0);
                      }
                      quantities.put(itemID, quantity);
                  }
              }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB

