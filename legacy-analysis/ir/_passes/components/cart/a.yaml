  - record_key: shopping-cart-validate-order-not-empty-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL validate that the shopping cart is not empty before allowing
      order placement. If an order is attempted with an empty cart, the system SHALL
      throw ShoppingCartEmptyOrderException with the message "Shopping cart is empty".
    confidence: high
    confidence_basis: >
      Validation is explicitly implemented in OrderEJBAction with clear condition
      check (items.size() == 0) and specific exception thrown. Exception class is
      declared and caught in mappings.xml for screen forwarding. Behavior is
      deterministic and enforced at order-creation layer.
    risk_class: operational
    basis: >
      OrderEJBAction checks cart.getItems().size() == 0 and throws
      ShoppingCartEmptyOrderException("Shopping cart is empty"). Exception is mapped
      in mappings.xml to cart_empty_order_error.screen. Exception class extends
      EventException and is Serializable.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/exceptions/ShoppingCartEmptyOrderException.java
        line_start: 42
        line_end: 60
        excerpt: |
          /**
           * This exception represents a failure to place an order because there
           * was nothing in the shopping cart. This error will primarily be generated
           * when a user his the back button and tries to replace an order.
           */
          public class ShoppingCartEmptyOrderException extends EventException implements java.io.Serializable {
              private String message;
              public ShoppingCartEmptyOrderException(String message) {
                  this.message = message;
              }
              public String getMessage() {
                  return message;
              }
          }
    stack_metadata:
