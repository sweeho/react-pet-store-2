  - record_key: shopping-cart-workflow-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      GIVEN a customer viewing a product catalog, WHEN they select a product to purchase,
      THEN the system SHALL add the item to their shopping cart. GIVEN a customer with
      items in their cart, WHEN they view the cart screen, THEN they SHALL see all items
      with quantity and price, and be able to update quantities or remove items. GIVEN
      a customer with items in their cart, WHEN they proceed to checkout, THEN the system
      SHALL validate the cart is not empty, or display an error message. GIVEN a customer
      who completes order placement, WHEN the order is created, THEN the shopping cart
      SHALL be automatically emptied.
    confidence: high
    confidence_basis: >
      Workflow is traced through multiple independent entry points: CartHTMLAction
      processes HTTP actions (purchase, remove, update), CartEJBAction performs EJB
      operations, OrderEJBAction validates cart before order creation and empties cart
      on success. Each step is explicit and verifiable.
    risk_class: operational
    basis: >
      cart.do URL mapping routes to CartHTMLAction which creates CartEvent objects.
      CartEJBAction responds to events by calling cart methods. OrderEJBAction validates
      cart.getItems().size(), throws exception if empty, then calls cart.empty() on
      success. Workflow is enforced at controller and EJB layers.
