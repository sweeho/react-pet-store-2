  - record_key: notifications-conn-mgmt-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL close JMS queue connections after message transmission
      regardless of success or failure, to prevent resource leaks.
    confidence: high
    confidence_basis: >
      The implementation consistently demonstrates resource cleanup in a finally block,
      which is a guaranteed execution path. This pattern is standard and enforced by
      the try-finally structure, so the rule is unambiguous.
    risk_class: operational
    basis: >
      AsyncSenderEJB uses a try-catch-finally block where the finally block explicitly
      closes the QueueConnection if it was created. This ensures cleanup occurs even
      when exceptions are thrown during message sending.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 83
