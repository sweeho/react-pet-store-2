  - record_key: notifications-initialization-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL initialize JMS resources during EJB creation via ServiceLocator,
      raising an EJBException if resource lookup fails.
    confidence: high
    confidence_basis: >
      The ejbCreate method is declaratively bound and its implementation is clear.
      Both the interface contract and implementation demonstrate the same initialization
      pattern.
    risk_class: operational
    basis: >
      The AsyncSenderEJB.ejbCreate() method uses ServiceLocator to retrieve the
      QueueConnectionFactory and AsyncSenderQueue. If ServiceLocatorException occurs,
      it is wrapped in an EJBException with descriptive message. This ensures
      initialization failures are propagated to the container.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
                try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
                } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
                }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB

findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
    description: >
      Line 82 contains error message "askMDBToSendAMessage: Error!" which references
      an MDB (Message-Driven Bean) operation, but the actual component being called is
      a Stateless Session Bean. This naming inconsistency suggests either copy-paste
      from another component or an outdated comment. The actual behavior is correct
      (sends to queue), but the error message is misleading about the operation being
      performed. This requires clarification on whether this is a documentation defect
      or a behavioral discrepancy with calling code expectations.
