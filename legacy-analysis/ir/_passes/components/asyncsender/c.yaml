  - record_key: notifications-component-0001
    kind: integration
    capability_key: notifications
    requirement: >
      The system SHALL provide an AsyncSender stateless session EJB component
      accessible only within the local application context via JNDI.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor and JNDI names configuration are
      declarative and unambiguous. The component structure is consistent across
      all configuration and implementation files.
    risk_class: operational
    basis: >
      The AsyncSender is declared as a Stateless Session Bean with Local home and
      Local interface only (no remote interfaces). It is registered in JNDI under
      java:comp/env/ejb/AsyncSender. The JNDINames utility confirms this is the
      only access path within the application.
