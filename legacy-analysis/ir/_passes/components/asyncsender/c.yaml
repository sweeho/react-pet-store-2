records:
  - record_key: notifications-async-0001
    kind: integration
    capability_key: notifications
    requirement: >
      The system SHALL send messages asynchronously to a JMS queue.
    confidence: high
    confidence_basis: >
      Both the ejb-jar.xml deployment descriptor and AsyncSenderEJB implementation
      consistently demonstrate JMS queue integration with createQueueConnection() and
      session.send() calls. The component is dedicated to this single purpose.
    risk_class: operational
    basis: >
      AsyncSenderEJB uses QueueConnectionFactory to create JMS connections and sends
      TextMessage objects to a JMS queue via QueueSender.send(). The architecture
      isolates this responsibility in a dedicated EJB component.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                        if( qConnect != null ) {
                  qConnect.close();
                        }
              } catch(Exception e) {}
                }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.queue: AsyncSenderQueue

  - record_key: notifications-txn-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL enlist message sending operations in the current transaction
      context, ensuring that message dispatch is atomic with respect to the invoking
      transaction.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor explicitly declares trans-attribute as
      Required for the sendAMessage method, which is a declarative constraint that
      cannot be overridden at runtime. This is confirmed in both the interface contract
      and the EJB implementation structure.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor specifies container-transaction with
      trans-attribute=Required for sendAMessage. This ensures the method participates
      in its caller's transaction context. Additionally, the QueueSession is created
      with transacted flag set to true (createQueueSession(true,0)), which confirms
      transactional semantics at the JMS level.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>sendAMessage</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
