  - record_key: NOTIF-ASYNC-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL restrict access to AsyncSenderEJB methods to be unchecked,
      meaning no role-based authorization is required to invoke any method on
      the bean (getPrimaryKey, getEJBLocalHome, remove, sendAMessage, create).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares an unchecked method-permission element (line 72)
      that applies to all listed methods. This is explicit declarative configuration
      with no conflicting code-level authorization checks found in the bean
      implementation. Both passes should identify this consistently.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor contains a method-permission with an
      empty unchecked element followed by all method specifications. This means
      all methods are accessible without authentication or role checking.
    traces:
