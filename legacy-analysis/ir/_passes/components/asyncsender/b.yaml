  - record_key: NOTIF-REQUIREMENT-0002
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL maintain an open QueueConnection throughout the message
      send operation and SHALL explicitly close the connection in a finally block
      to ensure resource cleanup regardless of success or exception.
    confidence: high
    confidence_basis: >
      Resource cleanup is explicitly declared in the finally block of the
      sendAMessage method and is the only cleanup mechanism for the connection
      resource. The try-finally pattern is standard for resource management and
      is both declared and implemented consistently.
    risk_class: operational
    basis: >
      The sendAMessage method wraps the JMS operations in a try-finally block
      where the finally clause unconditionally closes the QueueConnection if it
      is not null. This ensures connections are returned to the factory pool even
      when exceptions occur during message sending.
