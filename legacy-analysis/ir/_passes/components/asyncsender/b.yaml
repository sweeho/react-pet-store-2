records:
  - record_key: NOTIF-WORKFLOW-0001
    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL send asynchronous messages via a stateless session bean
      that obtains a JMS queue connection, creates a text message, and sends it
      to the AsyncSenderQueue for asynchronous delivery.
    confidence: high
    confidence_basis: >
      The workflow is declared and enforced at multiple levels: the ejb-jar.xml
      declares AsyncSenderEJB as a stateless session bean with container-managed
      transactions; the AsyncSenderEJB class implements the SessionBean interface
      and the sendAMessage method explicitly implements the workflow with queue
      lookup, connection creation, message sending, and resource cleanup in a
      finally block. Both declarative and programmatic enforcement provide high
      confidence.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares AsyncSenderEJB as a session bean with
      session-type Stateless and transaction-type Container. The AsyncSenderEJB
      class implements SessionBean and provides sendAMessage(String msg) which
      creates a QueueConnection from the QueueConnectionFactory JNDI resource,
      creates a QueueSession, creates a QueueSender, constructs a TextMessage,
      and sends it to the queue. Connection cleanup occurs in the finally block.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 68
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
            <security-identity>
              <description></description>
              <use-caller-identity></use-caller-identity>
            </security-identity>
            <resource-ref>
              <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
              <res-type>javax.jms.QueueConnectionFactory</res-type>
              <res-auth>Container</res-auth>
              <res-sharing-scope>Shareable</res-sharing-scope>
            </resource-ref>
            <resource-env-ref>
              <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
              <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
            </resource-env-ref>
          </session>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                        if( qConnect != null ) {
                  qConnect.close();
                        }
              } catch(Exception e) {}
                }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.queue: AsyncSenderQueue

  - record_key: NOTIF-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      When the sendAMessage method is invoked with a message string, the system
      SHALL create a JMS TextMessage object, populate it with the message text,
      and send it to the AsyncSenderQueue for asynchronous processing.
    confidence: high
    confidence_basis: >
      The requirement is explicitly coded in the sendAMessage method with a clear
      three-step sequence: create TextMessage via session.createTextMessage(),
      populate via jmsMsg.setText(msg), and send via qSender.send(jmsMsg). This
      is the only code path for message sending and is reinforced by the resource
      declarations in ejb-jar.xml.
    risk_class: operational
    basis: >
      The AsyncSenderEJB.sendAMessage() method explicitly creates a TextMessage
      using the QueueSession, sets its text content from the method parameter,
      and sends it to the queue using the QueueSender obtained from the session.
