  - record_key: NOTIF-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      When an exception occurs during message sending, the system SHALL catch the
      exception, wrap it in an EJBException with error message
      "askMDBToSendAMessage: Error!", and throw the EJBException to the caller.
    confidence: medium
    confidence_basis: >
      The exception handling is explicitly implemented in the catch block of
      sendAMessage. However, the error message "askMDBToSendAMessage: Error!"
      appears to be a vestigial reference to MDB (Message-Driven Bean) code and
      does not match the actual context of a session bean, suggesting this may be
      copy-paste code. The mechanism is clear but the message indicates possible
      maintenance debt.
    risk_class: operational
    basis: >
      The sendAMessage method includes a catch(Exception e) block that prints the
      stack trace and throws a new EJBException with the message
      "askMDBToSendAMessage: Error!" This ensures callers are notified of
      failures in an EJB-standard way.
