  - record_key: NOTIF-INTEGRATION-0001
    kind: integration
    capability_key: notifications
    requirement: >
      The system SHALL locate the JMS QueueConnectionFactory resource at the JNDI
      name java:comp/env/jms/QueueConnectionFactory at bean initialization and
      cache it for reuse in all sendAMessage invocations.
    confidence: high
    confidence_basis: >
      The JNDI name is declared in both the code and the ejb-jar.xml. The
      JNDINames class defines the constant QUEUE_CONNECTION_FACTORY as
      java:comp/env/jms/QueueConnectionFactory, and the ejb-jar.xml declares the
      matching resource-ref element. The ServiceLocator is used to retrieve and
      cache the factory in ejbCreate(), which is invoked exactly once per bean
      instance.
    risk_class: operational
    basis: >
      The AsyncSenderEJB.ejbCreate() method uses ServiceLocator to look up the
      QueueConnectionFactory from the JNDI name defined in JNDINames.QUEUE_CONNECTION_FACTORY,
      which is java:comp/env/jms/QueueConnectionFactory. The factory is stored in
      the instance variable qFactory and reused in all sendAMessage calls. The
      ejb-jar.xml declares this resource-ref.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/util/JNDINames.java
        line_start: 56
        line_end: 57
        excerpt: |
          public static final String QUEUE_CONNECTION_FACTORY =
                              "java:comp/env/jms/QueueConnectionFactory";
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
                try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
                } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
                }
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
        line_end: 63
        excerpt: |
          <resource-ref>
