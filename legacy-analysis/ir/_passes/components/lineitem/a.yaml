  - record_key: ORDERPLACEMENT-REQUIREMENT-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL support creation of LineItem instances through two distinct
      constructors: (1) a constructor accepting categoryId, productId, itemId, lineNumber,
      quantity (as int), unitPrice (as float), and quantityShipped (as int) as separate
      parameters, and (2) a constructor accepting a pre-populated LineItem object and
      a quantityShipped value (as int).
    confidence: high
    confidence_basis: >
      Both constructor signatures are declared in both the POJO (LineItem.java) and
      the EJB home interface (LineItemLocalHome). The EJB container enforces these
      through ejbCreate methods with matching signatures. The two ejbCreate methods
      show that quantity values are passed at creation time, establishing the initial
      ordered quantity and initial shipped quantity.
    risk_class: operational
    basis: >
      Constructor signature in LineItem.java lines 73-81, two ejbCreate methods in
      LineItemEJB lines 141-152 and 158-167, and two create methods in
      LineItemLocalHome lines 53-57.
