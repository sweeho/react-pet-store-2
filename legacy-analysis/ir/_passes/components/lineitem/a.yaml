  - record_key: ORDERPLACEMENT-BUSINESSRULE-0003
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL track the fulfillment state of each line item separately,
      storing a quantityShipped value that is initialized at line item creation time
      and may be updated independently from the original ordered quantity. The
      quantityShipped field SHALL be readable via getQuantityShipped() and writable
      via setQuantityShipped(int qty).
    confidence: high
    confidence_basis: >
      The quantityShipped field is explicitly declared as a separate CMP field in
      ejb-jar.xml, implemented as abstract methods in LineItemEJB with both getter
      and setter, and exposed through the LineItemLocal interface. The two ejbCreate
      methods accept quantityShipped at creation time, establishing it as a distinct
      business concept from the ordered quantity. The setter method is declared with
      Required transaction semantics.
    risk_class: operational
    basis: >
      CMP field declared in ejb-jar.xml line 77, getter/setter methods in
      LineItemEJB lines 130-136, local interface methods in LineItemLocal lines 56-57,
      and ejbCreate implementations at lines 150 and 165 showing quantityShipped
      initialization separate from quantity.
