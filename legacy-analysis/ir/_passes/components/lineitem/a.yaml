      entity bean with a local-only interface. The EJB SHALL have a local home interface
      (LineItemLocalHome) and a local interface (LineItemLocal) for client access, with
      no remote home or remote interface exposed to external callers.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml explicitly declares persistence-type as "Container",
      cmp-version as "2.x", defines a local-home and local interface, and omits any
      remote-home or remote interface declarations. The Java interfaces (LineItemLocal
      and LineItemLocalHome) are declared as extending EJBLocalObject and EJBLocalHome
      respectively. This is a standard local-only EJB deployment pattern for
      co-located component communication.
