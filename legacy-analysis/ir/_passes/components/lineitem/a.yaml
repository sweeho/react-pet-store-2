    basis: >
      ejb-jar.xml lines 53, 50-51, 56 declare the persistence type, local interfaces,
      and CMP version. LineItemLocal.java line 48 extends EJBLocalObject.
      LineItemLocalHome.java line 51 extends EJBLocalHome. No remote interfaces
