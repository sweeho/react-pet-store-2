    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL maintain a LineItem entity with seven primary attributes:
      categoryId (product category identifier as String), productId (product identifier
      as String), itemId (line item instance identifier as String), lineNumber (order
      line sequence number as String), quantity (number of units ordered as int),
      unitPrice (price per unit as float), and quantityShipped (number of units fulfilled
      as int, initialized to zero at line item creation).
    confidence: high
    confidence_basis: >
      The entity is declared in seven CMP field definitions in ejb-jar.xml (lines 58-78)
      and implemented as abstract getter/setter methods in LineItemEJB. Both the DTD
      schema and the LineItem POJO confirm all seven attributes. The cmp-field for
      quantityShipped is explicitly declared. Multiple independent code paths
      (entity beans, POJO, and XML serialization) reference these same fields consistently.
    risk_class: financial
    basis: >
      CMP fields defined in ejb-jar.xml lines 58-78, abstract methods in LineItemEJB
      lines 58-136, POJO fields in LineItem lines 63-68, and XML serialization in
      LineItem lines 138-146 confirm the entity structure.
