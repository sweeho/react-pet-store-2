  - record_key: SHOP-REL-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      A LineItem is part of a PurchaseOrder in a one-to-many relationship. A single
      PurchaseOrder contains zero or more LineItems.
    confidence: high
    confidence_basis: >
      The relationship is declared in PurchaseOrderEJB via CMR field getLineItems(),
      and used consistently in PurchaseOrderHelper for iteration and fulfillment checks.
    risk_class: operational
    basis: >
      PurchaseOrderEJB declares abstract getLineItems() and setLineItems(Collection)
      methods for container-managed relationship. PurchaseOrderHelper iterates this
      collection to process invoices.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 1
        line_end: 50
        excerpt: |
          // PurchaseOrderEJB has one-many relationship with LineItemEJB
          public abstract Collection getLineItems();
          public abstract void setLineItems(Collection litems);
          public void addLineItem(LineItemLocal lItem){
              getLineItems().add(lItem);
          }
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      ejb.cmr: PurchaseOrderEJB.LineItemEJB (1:N)

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
    description: >
      The lineNumber field's business purpose is unclear. It is declared as a String
      and persisted, but no code uses it for sorting, sequencing, or validation. Is it
      for display/reference only, or does it establish order within a purchase order?
      A human should clarify whether lineNumber is functional or decorative.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
    description: >
      The processInvoice method assumes lineItemIds is a complete map of all items
      to be shipped. If an item appears in the PO but not in lineItemIds, it is silently
      skipped (quantityShipped remains unchanged). This allows partial invoices to update
      partial fulfillment, but the behavior is implicit. Should the system validate that
      invoice items match expected items before processing?

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
    description: >
      LineItemEJB.getData() method (line 171-180) returns a LineItem POJO copy of the
      entity's state but excludes quantityShipped. The method's comment says it is
      required because "managed objects can't be accessed outside transaction boundaries",
      but it is unclear whether this is a requirement or an implementation workaround.
      Should quantityShipped be included in the returned data?
