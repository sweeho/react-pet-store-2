  - record_key: ORDER-POLICY-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      All LineItem methods (getters, setters, and create operations) SHALL execute
      within a Required transaction context, ensuring atomicity of state changes.
    confidence: high
    confidence_basis: >
      ejb-jar.xml explicitly declares trans-attribute=Required for all LineItemEJB
      methods, both on LocalHome (create) and Local (getters/setters). This is
      consistently applied across all methods.
    risk_class: operational
    basis: >
      ejb-jar.xml container-transaction declarations specify Required for all methods:
      getCategoryId, getProductId, getItemId, getLineNumber, getQuantity, getUnitPrice,
      getQuantityShipped, setQuantityShipped, getData, and both create methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 93
        line_end: 205
        excerpt: |
          <container-transaction>
           <method>
             <ejb-name>LineItemEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>getCategoryId</method-name>
             <method-params />
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
          ... (repeated for all other methods)
    stack_metadata:
      ejb.transaction: Required
      ejb.bean: LineItemEJB

  - record_key: AUTH-RULE-0001
    kind: requirement
    capability_key: authentication
    requirement: >
