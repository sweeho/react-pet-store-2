    confidence: high
    confidence_basis: >
      Field is defined in both LineItem POJO and EJB, persisted as CMP field,
      and is universally accessed via getter/setter. Reachability confirmed through
      PurchaseOrderEJB usage.
    risk_class: operational
    basis: >
      LineItem.java line 63 declares categoryId field; accessed via getCategoryId/setCategoryId
      methods. LineItemEJB defines abstract accessors, and ejb-jar.xml declares it as CMP field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 63
        line_end: 84
        excerpt: |
          private String categoryId;
          public String getCategoryId() {
            return this.categoryId;
          }
          public void setCategoryId(String categoryId) {
            this.categoryId = categoryId;
            return;
          }
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.cmp_field: categoryId

