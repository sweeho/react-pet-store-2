  - record_key: ORDER-FIELD-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      A LineItem SHALL track quantityShipped (int), representing the number of units
      already received/delivered against this line item.
    confidence: high
    confidence_basis: >
      Field is declared as abstract property in LineItemEJB, persisted as CMP field,
      actively modified during invoice processing, and used as the basis for fulfillment
      status determination.
    risk_class: operational
    basis: >
      LineItemEJB lines 130-136 declare getQuantityShipped/setQuantityShipped. Persisted
      in ejb-jar.xml. Incremented in PurchaseOrderHelper.processInvoice() line 89.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 127
        line_end: 136
        excerpt: |
          /**
           * Accessor for line item's qty that is shipped
           * @return int the qty already shipped
           */
          public abstract int getQuantityShipped();

          /**
           * Setter for line item's quantity that is already shipped
           * @param int the qty already shipped
           */
          public abstract void setQuantityShipped(int qty);
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 88
        line_end: 90
        excerpt: |
          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
          li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.cmp_field: quantityShipped

  - record_key: ORDER-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      When an invoice is processed for a purchase order, the system SHALL increment
      the quantityShipped of each LineItem by the quantity specified in the invoice
      for that item.
    confidence: high
    confidence_basis: >
      Logic is declared in PurchaseOrderHelper.processInvoice() and is actively used
      to track partial fulfillment. The rule is clear and enforced.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice() iterates line items and for each item found
      in the lineItemIds map, increments quantityShipped additively.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 82
        line_end: 91
        excerpt: |
          //set the quantity of line items shipped in the PO
          Collection liColl = po.getLineItems();
          Iterator liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(lineItemIds.containsKey(li.getItemId())) {
              Integer shipped = (Integer) lineItemIds.get(li.getItemId());
              li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
            }
          }//end while
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      ejb.method: PurchaseOrderHelper.processInvoice()

  - record_key: ORDER-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      A purchase order is completely fulfilled when, for every LineItem in the order,
      quantity equals quantityShipped (all ordered units have been received).
    confidence: high
    confidence_basis: >
      Rule is explicitly implemented in PurchaseOrderHelper.processInvoice() return logic.
      Both passes should agree on this fulfillment criterion.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice() returns true only when all line items satisfy
      li.getQuantity() == li.getQuantityShipped(). This is the only return path that
      indicates order completion.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 103
        excerpt: |
          // now loop through all LIs and see if all are shipped completely
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
              return false;
            }
          }//end while
          return true;
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      ejb.method: PurchaseOrderHelper.processInvoice()

