records:
  - record_key: SHOP-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A LineItem entity SHALL represent a product in a purchase order, maintaining
      catalog references, quantity ordered, unit price, and fulfillment tracking.
    confidence: high
    confidence_basis: >
      Two independent sources (LineItem.java POJO and LineItemEJB CMP bean) consistently
      define the same fields. The DDL equivalents in ejb-jar.xml confirm persistence
      of these fields. All passes should agree on this data model.
    risk_class: operational
    basis: >
      LineItem.java defines fields: categoryId, productId, itemId, lineNumber, quantity,
      unitPrice. LineItemEJB extends this with quantityShipped. These are persisted as
      CMP fields in the EJB configuration.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 53
        line_end: 81
        excerpt: |
          public class LineItem {
            private String categoryId;
            private String productId;
            private String itemId;
            private String lineNumber;
            private int    quantity;
            private float  unitPrice;
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 58
        line_end: 78
        excerpt: |
          <cmp-field>
            <field-name>categoryId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>productId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>itemId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>lineNumber</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantity</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>unitPrice</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: LineItemEJB
      ejb.persistence_type: Container
      ejb.cmp_version: 2.x
      db.object: LineItem table

