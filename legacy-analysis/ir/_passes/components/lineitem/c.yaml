records:
  - record_key: order-placement-entity-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL maintain LineItem entities that capture individual products
      within an order, including product identification, quantity, pricing, and
      fulfillment tracking.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as CMP entity with abstract-schema-name LineItem and seven
      CMP fields. Confirmed by LineItemEJB class implementing EntityBean with all getter
      and setter methods.
    risk_class: operational
    basis: >
      LineItem entity is a core data model for orders. The ejb-jar.xml defines it as
      a CMP 2.x entity bean with fields: categoryId, productId, itemId, lineNumber,
      quantity, unitPrice, quantityShipped. All fields are container-managed.
    traces:
