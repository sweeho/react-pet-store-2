  - record_key: order-placement-entity-0002
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL store LineItem identifiers that reference the product catalog
      (categoryId, productId, itemId) to maintain the link between line items and
      the original products ordered.
    confidence: high
    confidence_basis: >
      All three identifier fields are declared as CMP fields and captured from the
      CartItem at order time. They are used to construct the LineItem and persisted
      in the entity.
    risk_class: operational
    basis: >
      ejb-jar.xml declares categoryId, productId, and itemId as CMP fields. LineItemEJB
      provides getters and setters for all three. The DTD schema confirms the structure:
      LineItem contains CategoryId, ProductId, and ItemId as child elements.
