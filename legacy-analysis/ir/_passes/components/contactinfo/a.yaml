  - record_key: CUSTOMERMANAGEMENT-REQUIREMENT-0003
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL support three variants of ContactInfo creation: (1) creation with
      no parameters, in which case an empty ContactInfo is created with an automatically
      generated empty Address entity; (2) creation with givenName, familyName, telephone,
      email, and AddressLocal parameters; and (3) creation from a ContactInfo value object
      that includes all contact data and address information.
    confidence: high
    confidence_basis: >
      ContactInfoLocalHome declares three overloaded create methods (lines 47-52) matching
      the three creation patterns. The ContactInfoEJB implements corresponding ejbCreate and
      ejbPostCreate method pairs (lines 77-127) implementing the three creation patterns.
      The first variant automatically creates an empty Address using ServiceLocator.
      The second variant uses the provided AddressLocal reference. The third variant creates
      a new Address from the ContactInfo value object's address data.
    risk_class: operational
    basis: >
      ContactInfoLocalHome lines 47-52 declare the three create method signatures.
      ContactInfoEJB lines 77-127 define corresponding ejbCreate and ejbPostCreate methods
      implementing the three patterns. The ejbPostCreate methods use ServiceLocator to
      instantiate Address entities.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 47
        line_end: 52
        excerpt: |
          public ContactInfoLocal create() throws CreateException;

          public ContactInfoLocal create(String givenName, String familyName,
                                         String telephone, String email, AddressLocal address) throws CreateException;

          public ContactInfoLocal create(ContactInfo contactInfo) throws CreateException;

          public ContactInfoLocal findByPrimaryKey(Object key) throws FinderException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 77
        line_end: 127
        excerpt: |
          public Object ejbCreate () throws CreateException {
            return null;
          }

          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }

          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
                                  throws CreateException {
            setGivenName(givenName);
            setFamilyName(familyName);
            setTelephone(telephone);
            setEmail(email);
            return null;
          }

          public void ejbPostCreate(String givenName, String familyName,
                                    String telephone, String email,
                                    AddressLocal address) throws CreateException {
            setAddress(address);
          }

          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }

  - record_key: CUSTOMERMANAGEMENT-REQUIREMENT-0004
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL provide a getData() method on ContactInfo that returns a ContactInfo
      value object containing all contact fields (givenName, familyName, email, telephone)
      and the complete Address data from the associated Address entity.
    confidence: high
    confidence_basis: >
      ContactInfoEJB defines a getData() method (lines 129-137) that constructs and populates
      a ContactInfo value object with all fields from the CMP entity including the Address
      data retrieved from the CMR relationship. The ContactInfoLocal interface declares this
      method (line 60) as an available operation.
    risk_class: operational
    basis: >
      ContactInfoEJB lines 129-137 define getData() method that retrieves all contact fields
      and calls getAddress().getData() to obtain the Address value object. ContactInfoLocal
      line 60 declares the getData() method signature.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 137
        excerpt: |
          public ContactInfo getData() {
            ContactInfo contactInfo = new ContactInfo();
            contactInfo.setGivenName(getGivenName());
            contactInfo.setFamilyName(getFamilyName());
            contactInfo.setPhone(getTelephone());
            contactInfo.setEmail(getEmail());
            contactInfo.setAddress(getAddress().getData());
            return contactInfo;
          }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocal.java
        line_start: 60
        line_end: 61
        excerpt: |
          public ContactInfo getData();

  - record_key: CUSTOMERMANAGEMENT-REQUIREMENT-0005
    kind: requirement
    capability_key: customer-management
    requirement: >
      All ContactInfo and Address EJB methods SHALL execute within a Required transaction
      context, meaning the container SHALL create a transaction if one does not exist and
      join an existing transaction if one does.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares container-transaction elements with trans-attribute set to
      "Required" for all methods on both ContactInfoEJB and AddressEJB. This is declarative
      configuration that the EJB container enforces at runtime for every invocation.
    risk_class: operational
    basis: >
      Container-transaction elements in ejb-jar.xml define trans-attribute "Required" for
      all methods on ContactInfoEJB (lines 292-430) and AddressEJB (lines 431-586). Every
      getter, setter, create, and remove method has an associated container-transaction entry.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 291
        line_end: 310
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>ContactInfoEJB</ejb-name>
                <method-intf>Local</method-intf>
                <method-name>setFamilyName</method-name>
                <method-params>
                  <method-param>java.lang.String</method-param>
                </method-params>
              </method>
            </method-permission>
            <container-transaction>
              <method>
                <ejb-name>ContactInfoEJB</ejb-name>
                <method-intf>LocalHome</method-intf>
                <method-name>remove</method-name>
                <method-params>
                  <method-param>java.lang.Object</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 309
        line_end: 321
        excerpt: |
