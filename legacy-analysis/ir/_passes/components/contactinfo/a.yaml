  - record_key: CUSTOMERMANAGEMENT-BUSINESSRULE-0006
    kind: business-rule
    capability_key: customer-management
    requirement: >
      All methods on ContactInfoEJB and AddressEJB SHALL be accessible without role-based
      authorization restrictions. The system SHALL use unchecked security-identity for all
      method invocations on these entities.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares method-permission elements with unchecked flag for all methods
      on both ContactInfoEJB and AddressEJB. The security-identity element uses use-caller-identity
      which means no role check is performed. This declarative configuration applies to all
      getter, setter, create, find, and remove methods.
    risk_class: operational
    basis: >
      Security configuration in ejb-jar.xml lines 150-151 for ContactInfoEJB and lines 120-122
      for AddressEJB declare use-caller-identity with no method-permission restrictions beyond
      the unchecked flag. All method-permission declarations in the assembly-descriptor (lines
      150-290) are marked unchecked, indicating no role-based access control.
    traces:
