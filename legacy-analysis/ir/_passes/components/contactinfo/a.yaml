  - record_key: CUSTOMERMANAGEMENT-ENTITY-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a ContactInfo entity with four contact fields: givenName
      (String), familyName (String), email (String), and telephone (String). Each ContactInfo
      entity has exactly one associated Address entity and is deleted when its parent Account
      is deleted (cascade-delete semantics).
    confidence: high
    confidence_basis: >
      The ContactInfo entity is declared in ejb-jar.xml with four CMP fields (familyName,
      givenName, email, telephone) and one CMR relationship to Address. The DTD schema enforces
      the required structure. The relationship from Account to ContactInfo is defined with
      cascade-delete semantics. The ContactInfoEJB provides abstract getter/setter methods
      for all fields and a getData() method for serialization.
    risk_class: operational
    basis: >
      ContactInfo entity declared in ejb-jar.xml lines 46-84 with four CMP fields and
      address CMR relationship. ContactInfoEJB lines 59-73 define abstract getter/setter
      methods. Relationship with cascade-delete declared in ejb-jar.xml lines 127-147.
      DTD schema defined in ContactInfo.dtd lines 38-42.
