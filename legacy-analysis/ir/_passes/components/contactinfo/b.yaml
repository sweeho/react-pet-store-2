      The system SHALL display and accept customer contact information
      comprising: First Name (required), Last Name (required), Street Address
      (required), Street Address 2 (optional), City (required), State/Province
      (required, select from predefined list), Postal Code (required), Country
      (required, select from predefined list), Telephone Number (required),
      and E-Mail (required) in the customer creation and order placement flows.
    confidence: high
    confidence_basis: >
      The exact same contact information fields are displayed in both the
      create_customer.jsp and enter_order_information.jsp screens. Field
      layout, labels, and size constraints are consistent across both
      screens. Validation is applied consistently via waf:form tags.
      State and Country use hardcoded select options, indicating
      restricted value sets.
    risk_class: operational
    basis: >
      create_customer.jsp lines 44-124 and enter_order_information.jsp
      lines 48-330 both render the full contact information form with
      identical fields. Both use waf:input tags with maxlength constraints
      and validation="validation" attributes. Both use waf:select for
      State and Country with hardcoded option values.
