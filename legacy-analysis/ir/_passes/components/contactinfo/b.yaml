  - record_key: customer-management-relationship-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a mandatory one-to-one relationship between
      ContactInfo and Address such that each ContactInfo is associated with
      exactly one Address record.
    confidence: high
    confidence_basis: >
      The one-to-one multiplicity is declared declaratively in ejb-jar.xml
      in the relationships section, and enforced in both the ContactInfoEJB
      implementation (ejbPostCreate methods always create/set an Address) and
      the DTD schema which embeds Address within ContactInfo.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a relationship with multiplicity One for both
      ContactInfoEJB and AddressEJB. ContactInfoEJB.ejbPostCreate always
      creates an Address via ServiceLocator or accepts one as parameter.
      Cascade delete is enabled on the Address side.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 126
        line_end: 148
        excerpt: |
          <relationships>
            <ejb-relation>
              <ejb-relationship-role>
                <ejb-relationship-role-name>ContactInfoEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <relationship-role-source>
                  <ejb-name>ContactInfoEJB</ejb-name>
                </relationship-role-source>
                <cmr-field>
                  <cmr-field-name>address</cmr-field-name>
                </cmr-field>
              </ejb-relationship-role>
              <ejb-relationship-role>
                <ejb-relationship-role-name>AddressEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <cascade-delete />
              </ejb-relationship-role>
            </ejb-relation>
          </relationships>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 81
        line_end: 91
        excerpt: |
          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }

  - record_key: customer-management-relationship-0002
