  - record_key: customer-management-requirement-0005
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL support retrieving a ContactInfo entity with all
      associated data (including nested Address) via the getData() method,
      returning a snapshot that can be serialized to XML.
    confidence: high
    confidence_basis: >
      ContactInfoEJB.getData() method is implemented to construct a complete
      ContactInfo DTO including the full Address object. ContactInfo class
      includes toDOM/fromDOM methods demonstrating XML serialization support.
      This is accessible through both local interface and DTO pattern.
    risk_class: operational
    basis: >
      ContactInfoEJB.getData() returns a new ContactInfo object populated
      with all current field values including address. ContactInfo class
      provides toDOM() and fromDOM() methods for XML serialization, with
      DTD schema defining the XML structure. The DTO is used as a data
      carrier between EJB and other layers.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 137
