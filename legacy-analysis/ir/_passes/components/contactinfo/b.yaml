records:
  - record_key: customer-management-entity-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL provide an entity to manage customer contact information
      comprising given name, family name, telephone number, email address, and
      an associated address record.
    confidence: high
    confidence_basis: >
      Entity structure is enforced declaratively in ejb-jar.xml as CMP fields
      and backed by ContactInfoEJB implementation. All attributes are present
      in both the local interface and the DTO class with consistent naming.
      This is declared in multiple independent layers (ejb-jar.xml, Java
      interfaces, implementation class).
    risk_class: operational
    basis: >
      ContactInfoEJB declares four CMP fields (familyName, givenName, telephone,
      email) and one CMR field (address). ContactInfoLocal interface exposes
      getters and setters. ContactInfo DTO class mirrors all fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 46
        line_end: 84
        excerpt: |
          <entity>
            <display-name>ContactInfoEB</display-name>
            <ejb-name>ContactInfoEJB</ejb-name>
            ...
            <cmp-field>
              <field-name>familyName</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>givenName</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>telephone</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>email</field-name>
            </cmp-field>
          </entity>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 52
        line_end: 73
        excerpt: |
          public abstract class ContactInfoEJB implements javax.ejb.EntityBean {
            public abstract String getFamilyName();
            public abstract void setFamilyName(String familyName);
            public abstract String getGivenName();
            public abstract void setGivenName(String givenName);
            public abstract String getTelephone();
            public abstract void setTelephone(String telephone);
            public abstract String getEmail();
            public abstract void setEmail(String email);
            public abstract AddressLocal getAddress();
            public abstract void setAddress(AddressLocal address);
          }

