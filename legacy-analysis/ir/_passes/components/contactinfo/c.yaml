  - record_key: CUSTMGMT-DATAACCESS-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL provide a getData() method on ContactInfo that returns a complete ContactInfo value object populated with current entity state, including all fields and the associated Address data.
    confidence: high
    confidence_basis: >
      getData() is implemented as a public method on ContactInfoEJB (lines 129-137) and exposed in the ContactInfoLocal interface (line 60). It is called from external code to retrieve a snapshot of the entity. The implementation collects all CMP and CMR fields into a value object, with explicit calls to getAddress().getData() to retrieve nested Address data. The method is transactionally protected (trans-attribute Required).
    risk_class: operational
    basis: >
      ContactInfoEJB implements a public method getData() (lines 129-137) that instantiates a new ContactInfo value object and populates it by calling getGivenName(), getFamilyName(), getTelephone(), getEmail(), and getAddress().getData() (line 135). ContactInfoLocal interface declares this method as public (line 60). The ejb-jar.xml assembly descriptor includes a container-transaction entry for getData (lines 422-430) specifying trans-attribute "Required".
