    requirement: >
      The system SHALL store contact information for a customer comprising given name, family name, telephone, email, and an associated address.
    confidence: high
    confidence_basis: >
      ContactInfo is declared as a CMP 2.x entity bean in ejb-jar.xml with concrete CMP fields for each attribute. The structure is enforced across three independent sources: the ejb-jar.xml descriptor defining fields, the ContactInfoEJB implementation class defining getters/setters, and the ContactInfo.dtd XML schema. All three corroborate the same four text fields plus an Address CMR field.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a ContactInfoEJB entity with abstract schema name "ContactInfo" (line 56) using CMP version 2.x (line 55). Four CMP fields are declared: telephone (line 59), familyName (line 63), email (line 67), givenName (line 71). A CMR field address (line 136) references AddressEJB with a 1-to-1 relationship and cascade delete (line 142). ContactInfoEJB.java implements getter/setter abstract methods for these fields (lines 59-73). ContactInfo.dtd requires a ContactInfo element containing FamilyName, GivenName, Address, Email, and Phone in that order (line 38).
