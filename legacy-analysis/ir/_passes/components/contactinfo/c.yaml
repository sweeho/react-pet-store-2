  - record_key: CUSTMGMT-ACCESS-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL allow all principals to access all ContactInfo and Address operations without role-based authorization checks.
    confidence: high
    confidence_basis: >
      The method-permission assembly descriptor entry is explicit and unambiguous: every method in ContactInfoEJB and AddressEJB is marked with <unchecked /> (line 151), which means no authentication or authorization is enforced by the container. This is a deliberate architectural choice, not a default. Whether this is correct for a customer system is a separate business question.
    risk_class: operational
    basis: >
      ejb-jar.xml contains a single method-permission block with <unchecked /> element (line 151) applying to all 30 ContactInfoEJB and AddressEJB methods (lines 152-289). The unchecked permission means the container does not enforce any role-based access control for these methods.
