  - record_key: CUSTMGMT-RELSHIP-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a one-to-one relationship between ContactInfo and Address, such that each ContactInfo record has exactly one associated Address, and deletion of the Address SHALL cascade to remove the ContactInfo.
    confidence: high
    confidence_basis: >
      The relationship is declared with explicit cardinality and cascade semantics in ejb-jar.xml. The ContactInfoEJB implementation explicitly manages this relationship through setAddress/getAddress methods. The cascading delete is an architectural invariant that prevents orphaned contact records when an address is deleted, matching typical data integrity patterns in customer management systems.
    risk_class: operational
    basis: >
      ejb-jar.xml defines an ejb-relation with two roles. The ContactInfoEJB role has multiplicity "One" and owns a CMR field named "address" (line 136). The AddressEJB role also has multiplicity "One" and includes a cascade-delete element (line 142). ContactInfoEJB.java implements abstract methods getAddress() and setAddress(AddressLocal address) (lines 72-73) to access this CMR field. The cascade-delete ensures that when an Address record is removed, its associated ContactInfo is also removed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 126
        line_end: 148
        excerpt: |
          <relationships>
            <ejb-relation>
              <ejb-relation-name></ejb-relation-name>
              <ejb-relationship-role>
                <ejb-relationship-role-name>ContactInfoEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <relationship-role-source>
                  <ejb-name>ContactInfoEJB</ejb-name>
                </relationship-role-source>
                <cmr-field>
                  <cmr-field-name>address</cmr-field-name>
                </cmr-field>
              </ejb-relationship-role>
              <ejb-relationship-role>
                <ejb-relationship-role-name>AddressEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <cascade-delete />
                <relationship-role-source>
                  <ejb-name>AddressEJB</ejb-name>
                </relationship-role-source>
              </ejb-relationship-role>
            </ejb-relation>
          </relationships>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 72
        line_end: 73
        excerpt: |
          public abstract AddressLocal getAddress();
          public abstract void setAddress(AddressLocal address);
    stack_metadata:
      ejb.relationship: 1-to-1
      ejb.cascade_delete: "true"

  - record_key: CUSTMGMT-LIFECYCLE-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      The system SHALL support three creation paths for ContactInfo: (1) creation with no arguments, which SHALL create an empty ContactInfo with a new empty Address; (2) creation with givenName, familyName, telephone, email, and an existing Address instance; and (3) creation with a ContactInfo value object, which SHALL create a new Address from the address data in that object.
    confidence: medium
    confidence_basis: >
      Three distinct create methods are declared in ContactInfoLocalHome and implemented in ContactInfoEJB with ejbCreate/ejbPostCreate pairs. The implementation is clear and unambiguous in code, but the requirement lacks external validation (e.g., configuration or a test that exercises all three paths). The post-create behavior for creating new Address instances via ServiceLocator is in code only, with no declarative specification.
    risk_class: operational
    basis: >
      ContactInfoLocalHome.java declares three overloaded create methods: no-arg (line 47), parameterized with four strings and AddressLocal (lines 49-50), and value-object taking ContactInfo (line 52). ContactInfoEJB.java implements corresponding ejbCreate methods (lines 77-127) with matching ejbPostCreate hooks. The no-arg create (line 77-79) returns null, delegating to ejbPostCreate (lines 81-91) which uses ServiceLocator to create a new Address via AddressLocalHome. The parameterized create (lines 93-107) accepts an existing AddressLocal. The value-object create (lines 109-127) creates a new Address from contactInfo.getAddress() data (line 122).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 45
        line_end: 55
        excerpt: |
          public interface ContactInfoLocalHome extends javax.ejb.EJBLocalHome {

            public ContactInfoLocal create() throws CreateException;

            public ContactInfoLocal create(String givenName, String familyName,
                                           String telephone, String email, AddressLocal address) throws CreateException;

            public ContactInfoLocal create(ContactInfo contactInfo) throws CreateException;

            public ContactInfoLocal findByPrimaryKey(Object key) throws FinderException;
          }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 77
        line_end: 127
        excerpt: |
          public Object ejbCreate () throws CreateException {
            return null;
          }

          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }

          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
                                  throws CreateException {
            setGivenName(givenName);
            setFamilyName(familyName);
            setTelephone(telephone);
            setEmail(email);
            return null;
          }

          public void ejbPostCreate(String givenName, String familyName,
                                    String telephone, String email,
                                    AddressLocal address) throws CreateException {
            setAddress(address);
          }

          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
    stack_metadata:
      ejb.lifecycle: create
      service_locator: used

  - record_key: CUSTMGMT-PERSIST-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL persist contact information using EJB 2.x container-managed persistence (CMP) with required transaction support on all data access operations.
    confidence: high
    confidence_basis: >
      CMP 2.x is explicitly declared as the persistence mechanism in ejb-jar.xml. The container-transaction declarations are exhaustive, applying "Required" attribute to all 30 operations (getter, setter, finder, creator methods), establishing a uniform transactional contract. This is a declarative, architectural choice, not an implementation detail—the container enforces it.
    risk_class: operational
    basis: >
      ejb-jar.xml declares persistence-type "Container" (line 52) and cmp-version "2.x" (line 55). The assembly-descriptor contains 30 container-transaction entries (lines 291-456), each specifying trans-attribute "Required" for all ContactInfoEJB and AddressEJB methods including getFamilyName, setFamilyName, getEmail, setEmail, getTelephone, setTelephone, setAddress, getAddress, getData, create, and findByPrimaryKey variants.
