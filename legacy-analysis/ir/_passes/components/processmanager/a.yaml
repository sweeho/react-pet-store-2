records:
  - record_key: ORF-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL manage an order fulfillment state machine with five possible states:
      PENDING (initial), APPROVED, DENIED, SHIPPED_PART (partial shipment), and COMPLETED
      (full shipment).
    confidence: high
    confidence_basis: >
      Five status constants are explicitly declared and documented in OrderStatusNames.java.
      The state machine is implemented as an entity bean with status as a stored field, enforced
      at the database level. Documentation in the code clearly outlines the legal state transitions.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines the five status constants with javadoc explaining the
      state machine: "pending->approved->shippedPart->completed or pending->denied"
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 40
        line_end: 67
        excerpt: |
          This class is the central location to store the names of the
          status that an order can be in.
          The states an order goes through are:
          pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
          pending->denied
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 46
        line_end: 80
        excerpt: |
          <entity>
            <display-name>ManagerEB</display-name>
            <ejb-name>ManagerEJB</ejb-name>
            <cmp-field>
              <field-name>status</field-name>
            </cmp-field>
    stack_metadata:
      ejb.bean: ManagerEJB
      db.object: Manager (CMP entity)

  - record_key: ORF-WORKFLOW-0002
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL transition an order to PENDING status when a purchase order is
      received from the customer.
    confidence: high
    confidence_basis: >
      Both pass A and the PurchaseOrderMDB implementation show the same pattern:
      createManager is called with PENDING status when a new order arrives. This is
      enforced by the MDB before any other processing occurs.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.doWork() explicitly calls createManager(orderId, PENDING)
      immediately upon receiving a purchase order message, making this the initiating state.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 157
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: ORF-WORKFLOW-0003
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support two approval paths: (A) automatic approval for orders
      below a locale-specific monetary threshold, or (B) wait for admin approval/denial
      via administrator interface.
    confidence: medium
    confidence_basis: >
      The automatic approval logic is clearly implemented in PurchaseOrderMDB.canIApprove()
      with specific thresholds ($500 USD, ¥50000 JPY). However, the admin approval path
      is implied through the workflow design but not directly visible in processmanager
      source—it is implemented in the OPC admin components.
    risk_class: operational
    basis: >
      PurchaseOrderMDB implements automatic approval for small orders using locale-specific
      thresholds. Large orders bypass this logic and implicitly await admin intervention,
      which is handled by the OPCAdminFacadeEJB in a separate layer.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 158
        line_end: 165
        excerpt: |
          if(canIApprove(purchaseOrder)) {
            ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
            OrderApproval oa = new OrderApproval();
            oa.addOrder(co);
            ret = oa.toXML();
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: ORF-WORKFLOW-0004
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL only allow status updates to orders currently in PENDING state.
      Orders that have already transitioned to APPROVED, DENIED, or COMPLETED states
      SHALL NOT be re-processed.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB explicitly checks the current status before allowing any update.
      The condition is enforced in a tight loop that skips any order not in PENDING state.
      This is a critical business rule to prevent double-processing.
    risk_class: financial
    basis: >
      OrderApprovalMDB.doWork() checks the current status from ProcessManager and
      continues (skips) the iteration if status is not PENDING. This prevents re-approval
      or re-denial of already-processed orders.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  - record_key: ORF-WORKFLOW-0005
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide an operation to retrieve all orders in a given status
      for administrative query and reporting purposes.
    confidence: high
    confidence_basis: >
      The getOrdersByStatus operation is declared in both the session bean and entity
      home interface, with a corresponding EJB-QL query defined in ejb-jar.xml. This
      is a persistent, declaratively defined feature used for admin operations.
    risk_class: operational
    basis: >
      ProcessManagerLocal.getOrdersByStatus() invokes ManagerLocalHome.findOrdersByStatus().
      The ejb-jar.xml declares the EJB-QL query that retrieves all Manager entities
      matching a given status value.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerLocal.java
        line_start: 63
        line_end: 63
        excerpt: |
          public Collection getOrdersByStatus(String status) throws FinderException;
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>
    stack_metadata:
