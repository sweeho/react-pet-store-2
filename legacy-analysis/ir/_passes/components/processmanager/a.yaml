      db.object: Manager

  - record_key: ORF-ENTITY-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL maintain an Order workflow entity with orderId as the unique
      identifier and status as the mutable state field. Entity access SHALL be
      transactional with REQUIRED isolation.
    confidence: high
    confidence_basis: >
      The ManagerEJB is a CMP 2.x entity bean with orderId as primkey-field and status
      as a CMP field. All methods are declared with trans-attribute Required, enforcing
      ACID guarantees. This is declaratively enforced by the container.
    risk_class: financial
    basis: >
      ejb-jar.xml declares ManagerEJB as a CMP entity with orderId as primary key and
      status as a persistent field. All container-transaction declarations specify
      trans-attribute Required for both home and local interface methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 46
        line_end: 80
        excerpt: |
          <entity>
            <display-name>ManagerEB</display-name>
            <ejb-name>ManagerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Manager</abstract-schema-name>
            <cmp-field>
              <field-name>status</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>orderId</field-name>
            </cmp-field>
            <primkey-field>orderId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 263
        line_end: 273
        excerpt: |
          <container-transaction>
            <method>
