  - record_key: ORF-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN an order is in PENDING status AND admin approves it,
      THEN the status SHALL transition to APPROVED.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB shows the approval path: it reads ChangedOrder messages with
      status APPROVED and calls updateStatus with that value. The status update only
      occurs for PENDING orders. Multiple traces confirm this bidirectional behavior.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() handles OrderApproval messages and transitions orders
      by calling processManager.updateStatus() with the new status from the approval message.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  - record_key: ORF-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN an order is in PENDING status AND admin denies it,
      THEN the status SHALL transition to DENIED.
    confidence: high
    confidence_basis: >
      The same OrderApprovalMDB flow handles denial: the ChangedOrder may contain
      DENIED status. The updateStatus call passes whatever status is provided in the
      OrderApproval message. The code does not distinguish approval from denial at
      the processmanager level.
    risk_class: operational
    basis: >
      OrderApprovalMDB processes OrderApproval messages that may contain either APPROVED
      or DENIED status in the ChangedOrder objects. The processManager.updateStatus()
      call is status-agnostic, accepting any valid status value.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 185
        line_end: 228
        excerpt: |
          private WorkResult doWork(String xmlMessage) throws XMLDocumentException, FinderException  {
            ArrayList supplierPoList = new ArrayList();
            PurchaseOrderLocal po = null;
            OrderApproval approval = null;
            approval = OrderApproval.fromXML(xmlMessage, entityCatalogURL, validateXmlOrderApproval);
            OrderApproval oaMailList = new OrderApproval();
            String xmlMailOrderApprovals = null;
            Collection coll = approval.getOrdersList();
            Iterator it = coll.iterator();
            while(it!= null && it.hasNext()) {
              ChangedOrder co = (ChangedOrder) it.next();
              String curStatus = processManager.getStatus(co.getOrderId());
              if(!curStatus.equals(OrderStatusNames.PENDING)) {
                continue;
              }
              oaMailList.addOrder(co);
              processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  - record_key: ORF-INTEGRATION-0001
