  - record_key: order-fulfillment-approval-gate-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL only permit transitions from PENDING to approval states
      (APPROVED or DENIED). Orders that are already in APPROVED, DENIED, or
      COMPLETED states SHALL NOT be re-processed or have their status changed
      by subsequent approval messages.
    confidence: high
    confidence_basis: >
      The guard is explicitly coded in OrderApprovalMDB.java (lines 204-206),
      checking current status before allowing update. The implementation reads
      current status, verifies it is PENDING, and skips processing if not. This
      is a single source of enforcement in the business logic; no declarative
      constraint enforces it. The status enum design and constant usage across
      all call sites support this. The guard prevents duplicate processing from
      idempotent message delivery.
    risk_class: operational
    basis: >
      OrderApprovalMDB.java (lines 199-224) iterates over approval list.
      At line 204: "String curStatus = processManager.getStatus(co.getOrderId());".
      At lines 205-206: "if(!curStatus.equals(OrderStatusNames.PENDING)) {
      continue; }" — only PENDING orders are eligible for approval/denial
      transitions. Comment at lines 201-203 states the rule explicitly:
      "only PENDING orders can be updated. if order already APPROVED or DENIED
      or COMPLETED, then order already processed so dont process again".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  - record_key: order-fulfillment-shipment-states-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      Orders transitioning from APPROVED SHALL be marked as SHIPPED_PART or
      COMPLETED based on partial or full fulfillment of line items as tracked
      in invoices. An order is COMPLETED when all line items have been shipped;
      it is SHIPPED_PART when some but not all items remain unfulfilled.
    confidence: medium
    confidence_basis: >
      InvoiceMDB implements the logic (lines 157-173) calling a PurchaseOrderHelper
      to determine order completion status. The requirement is inferred from
      code logic rather than explicit documentation; there is no separate
      specification of when each state applies. The code path is single-source
      (only InvoiceMDB transitions to these states) and no declarative constraint
      enforces the completion logic. A second pass would need to reverse-engineer
      the same logic from the same MDB to agree.
    risk_class: operational
    basis: >
      InvoiceMDB.java (lines 157-173). Line 162: "boolean orderDone =
      poHelper.processInvoice(po, invoiceXDE.getLineItemIds());". Lines 166-171:
      "if(orderDone) { processManager.updateStatus(..., OrderStatusNames.COMPLETED);
      } else { processManager.updateStatus(..., OrderStatusNames.SHIPPED_PART); }".
      The processInvoice method (not in processmanager component, in purchase order
      helper) determines the boolean; the MDB uses it to select the status. Comments
      at lines 149-150 and 164-165 indicate the intent but do not fully specify
      the completion criteria.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 108
        line_end: 173
        excerpt: |
          /**
           * InvoiceMDB receives a JMS message containing an Invoice
           * for a user order. If all the order items have been shipped
           * for the order, it updates the purchase order status to
           * COMPLETED to end the purchase order fulfillment process.
           * If the order is not yet all shipped, it updates the order
           * status based on the invoice.
           *
           * @param recvMsg is the JMS message contaning the xml content for the invoice
           */
          public void onMessage(Message recvMsg) {
            // ...
            String joinMessage = doWork(recdText);
            // ...
          }
          /**
           * update POEJB to reflect items shipped, and also update Process Manager
           * to completed or partially completed status based on  the items shipped
           * in the order's invoice. If the join condition is met and all items are
           * shipped, then send an order completed message to user
           */
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            //update process manager if this order is completely done, or partially done
            //for this purchase order
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB

  - record_key: order-fulfillment-auto-approval-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      Orders below a locale-specific price threshold SHALL be automatically
      approved without requiring manual administrator review. GIVEN a purchase
      order in the US locale WHEN its total price is less than 500 currency
      units THEN the order SHALL be automatically approved. GIVEN a purchase
      order in the Japan locale WHEN its total price is less than 50000 currency
      units THEN the order SHALL be automatically approved. GIVEN a purchase
      order in any other locale or exceeding its threshold THEN the order SHALL
      require manual administrator approval.
    confidence: low
    confidence_basis: >
      The thresholds 500 and 50000 are bare numeric literals in the canIApprove
      method with no configuration, no test, and no comment explaining the
      currency or business rationale. The locales are hard-coded Java Locale.US
      and Locale.JAPAN comparisons. No test case or configuration file validates
      these values. A second extraction might identify these same values from the
      same code but would be uncertain whether they are active rules or obsolete
      demo scaffolding. The low confidence reflects that no authoritative source
      document or verified deployment context confirms these thresholds are
      currently enforced in production.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.java (lines 178-191) defines canIApprove method:
      "private boolean canIApprove(PurchaseOrder purchaseOrder) {
      Locale locale = purchaseOrder.getLocale();
      if (locale.equals(Locale.US)) {
        if (purchaseOrder.getTotalPrice() < 500) return true;
      } else if (locale.equals(Locale.JAPAN))  {
        if (purchaseOrder.getTotalPrice() < 50000) return true;
      }
      return false;
      }". Comment at lines 179-180 states "Just a stub for converting currency.
      This method is used for demonstrating the petstore, so that smaller orders
      can flow through the system without having to fire up the admin Gui to
      approve orders" — indicating this may be a demo-only feature.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 178
        line_end: 191
        excerpt: |
          /**
           * Just a stub for converting currency. This method is used for
           * demonstrating the petstore, so that smaller orders can flow through
           * the system without having to fire up the admin Gui to approve orders
           */
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: order-fulfillment-txn-isolation-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      All order status reads and writes SHALL execute within transactional
      boundaries with isolation and atomicity guarantees. Container-managed
      transactions with Required propagation SHALL wrap every operation that
      accesses order status.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declaratively specifies container-transaction Required for
      all ManagerEJB and ProcessManagerEJB methods. The Required attribute
      means the container will create a new transaction if none exists and
      commit on successful method return. This is enforced by two independent
      mechanisms: the EJB container's transaction interceptor and the database
      ACID properties. No code relies on application-managed transactions.
    risk_class: operational
    basis: >
      ejb-jar.xml (lines 262-390) contain 16 container-transaction declarations,
      each specifying trans-attribute Required for ManagerEJB and ProcessManagerEJB
      methods. Representative examples: lines 265-272 for ManagerEJB.create
      (Required), lines 274-281 for ManagerEJB.getStatus (Required), lines 347-355
      for ProcessManagerEJB.createManager (Required), lines 358-367 for
      ProcessManagerEJB.updateStatus (Required). No method omits transaction
      declaration, and no method uses Supports or RequiresNew.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 262
        line_end: 280
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ManagerEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
            <method>
              <ejb-name>ManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getStatus</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.transaction: Required

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
    description: >
      The completion criteria for SHIPPED_PART vs. COMPLETED states is defined
      in PurchaseOrderHelper.processInvoice(), which is outside the processmanager
      component. The processmanager module accepts the boolean orderDone result
      but does not encode the business logic for what constitutes completion.
      A human reviewer should verify whether the line-item fulfillment logic
      in PurchaseOrderHelper is the authoritative source for this rule or whether
      a separate requirement exists.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The canIApprove method includes a comment stating "Just a stub for
      demonstrating the petstore" (line 179), suggesting automatic approval
      thresholds may be a demo-only feature. No corresponding deployment
      configuration, feature flag, or test indicates whether this is active
      in production or disabled. A human should verify the production status
      of automatic approval before encoding it in a forward design.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions
    description: >
      The TransitionDelegate interface and TransitionDelegateFactory define an
      extension point for workflow state-change actions (sending notifications,
      invoking external services). The processmanager component itself does not
      implement concrete delegates; these are implemented in the OPC app
      (MailInvoiceTransitionDelegate, MailOrderApprovalTransitionDelegate).
      The coupling between status updates and transition actions cannot be
      determined from the processmanager source alone. A requirement should be
      raised to document which state transitions trigger which actions.
