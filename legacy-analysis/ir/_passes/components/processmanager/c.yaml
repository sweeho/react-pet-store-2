records:
  - record_key: order-fulfillment-entity-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL maintain an order management entity that tracks each order
      through its fulfillment workflow, persisting the order identifier and current
      status in a persistent store accessible by transactional components.
    confidence: high
    confidence_basis: >
      The ManagerEJB is a CMP (Container-Managed Persistence) entity bean with
      explicit schema definition in ejb-jar.xml, declaring orderId as primary key
      and status as a persistent field. The ejb-jar.xml includes explicit
      container-transaction declarations marking create, findByPrimaryKey,
      findOrdersByStatus, and status accessor methods as Required, indicating
      data consistency requirements. This is enforced in two independent places:
      the ORM layer (CMP) and the transaction layer (declarative).
    risk_class: operational
    basis: >
      ManagerEJB class (lines 49-88) defines abstract getters/setters for
      orderId and status fields. ejb-jar.xml (lines 46-80) declares the
      ManagerEJB entity with cmp-version 2.x, abstract-schema-name Manager,
      primkey-field orderId, and two cmp-field declarations for status and
      orderId. Container-transaction blocks (lines 262-344) mark all data
      access methods as Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerEJB.java
        line_start: 49
        line_end: 88
        excerpt: |
          public abstract class ManagerEJB implements EntityBean {
            // CMP fields
            public abstract String getOrderId();
            public abstract void setOrderId(String orderId);
            public abstract String getStatus();
            public abstract void setStatus(String status);
            public String ejbCreate(String orderId, String status) throws CreateException {
              setOrderId(orderId);
              setStatus(status);
              return null;
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
