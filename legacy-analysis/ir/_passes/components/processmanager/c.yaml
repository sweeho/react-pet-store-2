  - record_key: order-fulfillment-workflow-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support an order fulfillment workflow with defined
      status transitions: PENDING→APPROVED→SHIPPED_PART→COMPLETED, and
      PENDING→DENIED. Orders begin in PENDING status when created and
      progress through intermediate states as fulfillment steps are completed.
      A DENIED order exits the workflow without progressing further.
    confidence: high
    confidence_basis: >
      OrderStatusNames.java explicitly documents the five status constants and
      the two valid paths. Code flow analysis across three MDBs (PurchaseOrderMDB,
      OrderApprovalMDB, InvoiceMDB) shows each status is assigned at specific
      lifecycle points with no invalid transitions. The enum-like status constant
      design (static final strings) enforces values; all updateStatus calls use
      these constants. Two passes would both identify these five states from the
      same source.
    risk_class: operational
    basis: >
      OrderStatusNames.java (lines 41-67) defines constants: PENDING, APPROVED,
      DENIED, SHIPPED_PART, COMPLETED. Comment at lines 44-46 states:
      "pending->approved->shippedPart(shipped part of order)->completed(whole
      order shipped) or pending->denied". PurchaseOrderMDB.java (line 156)
      creates manager in PENDING. OrderApprovalMDB.java (line 216) transitions
      to APPROVED or DENIED based on approval message. InvoiceMDB.java (lines
      167, 170) transitions to COMPLETED or SHIPPED_PART based on invoice data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 67
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {
            /** for orders that have been placed but not yet approved */
            public static final String PENDING = "PENDING";
            /** for orders that have been approved */
            public  static final String APPROVED = "APPROVED";
            /** for orders that have been denied */
            public  static final String DENIED = "DENIED";
            /** for orders that have been partially completed*/
            public  static final String SHIPPED_PART = "SHIPPED_PART";
            /** for orders that have been completed*/
            public  static final String COMPLETED = "COMPLETED";
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            //update process manager for this purchase order workflow
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            //for all approved orders, send a PO to supplier
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }//end while
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            //update process manager if this order is completely done, or partially done
            //for this purchase order
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB

  - record_key: order-fulfillment-status-query-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide a query to retrieve all orders in a given status
      to support administrative reporting and order fulfillment tracking. The
      query result returns a collection of order identifiers and status values.
    confidence: high
    confidence_basis: >
      findOrdersByStatus is declared both in the ejb-jar.xml query element and
      implemented in two layers: the local home interface (ManagerLocalHome)
      and the ProcessManagerEJB facade. The ejb-jar.xml uses EJB-QL to specify
      the query semantics. OPCAdminFacadeEJB demonstrates usage in a
      production-grade admin facility, calling getOrdersByStatus and iterating
      over Manager beans to fetch order details. Two independent implementations
      (bean home and session facade) corroborate this requirement.
    risk_class: operational
    basis: >
      ejb-jar.xml (lines 70-79) declares a query for ManagerEJB
      findOrdersByStatus with parameter java.lang.String and EJB-QL
      "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1".
      ManagerLocalHome.java (line 55) defines the finder method signature.
      ProcessManagerEJB.java (lines 89-91) wraps it as a session bean method.
      OPCAdminFacadeEJB.java (lines 131-150) calls getOrdersByStatus and
      iterates results to build admin reports with order details.
    traces:
