    description: >
      The addLineItem() method on line 144 directly adds to getLineItems() without
      any bounds checking, uniqueness validation, or duplicate detection. The contract
      does not state whether a LineItem can be added multiple times or whether there
      are constraints on the collection size. Additionally, line 175 in ejbPostCreate()
      uses a null check (it != null) which suggests the Iterator from getLineItems()
      could be null, but this contradicts line 193 which suggests getLineItems() returns
      a non-null Collection. The nullability contract for the lineItems CMR field is ambiguous.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: >
      The getAllItems() method (lines 192-203) is documented as required
      "because web tier cannot access CMR fields that return managed objects
      without a transaction" (lines 187-189). However, the actual implementation
      simply iterates over the CMR field getLineItems() and collects data.
      This comment suggests a broader architectural constraint about CMR access
      patterns that is not enforceable from this module alone. The exact transaction
      scope and web-tier visibility requirements cannot be determined from the
      SupplierOrder module in isolation and may conflict with assumptions made
      by calling code.
