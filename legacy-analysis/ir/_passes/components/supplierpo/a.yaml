    capability_key: supplier-management
    requirement: >
      The system SHALL store SupplierOrder with a one-to-many relationship to LineItem entities.
      Each SupplierOrder SHALL have one or more LineItems. Each LineItem SHALL reference a
      categoryId, productId, itemId, lineNumber, quantity, unitPrice, and quantityShipped.
    confidence: high
    confidence_basis: >
      The one-to-many relationship is explicitly declared in ejb-jar.xml lines 289-314 as
      an ejb-relation between SupplierOrderEJB and LineItemEJB with multiplicity settings.
      The LineItem CMP fields are declared in lines 200-224. The SupplierOrderEJB exposes
      the relationship via getLineItems() (line 131) and addLineItem() (line 143).
    risk_class: operational
    basis: >
      ejb-jar.xml lines 289-314 define the one-to-many relationship "SupplierOrder-LineItem"
      with cascade-delete (line 305). LineItemEJB is defined in lines 187-224 with seven CMP fields.
      SupplierOrderEJB.java lines 131-145 implement getLineItems() and addLineItem() methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 289
        line_end: 314
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-LineItem</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-lineitems</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
