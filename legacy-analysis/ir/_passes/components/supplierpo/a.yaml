  - record_key: SUPPLIER-ENTITY-0001
    kind: entity
    capability_key: supplier-management
    requirement: >
      The system SHALL persist a SupplierOrder entity with the following mandatory fields:
      orderId (String, unique identifier), orderDate (timestamp), and orderStatus (String).
    confidence: high
    confidence_basis: >
      The entity is declared in ejb-jar.xml as a CMP entity bean with three abstract CMP fields
      (poId, poDate, poStatus). Both the SupplierOrderEJB implementation (lines 81-113) and the
      SupplierOrderLocal interface (lines 56-58) confirm these fields. The schema uses String
      for poId as primary key (line 56 ejb-jar.xml) and abstract accessor methods are defined
      in the EJB (lines 81-113).
    risk_class: operational
    basis: >
      ejb-jar.xml lines 48-105 declare SupplierOrderEJB as a CMP entity bean with three CMP
      fields. SupplierOrderEJB.java lines 81-113 define accessor methods for poId, poDate,
      and poStatus. SupplierOrderLocal.java lines 56-58 expose these as public contract methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 60
        line_end: 68
        excerpt: |
          <cmp-field>
            <field-name>poId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poDate</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poStatus</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 81
        line_end: 113
        excerpt: |
          public abstract String getPoId();
          public abstract void setPoId(String id);
          public abstract long getPoDate();
          public abstract void setPoDate(long orderDate);
          public abstract String getPoStatus();
          public abstract void setPoStatus(String stat);
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      db.object: SupplierOrder (CMP entity)
      cmp_version: "2.x"

  - record_key: SUPPLIER-ENTITY-0002
