  - record_key: SUPPLIER-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-management
    requirement: >
      The system SHALL support a SupplierOrder workflow with four distinct status states:
      PENDING, APPROVED, DENIED, and COMPLETED. A SupplierOrder SHALL transition through
      one of two paths: PENDING -> APPROVED -> COMPLETED, or PENDING -> DENIED.
    confidence: high
    confidence_basis: >
      All four status constants are defined and documented in OrderStatusNames.java lines 41-62.
      The comment at lines 44-46 explicitly defines the valid state transitions. SupplierOrderEJB
      initializes new orders to PENDING status (line 154). The setPoStatus() method (lines 113)
      allows status changes. Both the interface and implementation confirm these states exist
      and are meant to be managed.
    risk_class: operational
    basis: >
      OrderStatusNames.java lines 50-60 define the four status constants PENDING, APPROVED,
      DENIED, and COMPLETED. The class comment at lines 44-46 describes the workflow paths.
      SupplierOrderEJB.java line 154 sets initial status to PENDING in ejbCreate().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 62
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required
      field: poStatus

  - record_key: SUPPLIER-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      When creating a SupplierOrder, the system SHALL instantiate one ContactInfo object
      (containing shipping information) and add it to the SupplierOrder in a single transaction.
      The ContactInfo SHALL be deleted when its associated SupplierOrder is removed.
    confidence: high
    confidence_basis: >
      The ejbPostCreate() method (lines 162-184) contains the creation logic that creates
      and associates a ContactInfo instance. The cascade-delete configuration in ejb-jar.xml
      line 249 enforces deletion when the parent is removed. Both are enforced by the container.
      This is a declarative relationship with transactional guarantees.
    risk_class: operational
    basis: >
      SupplierOrderEJB.java lines 162-184 implement ejbPostCreate(), which calls
      contactInforef.create(supplierOrder.getShippingInfo()) and setContactInfo().
      ejb-jar.xml lines 246-250 declare cascade-delete on the ContactInfo relationship.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 184
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                            throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 246
        line_end: 258
        excerpt: |
          <ejb-relationship-role>
            <ejb-relationship-role-name>address-for-purchaseorder</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <cascade-delete />
            <relationship-role-source>
              <ejb-name>ContactInfoEJB</ejb-name>
            </relationship-role-source>
    stack_metadata:
      ejb.bean: SupplierOrderEJB, ContactInfoEJB
      ejb.transaction: Required
      service_locator: "true"

