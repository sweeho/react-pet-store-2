  - record_key: SUPPLIER-MGMT-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-management
    requirement: >
      Supplier purchase orders SHALL follow a state machine with states:
      PENDING (initial) → (APPROVED | DENIED) → COMPLETED
    confidence: high
    confidence_basis: >
      OrderStatusNames.java explicitly documents the complete state machine with
      comments, and the four status constants (PENDING, APPROVED, DENIED, COMPLETED)
      are enforced as the only allowed values via the constants used throughout the code.
      The setPoStatus method in the EJB allows transitions.
    risk_class: operational
    basis: >
      OrderStatusNames.java lines 44-46 explicitly document the order state machine:
      "The states an order goes through are: pending->approved->completed or pending->denied".
      The class defines exactly four status constants (PENDING, APPROVED, DENIED, COMPLETED)
      and their usage is mandated throughout the system.
      SupplierOrderEJB.ejbCreate() initializes new POs to PENDING status (line 154).
      setPoStatus() method allows state transitions.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 61
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;

