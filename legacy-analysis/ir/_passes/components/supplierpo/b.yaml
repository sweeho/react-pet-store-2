      applies to every method in the component.
    risk_class: financial
    basis: >
      ejb-jar.xml defines container-transaction entries for all SupplierOrderEJB methods
      with trans-attribute=Required (examples at lines 356, 365, 374, etc.), mandating
      that every method runs within a transaction context. The assembly-descriptor
      covers all methods including create, find, getters, setters, and business methods.
