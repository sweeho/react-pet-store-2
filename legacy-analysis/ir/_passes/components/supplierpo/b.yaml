  - record_key: SUPPLIER-MGMT-ACCESS-0001
    kind: requirement
    capability_key: supplier-management
    requirement: >
      Supplier purchase order data access SHALL be restricted to local EJB access only
      (no remote access), limiting access to in-process components within the same application tier.
    confidence: high
    confidence_basis: >
      The SupplierOrderEJB declares only a local-home and local interface, with no remote
      interface defined. This is an explicit architectural constraint in the EJB definition.
    risk_class: operational
    basis: >
      ejb-jar.xml at lines 52-53 defines only local-home and local interfaces:
      "com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocalHome" and
      "com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocal".
      There is no remote-home or remote interface defined, restricting access to
      collocated EJB clients only.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 55
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <display-name>SupplierOrderEB</display-name>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderEJB</ejb-class>

