  - record_key: SUPPLIER-MGMT-REL-0001
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      Every supplier purchase order SHALL have exactly one shipping contact that includes
      shipping address information, established at PO creation time.
    confidence: high
    confidence_basis: >
      The relationship is declared as 1:1 (multiplicity One) in ejb-jar.xml and enforced
      through cascade-delete, and the ejbPostCreate method mandatorily creates a
      ContactInfo record when a PO is created. The code enforces this invariant.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a one-to-one relationship "SupplierOrder-ContactInfo" with
      multiplicity One on both sides and cascade-delete on the ContactInfo side.
      SupplierOrderEJB.ejbPostCreate() method at line 164-170 creates and sets a
      ContactInfoLocal instance immediately upon PO creation via serviceLocator,
      making this a mandatory relationship.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 234
        line_end: 258
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-ContactInfo</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-address</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>contactInfo</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>address-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 170
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                      throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);

  - record_key: SUPPLIER-MGMT-REL-0002
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      Every supplier purchase order SHALL have one or more line items representing
      ordered products, established at PO creation time.
    confidence: high
    confidence_basis: >
      The 1:M relationship is declared as multiplicity One/Many in ejb-jar.xml.
      The DTD schema mandates LineItem+ (one or more). The ejbPostCreate method
      iterates through and creates a LineItemLocal for each supplied line item.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a one-to-many relationship "SupplierOrder-LineItem" with
      multiplicity One on PO side and Many on line item side. The DTD in SupplierOrder.dtd
      line 38 specifies "LineItem+" requiring at least one. SupplierOrderEJB.ejbPostCreate()
      at lines 171-179 iterates through supplied line items and creates LineItemLocal
      instances for each one.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
