records:
  - record_key: SUPPLIER-MGMT-ENTITY-0001
    kind: entity
    capability_key: supplier-management
    requirement: >
      The system SHALL represent a Supplier Purchase Order (PO) with a unique identifier (poId),
      order date, and status tracking for supplier coordination workflows.
    confidence: high
    confidence_basis: >
      SupplierOrderEJB is explicitly defined as a Container-Managed Persistence entity with
      primary key declaration and CMP fields clearly marked in both ejb-jar.xml and the EJB
      class itself. poId, poDate, and poStatus are all declared as abstract CMP fields.
    risk_class: operational
    basis: >
      ejb-jar.xml declares SupplierOrderEJB as a CMP entity with three CMP fields:
      poId (marked as primkey-field), poDate, and poStatus. The SupplierOrderEJB.java
      class provides abstract accessor methods for these fields, enforcing their presence
      in the persistent schema.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 105
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <display-name>SupplierOrderEB</display-name>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-field>
              <field-name>poId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poDate</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poStatus</field-name>
            </cmp-field>
            <primkey-field>poId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 73
        line_end: 113
        excerpt: |
          public abstract String getPoId();
          public abstract void setPoId(String id);
          public abstract long getPoDate();
          public abstract void setPoDate(long orderDate);
          public abstract String getPoStatus();
          public abstract void setPoStatus(String stat);

