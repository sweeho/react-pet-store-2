# EXTRACTED FROM LEGACY SOURCE — evidence of what exists, not a build target. Where this disagrees with a capability delta spec, the delta spec wins.

openapi: 3.0.0
info:
  title: Java Pet Store 1.3.2 Legacy API
  version: 1.3.2
  description: |
    OpenAPI specification extracted from the Java Pet Store 1.3.2 legacy application.
    This documents the implicit contracts of the existing J2EE/EJB system.
  contact:
    name: Legacy System
servers:
  - url: http://localhost:8080/petstore
    description: Local development server

tags:
  - name: Catalog
    description: Product catalog browsing and search
  - name: ShoppingCart
    description: Shopping cart management
  - name: Order
    description: Order placement and management
  - name: Payment
    description: Payment processing
  - name: Fulfillment
    description: Order fulfillment processing
  - name: Inventory
    description: Supplier inventory management
  - name: Notifications
    description: Email notifications
  - name: Admin
    description: Administrative operations

paths:
  /api/catalog/categories:
    get:
      tags:
        - Catalog
      summary: Get paginated list of categories
      operationId: getCategories
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: 0-based start position in result set
        - name: count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Page size (number of results to return)
        - name: locale
          in: query
          required: true
          schema:
            type: string
          description: Locale for category names/descriptions (e.g., en_US, ja_JP)
      responses:
        '200':
          description: Paginated list of categories ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          description: Invalid start position or count

  /api/catalog/categories/{categoryId}:
    get:
      tags:
        - Catalog
      summary: Get single category by ID
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
          description: Category ID
        - name: locale
          in: query
          required: true
          schema:
            type: string
          description: Locale for category name/description
      responses:
        '200':
          description: Category object with id, name, and description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found

  /api/catalog/products:
    get:
      tags:
        - Catalog
      summary: Get paginated products in a category
      operationId: getProducts
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            type: string
          description: Parent category ID
        - name: start
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: 0-based start position
        - name: count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Page size
        - name: locale
          in: query
          required: true
          schema:
            type: string
          description: Locale for product names/descriptions
      responses:
        '200':
          description: Paginated products ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /api/catalog/products/{productId}:
    get:
      tags:
        - Catalog
      summary: Get single product by ID
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /api/catalog/items:
    get:
      tags:
        - Catalog
      summary: Get paginated items in a product
      operationId: getItems
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
          description: Parent product ID
        - name: start
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: locale
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paginated items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'

  /api/catalog/items/{itemId}:
    get:
      tags:
        - Catalog
      summary: Get single item with all attributes
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item with all fields including category, productId, attributes, pricing, image reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found

  /api/catalog/search:
    get:
      tags:
        - Catalog
      summary: Full-text search items by keywords
      operationId: searchItems
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search keywords (space-separated); empty query returns EMPTY_PAGE
        - name: start
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: locale
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Paginated search results. Keywords are tokenized by whitespace and OR'd
            across product name, category ID, and item description via case-insensitive LIKE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'

  /api/cart/add:
    post:
      tags:
        - ShoppingCart
      summary: Add item to cart
      operationId: addItemToCart
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            type: string
        - name: quantity
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Item added to cart

  /api/cart/update:
    post:
      tags:
        - ShoppingCart
      summary: Update cart item quantity
      operationId: updateCartItemQuantity
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            type: string
        - name: quantity
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item quantity updated; if quantity <= 0, item is removed from cart

  /api/cart/remove:
    post:
      tags:
        - ShoppingCart
      summary: Remove item from cart
      operationId: deleteItemFromCart
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed from cart

  /api/cart/empty:
    post:
      tags:
        - ShoppingCart
      summary: Clear all items from cart
      operationId: emptyCart
      responses:
        '200':
          description: All items removed from cart

  /api/cart:
    get:
      tags:
        - ShoppingCart
      summary: Get cart contents
      operationId: getCart
      responses:
        '200':
          description: Cart with items, count, and subtotal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingCart'

  /api/orders:
    post:
      tags:
        - Order
      summary: Place a new order
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          description: Invalid order data or empty cart
        '402':
          description: Payment declined

  /api/orders/{orderId}:
    get:
      tags:
        - Order
      summary: Get order details
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details with line items and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          description: Order not found

  /api/payment/authorize:
    post:
      tags:
        - Payment
      summary: Authorize credit card payment
      operationId: authorizePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment authorized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Payment declined
        '400':
          description: Invalid card data

  /api/fulfillment/process:
    post:
      tags:
        - Fulfillment
      summary: Process order fulfillment (async via JMS)
      operationId: processOrderFulfillment
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: PurchaseOrder XML document
      responses:
        '202':
          description: Order received for fulfillment processing

  /api/inventory:
    get:
      tags:
        - Inventory
      summary: Get all inventory items
      operationId: getAllInventory
      responses:
        '200':
          description: List of all inventory items with quantities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'

  /api/inventory/update:
    post:
      tags:
        - Inventory
      summary: Update inventory quantities and reprocess pending orders
      operationId: updateInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 0
      responses:
        '200':
          description: Inventory updated; pending orders reprocessed; invoices sent
        '400':
          description: Invalid quantity (negative)

  /api/notifications/email:
    post:
      tags:
        - Notifications
      summary: Send email notification (async via JMS)
      operationId: sendEmailNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailNotification'
      responses:
        '202':
          description: Email queued for delivery

  /admin/orders:
    get:
      tags:
        - Admin
      summary: Get all orders (paginated and sortable)
      operationId: adminGetOrders
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by order status
        - name: sortBy
          in: query
          schema:
            type: string
          description: Column to sort by (OrderId, OrderDate, OrderAmount, OrderStatus)
      responses:
        '200':
          description: List of orders with pagination and sorting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOrder'

  /admin/orders/{orderId}/approve:
    post:
      tags:
        - Admin
      summary: Approve an order
      operationId: adminApproveOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order approved

  /admin/orders/{orderId}/deny:
    post:
      tags:
        - Admin
      summary: Deny an order
      operationId: adminDenyOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order denied

  /admin/sales/revenue:
    get:
      tags:
        - Admin
      summary: Get revenue metrics
      operationId: adminGetRevenue
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Revenue data for charting
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRevenue:
                    type: number
                  dailyRevenue:
                    type: array
                    items:
                      type: object

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    Item:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        category:
          type: string
        description:
          type: string
        attribute1:
          type: string
        attribute2:
          type: string
        attribute3:
          type: string
        attribute4:
          type: string
        attribute5:
          type: string
        imageLocation:
          type: string
        listPrice:
          type: number
          format: double
        unitCost:
          type: number
          format: double

    Page:
      type: object
      properties:
        items:
          type: array
        start:
          type: integer
        hasNext:
          type: boolean
        startOfNextPage:
          type: integer

    CategoryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    ProductPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'

    ItemPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Item'

    CartItem:
      type: object
      properties:
        itemId:
          type: string
        productId:
          type: string
        category:
          type: string
        name:
          type: string
        attribute:
          type: string
        quantity:
          type: integer
        unitCost:
          type: number
        totalCost:
          type: number

    ShoppingCart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        count:
          type: integer
        subTotal:
          type: number

    ContactInfo:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        telephone:
          type: string

    Address:
      type: object
      properties:
        street1:
          type: string
        street2:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        country:
          type: string

    LineItem:
      type: object
      properties:
        categoryId:
          type: string
        productId:
          type: string
        itemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        quantityShipped:
          type: integer

    PurchaseOrder:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
        email:
          type: string
        orderDate:
          type: string
          format: date-time
        locale:
          type: string
        totalPrice:
          type: number
        billingAddress:
          $ref: '#/components/schemas/Address'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        paymentCard:
          type: object
          properties:
            cardType:
              type: string
            last4Digits:
              type: string
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        status:
          type: string
          enum: [PENDING, APPROVED, COMPLETED, DENIED]

    OrderRequest:
      type: object
      required:
        - billingContact
        - shippingContact
        - billingAddress
        - shippingAddress
        - creditCard
      properties:
        billingContact:
          $ref: '#/components/schemas/ContactInfo'
        shippingContact:
          $ref: '#/components/schemas/ContactInfo'
        billingAddress:
          $ref: '#/components/schemas/Address'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        creditCard:
          type: object
          properties:
            cardNumber:
              type: string
            cardType:
              type: string
            expiryDate:
              type: string
              format: 'MM/yyyy'

    PaymentRequest:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: number
        creditCard:
          type: object
          properties:
            cardNumber:
              type: string
            cardType:
              type: string
            expiryDate:
              type: string

    PaymentResponse:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [APPROVED, DECLINED, ERROR]
        transactionId:
          type: string
        message:
          type: string

    InventoryItem:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: integer

    EmailNotification:
      type: object
      properties:
        email:
          type: string
        subject:
          type: string
        body:
          type: string
        locale:
          type: string

    AdminOrder:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
        orderDate:
          type: string
          format: date
        orderAmount:
          type: number
        orderStatus:
          type: string

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HTTP session-based authentication
