schemaVersion: 1
program:
  key: prd-swhr2-v9
  title: React Pet Store 2 Migration
  source: extraction
capabilities:
  - slug: authentication
    title: User Authentication & Authorization
    order: 1
    dependsOn: []
    change:
      dir: openspec/changes/sx-authentication
      specCapabilities:
        - authentication
    canvas:
      problem: Three distinct user roles (Shopper, Administrator, Supplier Staff) need independent authentication and session management, with admin and supplier sessions mutually exclusive in one browser.
      solution: Form-based authentication with role-based access control, session management per browser, and mutual exclusion logic between admin and supplier applications.
      userStories:
        - As a shopper, I want to sign in with username and password only at checkout, so that I can browse without creating an account.
        - As a shopper, I want my username remembered via cookie, so that I don't re-enter it every visit.
        - As an administrator, I want to sign in before seeing any orders or reports, so that order data is protected.
        - As a supplier staff member, I want to sign in before viewing or updating inventory, so that stock data is protected.
        - As a user with multiple roles, I want to sign out of one role before using another, so that sessions stay isolated.
      acceptanceCriteria:
        - Sign-in is required before checkout for shoppers; optional for browsing
        - Username cookie persists for future visits; password is never stored
        - Admin and supplier sessions cannot coexist in the same browser
        - Admin and supplier sign-in uses distinct login pages
        - Sign-out ends session and clears session data
      outOfScope:
        - OAuth or federated authentication
        - Multi-factor authentication
        - Password reset flows
        - User registration (shoppers self-register at checkout)
      screens:
        - Sign in
  - slug: product-catalog
    title: Product Catalog with Search
    order: 2
    dependsOn: []
    change:
      dir: openspec/changes/sx-product-catalog
      specCapabilities:
        - product-catalog
    canvas:
      problem: Product data is organized in a three-level hierarchy (Category → Product → Item) with search, paging, and multi-locale support across three languages (English, Japanese, Chinese).
      solution: Stateless catalog access with multi-locale hierarchy, full-text search across item names and descriptions, keyword-based item filtering, and paginated result sets.
      userStories:
        - As a shopper, I want to browse categories on the home page, so that I can explore what's available.
        - As a shopper, I want to see products within a category and items within a product, so that I can narrow down my search.
        - As a shopper, I want to search by keyword across items, so that I can find specific pets quickly.
        - As a shopper in Japan or China, I want to see product names and descriptions in my language, so that I can shop in my preferred language.
        - As the system, I want pagination to scale to large catalogs without loading all results, so that browsing stays fast.
      acceptanceCriteria:
        - Five categories ship as reference data (Birds, Cats, Dogs, Fish, Reptiles)
        - Categories, products, and items have localizable names and descriptions
        - Search matches any keyword and returns items with description, price, and add-to-cart
        - Category and product listings show two items per page with Previous and Next links
        - Paging preserves search keywords when navigating result pages
        - Home page shows an image map of categories
        - Sidebar lists categories as links on all pages
      outOfScope:
        - Product reviews or ratings
        - Customer-facing stock levels or availability
        - Dynamic category creation or editing
        - Multiple suppliers or product sourcing
      screens:
        - Home
        - Category listing
        - Product listing
        - Item detail
        - Search results
  - slug: customer-management
    title: Customer Profile Management
    order: 3
    dependsOn:
      - authentication
    change:
      dir: openspec/changes/sx-customer-management
      specCapabilities:
        - customer-management
    canvas:
      problem: Customers need to provide and manage contact information, shipping addresses, payment cards, and profile preferences (language, favorite category, personalization toggles).
      solution: Self-service account creation and editing with form-based data entry, contact information capture, profile preferences, and saved payment card storage.
      userStories:
        - As a shopper, I want to create an account with contact, card, and language preferences in one form, so that checkout is fast next time.
        - As a shopper, I want to view and edit my contact information, so that orders ship to the right place.
        - As a shopper, I want to select a favorite pet category, so that MyList and pet tips show relevant content.
        - As a shopper, I want to switch my language from English to Japanese or Chinese, so that I can shop in my preferred language.
        - As a shopper, I want to toggle MyList and pet tips independently, so that I see only the extras I want.
      acceptanceCriteria:
        - Account creation captures first name, last name, street address (second line optional), city, state/province, postal code, country, telephone, email, card number, card type, expiry, language, favorite category, MyList toggle, pet tips toggle
        - All fields except second address line are required
        - State/province and country are dropdown lists with predefined options
        - Customers can only view and edit their own account
        - Customers cannot change username or password in account settings
        - Checkout form pre-fills addresses and card from account
      outOfScope:
        - Multiple address books
        - Password reset or recovery
        - Account deletion
        - Address validation against postal databases
      screens:
        - Create/edit account
        - Account overview
  - slug: payment-processing
    title: Payment Processing
    order: 4
    dependsOn:
      - customer-management
    change:
      dir: openspec/changes/sx-payment-processing
      specCapabilities:
        - payment-processing
    canvas:
      problem: Payment card details must be captured, stored, and displayed for orders, with validation of card format and expiry, but no real authorization or charging.
      solution: Credit card storage in customer account with validation, card type selection, expiry date capture, and display during checkout and account management.
      userStories:
        - As a shopper, I want to enter my card details once during account creation, so that I don't re-enter them at checkout.
        - As a shopper, I want to edit my card on file, so that I can update expiry or use a different card.
        - As the system, I want to validate card format before storing, so that typos don't break later processing.
      acceptanceCriteria:
        - Card number, type (Java Card, Duke Express, Meow Card), and expiry (month/year) are stored in customer account
        - Card is displayed in full in account overview (security note: tokenization required for production)
        - Checkout uses stored card and does not re-ask for payment details
        - Card type selector provides dropdown list of card brands
      outOfScope:
        - Real payment processing, authorization, or charging
        - Decline handling or retry logic
        - PCI compliance (noted as production requirement)
        - Tokenization or encryption (noted as production requirement)
        - Multiple payment methods per customer
      screens: []
  - slug: shopping-cart
    title: Shopping Cart
    order: 5
    dependsOn:
      - product-catalog
    change:
      dir: openspec/changes/sx-shopping-cart
      specCapabilities:
        - shopping-cart
    canvas:
      problem: Shoppers need to collect items across browsing sessions, adjust quantities, and maintain a running subtotal without committing to purchase until checkout.
      solution: Session-scoped shopping cart with item addition/removal, quantity editing, subtotal calculation, and session termination on sign-out.
      userStories:
        - As a shopper, I want to add items to my cart from category, product, or search result listings, so that I can collect items across multiple pages.
        - As a shopper, I want to adjust quantities in my cart before checking out, so that I can correct mistakes.
        - As a shopper, I want to see a running subtotal, so that I know how much I'm spending.
        - As a shopper, I want to remove items directly from my cart, so that I can change my mind without re-browsing.
        - As a shopper, I want an empty cart message when I have no items, so that I know the cart is really empty.
      acceptanceCriteria:
        - Adding an item already in cart increments quantity instead of adding a second line
        - Quantities are editable per line
        - Quantities are applied on an explicit Update Cart action
        - Setting quantity to zero removes the line
        - Lines can be removed directly without confirmation
        - Running subtotal is recalculated on update
        - Empty cart shows explicit message with no checkout path
        - Cart is session-scoped and cleared on sign-out
      outOfScope:
        - Saved carts or wishlists
        - Cart persistence across sign-outs
        - One-click ordering or quick checkout
        - Recommended items or upsell suggestions
      screens:
        - Shopping cart
  - slug: supplier-management
    title: Supplier Inventory Management
    order: 6
    dependsOn:
      - authentication
      - product-catalog
    change:
      dir: openspec/changes/sx-supplier-management
      specCapabilities:
        - supplier-management
    canvas:
      problem: Supplier staff must update inventory quantities, and every update must notify the Order Processing Centre to re-evaluate approved orders waiting on stock and complete any that can now be filled.
      solution: Supplier portal with authenticated access, inventory table showing current and new quantities, per-row update flags, and batch submission that triggers order fulfillment re-evaluation.
      userStories:
        - As supplier staff, I want to sign in and view current inventory for all items, so that I know what's on the shelf.
        - As supplier staff, I want to update quantities for multiple items and submit together, so that I can process a restock quickly.
        - As supplier staff, I want to confirm which rows are updated via a checkbox, so that I don't accidentally change items.
        - As the system, I want to notify the OPC when inventory changes, so that waiting orders can be completed if stock is now available.
      acceptanceCriteria:
        - Inventory table lists every item with current quantity, new quantity input, and per-row update checkbox
        - Only checked rows are saved; unchecked rows are ignored even if a quantity was entered
        - Entered quantity replaces stored figure (not added to it)
        - Multiple rows can be submitted in one action
        - Every committed change notifies the OPC
        - Supplier receives no customer information, only line items
      outOfScope:
        - Stock reservation at order time
        - Physical inventory reconciliation
        - Supplier PO creation or receipt tracking
        - Multi-warehouse inventory
        - Reorder alerts or automatic replenishment
      screens:
        - Supplier — inventory
  - slug: order-placement
    title: Order Placement & Checkout
    order: 7
    dependsOn:
      - shopping-cart
      - authentication
      - payment-processing
      - customer-management
    change:
      dir: openspec/changes/sx-order-placement
      specCapabilities:
        - order-placement
    canvas:
      problem: Shoppers must move from cart to checkout, provide or confirm addresses, and submit an order asynchronously without waiting for approval or fulfillment.
      solution: Checkout form with billing and shipping address capture (pre-filled from account), payment card confirmation, asynchronous order handoff to OPC, and immediate confirmation with order number.
      userStories:
        - As a shopper, I want to move from cart to checkout and enter my addresses, so that my order ships correctly.
        - As a shopper, I want addresses pre-filled from my account, so that checkout is fast.
        - As a shopper, I want to use different billing and shipping addresses, so that I can send gifts.
        - As a shopper, I want confirmation with an order number immediately, so that I know my order was received.
        - As a shopper, I want checkout validation, so that I don't submit incomplete information.
      acceptanceCriteria:
        - Checkout form captures billing and shipping addresses separately
        - Both addresses are pre-filled from customer account
        - All fields except second address line are validated as non-empty before submission
        - Payment card is taken from stored account card (not re-entered)
        - Checkout with empty cart is rejected to error screen
        - Confirmation screen shows order number and notification email address
        - Order is handed off asynchronously; confirmation does not wait on approval or fulfillment
      outOfScope:
        - Multiple shipping methods or rate calculation
        - Tax calculation
        - Coupon or discount codes
        - Gift options or messaging
        - Order modification after submission
      screens:
        - Checkout
        - Order confirmation
  - slug: order-fulfillment
    title: Order Fulfillment & Lifecycle
    order: 8
    dependsOn:
      - order-placement
      - supplier-management
    change:
      dir: openspec/changes/sx-order-fulfillment
      specCapabilities:
        - order-fulfillment
    canvas:
      problem: Orders flow through a state machine (Pending → Approved → Completed, or Pending → Denied) based on approval threshold and stock availability, with asynchronous processing and email notifications at each transition.
      solution: Order Processing Centre with state machine, threshold-based auto-approval, admin approval for high-value orders, stock-driven completion, and email notification at every status change.
      userStories:
        - As a customer with a low-value order, I want automatic approval without waiting, so that I know my order is cleared right away.
        - As a customer with a high-value order, I want approval to take as long as needed, knowing it's being reviewed, so that the store is protected from fraud.
        - As a customer, I want email notification at every order status change, so that I know what's happening without visiting the site.
        - As the system, I want to complete orders automatically once stock arrives, so that no manual step is needed after approval.
      acceptanceCriteria:
        - Orders under $500 are approved automatically; orders $500+ are set to Pending
        - Approval threshold is a single monetary value applied to order total
        - Every order carries exactly one of four statuses: Pending, Approved, Denied, Completed
        - Approval releases fulfillment request to supplier for each line item
        - Approved orders without stock stay Approved and wait for inventory
        - Orders are marked Completed only when every line is fulfilled
        - Denial is terminal; denied orders cannot return to Pending
        - Each status transition sends customer an email
        - Orders and inventory changes are received and processed durably (asynchronously)
      outOfScope:
        - Configurable approval rules beyond total amount
        - Back-order visibility in admin queue (Approved orders waiting on stock look identical to fresh approvals)
        - Stock reservation at order time
        - Partial fulfillment or backorder splitting
        - Cancellation or refund after order placed
        - Shipment tracking after completion
      screens:
        - Admin — order review
  - slug: notifications
    title: Notifications & Messaging
    order: 9
    dependsOn:
      - order-fulfillment
    change:
      dir: openspec/changes/sx-notifications
      specCapabilities:
        - notifications
    canvas:
      problem: Customers must be notified by email at every order status transition, and notifications must be queued so that mail outages do not block order processing.
      solution: Asynchronous email delivery via message queue, with notifications sent at order submission, approval, denial, and completion.
      userStories:
        - As a customer, I want an email when my order is submitted, so that I have a record.
        - As a customer, I want an email when my order is approved, so that I know it's being processed.
        - As a customer, I want an email when my order is denied, so that I know it was rejected.
        - As a customer, I want an email when my order is completed, so that I know it's shipped.
        - As the system, I want notifications to be queued, so that a mail outage doesn't block order processing.
      acceptanceCriteria:
        - Email sent to order's notification address on each status transition (submitted, approved, denied, completed)
        - Notifications are queued and retried if mail delivery fails
        - Notification content includes order number, status, and customer email
      outOfScope:
        - SMS or push notifications
        - Notification preferences or unsubscribe
        - Transactional email services or templates
        - Notification history or audit trail
      screens: []
  - slug: admin-operations
    title: Administrative Console & Reporting
    order: 10
    dependsOn:
      - authentication
      - order-fulfillment
    change:
      dir: openspec/changes/sx-admin-operations
      specCapabilities:
        - admin-operations
    canvas:
      problem: Administrators need to review pending orders, make approval/denial decisions in batches, and view sales performance by category and date range.
      solution: Admin client with form-based login, order review queue with sortable tables for pending and decided orders, batch approval/denial interface with staged decisions, and sales reporting via pie and bar charts.
      userStories:
        - As an administrator, I want to see pending orders in a sortable queue, so that I can prioritize reviews.
        - As an administrator, I want to approve or deny multiple orders and commit them together, so that I can work through a queue efficiently.
        - As an administrator, I want to see sales by category and date range, so that I can monitor business performance.
        - As an administrator, I want pie and bar charts of sales, so that I can compare category performance visually.
      acceptanceCriteria:
        - Pending orders and decided orders are shown in separate queues
        - Each order shows order number, customer, date, amount, and status
        - Any column can be sorted
        - Administrator can set pending order to Approved or Denied
        - Decisions are staged locally and sent to server only on explicit commit
        - Discarding staged decisions by refreshing requires confirmation
        - Committed decision cannot be reversed from client
        - Decided orders are read-only
        - Sales view shows pie chart (category share) and bar chart (category volume) for chosen date range
        - Date input validated per locale
      outOfScope:
        - User management or permission configuration
        - Report export or scheduling
        - Audit logging of admin actions
        - Configurable approval rules
        - Customer or order data editing
        - Multi-tenant admin support
      screens:
        - Admin — order review
        - Admin — sales reporting

artifacts:
  openapi: api/openapi.yaml
  erd: architecture/erd.mermaid
